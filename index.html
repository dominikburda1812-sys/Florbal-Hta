<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager | Multi-Theme</title>
    <style>
        :root {
            --primary-gold: #fbbf24;
            --secondary-gold: #f59e0b;
            --text-main: #f8fafc;
            --glass: rgba(0, 0, 0, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            /* Barvy pozadí pro sekce */
            --bg-reg: radial-gradient(circle at top, #1e293b, #000);
            --bg-sleep: radial-gradient(circle at top, #1e1b4b, #020617);
            --bg-match: radial-gradient(circle at top, #064e3b, #020617);
            --bg-shop: radial-gradient(circle at top, #451a03, #020617);
            --bg-profile: radial-gradient(circle at top, #0f172a, #000);
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-reg);
            background-attachment: fixed;
            color: var(--text-main); 
            margin: 0; 
            text-align: center; 
            overflow: hidden; 
            transition: background 0.5s ease; /* Plynulá změna pozadí */
        }

        /* Mřížka na pozadí */
        .grid-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 30px 30px; z-index: -1;
        }

        h1, h2 { color: var(--primary-gold); text-transform: uppercase; letter-spacing: 2px; }

        .ui-bar { 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            padding: 15px; border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-around; font-weight: bold;
        }

        .screen { display: none; padding: 15px; height: 82vh; overflow-y: auto; padding-bottom: 100px; box-sizing: border-box; }
        .screen.active { display: block; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .card { 
            background: var(--glass); backdrop-filter: blur(8px);
            border: 1px solid var(--border); border-radius: 20px; 
            padding: 18px; margin: 15px auto; width: 90%; max-width: 400px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        button { 
            background: linear-gradient(135deg, var(--secondary-gold), var(--primary-gold)); 
            border: none; padding: 14px; border-radius: 12px; font-weight: 800; color: #000;
            width: 100%; cursor: pointer; transition: 0.2s;
        }
        button:disabled { background: #334155; color: #64748b; }

        .energy-container { background: rgba(255,255,255,0.1); height: 10px; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .energy-fill { background: #fbbf24; height: 100%; transition: width 0.5s; }

        .nav-bar { 
            position: fixed; bottom: 0; width: 100%; height: 75px; 
            background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);
            display: flex; border-top: 1px solid var(--border); z-index: 100; 
        }
        .nav-item { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #64748b; }
        .nav-item.selected { color: var(--primary-gold); font-size: 30px; }

        #sim-canvas { background: #000; border: 2px solid var(--primary-gold); border-radius: 15px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { color: var(--primary-gold); padding: 10px; border-bottom: 1px solid var(--border); }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .my-team-row { background: rgba(251, 191, 36, 0.2); color: #fff; font-weight: bold; }
    </style>
</head>
<body id="main-body">

<div class="grid-overlay"></div>

<div id="top-ui" style="display:none" class="ui-bar">
    <span>💰 <span id="money">10,000</span></span>
    <span>📊 AVG: <span id="team-avg">1</span></span>
    <span>👥 <span id="player-count">6</span></span>
</div>

<div id="scr-reg" class="screen active">
    <h1>FLORBAL MANAŽER</h1>
    <div class="card">
        <input type="text" id="mgr-name" style="width:85%; padding:12px; border-radius:10px; margin-bottom:15px;" placeholder="JMÉNO MANAŽERA">
        <div id="player-inputs">
            <input type="text" class="p-name" style="width:85%; padding:10px; margin-bottom:5px; border-radius:8px;" placeholder="Hráč 1">
            <input type="text" class="p-name" style="width:85%; padding:10px; margin-bottom:5px; border-radius:8px;" placeholder="Hráč 2">
            <input type="text" class="p-name" style="width:85%; padding:10px; margin-bottom:5px; border-radius:8px;" placeholder="Hráč 3">
            <input type="text" class="p-name" style="width:85%; padding:10px; margin-bottom:5px; border-radius:8px;" placeholder="Hráč 4">
            <input type="text" class="p-name" style="width:85%; padding:10px; margin-bottom:5px; border-radius:8px;" placeholder="Hráč 5">
            <input type="text" class="p-name" style="width:85%; padding:10px; margin-bottom:5px; border-radius:8px;" placeholder="Hráč 6">
        </div>
        <button onclick="createTeam()">ZALOŽIT KLUB</button>
    </div>
</div>

<div id="scr-sleep" class="screen">
    <h2>KABINA 🛌</h2>
    <div id="sleep-list"></div>
</div>

<div id="scr-match" class="screen">
    <h2>LIGA 🏆</h2>
    <div class="card" style="width:95%;"><table id="league-table"><thead><tr><th>#</th><th>TÝM</th><th>LVL</th><th>PTS</th></tr></thead><tbody id="league-body"></tbody></table></div>
    <div class="card"><button onclick="runMatch()">HRÁT ZÁPAS</button><p id="match-timer-text"></p></div>
</div>

<div id="scr-shop" class="screen">
    <h2>OBCHOD 🛒</h2>
    <div id="shop-list"></div>
</div>

<div id="scr-profile" class="screen">
    <h2>PROFIL 👤</h2>
    <div class="card" id="backpack-card"><h3>🎒 BATOH</h3><div id="backpack" style="display:grid; grid-template-columns:repeat(4,1fr); gap:5px;"></div></div>
    <button style="background:#ef4444; color:white; margin-top:20px;" onclick="resetGame()">RESET HRY</button>
</div>

<div id="sim-container" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:1000; padding-top:20px;">
    <h2 id="sim-time-text">0s</h2>
    <canvas id="sim-canvas" width="320" height="200"></canvas>
    <div id="commentary-box" class="card" style="margin-top:20px;">...</div>
</div>

<div id="nav" class="nav-bar" style="display:none">
    <div class="nav-item" id="n-sleep" onclick="nav('sleep')">🛌</div>
    <div class="nav-item selected" id="n-match" onclick="nav('match')">🥅</div>
    <div class="nav-item" id="n-shop" onclick="nav('shop')">🛒</div>
    <div class="nav-item" id="n-profile" onclick="nav('profile')">👤</div>
</div>

<script>
    let db = {
        name: "", money: 10000, lastMatch: 0, matchCount: 0, players: [], inventory: [],
        league: [
            { name: "FK Kuličky", strength: 2, pts: 0 }, { name: "SK Beton", strength: 6, pts: 0 },
            { name: "HC Prach", strength: 10, pts: 0 }, { name: "Lvi z Lhoty", strength: 15, pts: 0 },
            { name: "Můj Tým", strength: 0, pts: 0, isPlayer: true }
        ]
    };

    let simInterval = null, matchTime = 0, isPaused = false, playerDots = [], halfTimeDone = false;

    function save() { localStorage.setItem('fb_mgr_multi_v3', JSON.stringify(db)); }

    function nav(id) {
        const body = document.getElementById('main-body');
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('selected'));
        
        document.getElementById('scr-'+id).classList.add('active');
        document.getElementById('n-'+id).classList.add('selected');

        // ZMĚNA POZADÍ PODLE SEKCE
        if(id === 'sleep') body.style.background = "var(--bg-sleep)";
        else if(id === 'match') body.style.background = "var(--bg-match)";
        else if(id === 'shop') body.style.background = "var(--bg-shop)";
        else if(id === 'profile') body.style.background = "var(--bg-profile)";

        updateUI();
        if(id==='sleep') renderSleep(); if(id==='match') renderLeague(); if(id==='shop') renderShop();
    }

    function createTeam() {
        db.name = document.getElementById('mgr-name').value || "Manažer";
        document.querySelectorAll('.p-name').forEach((input, i) => {
            db.players.push({ name: input.value || ("Hráč "+(i+1)), stat: 1, energy: 100, lastSleep: 0, id: Date.now()+i });
        });
        db.league.find(t => t.isPlayer).name = db.name + " Club";
        document.getElementById('scr-reg').classList.remove('active');
        document.getElementById('top-ui').style.display = 'flex';
        document.getElementById('nav').style.display = 'flex';
        save(); startTimers(); nav('match');
    }

    function getTeamAvg() { return Math.round(db.players.reduce((a, b) => a + b.stat, 0) / db.players.length) || 1; }
    function updateUI() { document.getElementById('money').innerText = db.money.toLocaleString(); document.getElementById('team-avg').innerText = getTeamAvg(); document.getElementById('player-count').innerText = db.players.length; }

    function runMatch() {
        let now = Date.now();
        const ready = db.players.filter(p => p.energy >= 30 && (now - p.lastSleep > 60000));
        if(ready.length < 6) return alert("Hráči spí nebo jsou vyčerpaní!");
        if(now - db.lastMatch < 60000) return alert("Hala je obsazená.");

        db.lastMatch = now; halfTimeDone = false;
        document.getElementById('nav').style.display = 'none';
        document.getElementById('sim-container').style.display = 'block';

        matchTime = 0; isPaused = false; playerDots = [];
        for(let i=0; i<10; i++) playerDots.push({ x: Math.random()*300+10, y: Math.random()*180+10, dx: (Math.random()-0.5)*12, dy: (Math.random()-0.5)*12, color: i<5 ? "#fbbf24" : "#444" });

        simInterval = setInterval(() => {
            if(isPaused) return;
            const ctx = document.getElementById('sim-canvas').getContext('2d');
            ctx.fillStyle = "#000"; ctx.fillRect(0,0,320,200);
            playerDots.forEach(p => {
                p.x += p.dx; p.y += p.dy;
                if(p.x<5 || p.x>315) p.dx *= -1; if(p.y<5 || p.y>195) p.dy *= -1;
                ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, 7); ctx.fill();
            });
            matchTime += 0.033;
            document.getElementById('sim-time-text').innerText = Math.floor(matchTime) + "s";
            if(Math.floor(matchTime) === 15 && !halfTimeDone) {
                halfTimeDone = true; isPaused = true;
                setTimeout(() => isPaused = false, 800);
            }
        }, 30);

        setTimeout(() => {
            clearInterval(simInterval);
            document.getElementById('sim-container').style.display = 'none';
            document.getElementById('nav').style.display = 'flex';
            let win = Math.random() > 0.5;
            if(win) { db.money += 500; db.league.find(t=>t.isPlayer).pts += 3; }
            ready.slice(0,6).forEach(p => { let pDb = db.players.find(x => x.id === p.id); pDb.energy = Math.max(0, pDb.energy - (Math.floor(Math.random()*10)+1)); });
            save(); nav('match'); alert(win ? "VÝHRA!" : "PROHRA.");
        }, 31000);
    }

    function renderSleep() {
        const c = document.getElementById('sleep-list'); c.innerHTML = "";
        db.players.forEach(p => {
            let elap = Date.now() - p.lastSleep;
            let dis = elap < 600000;
            let status = elap < 60000 ? `💤 SPÍ: ${Math.ceil((60000-elap)/1000)}s` : (elap < 600000 ? `⏳ KLID: ${Math.floor((600000-elap)/60000)}m` : "");
            c.innerHTML += `<div class="card"><b>${p.name}</b> | ${p.energy}% <div class="energy-container"><div class="energy-fill" style="width:${p.energy}%"></div></div><small>${status}</small><button onclick="indivSleep(${p.id})" ${dis?'disabled':''}>ODPOČINEK</button></div>`;
        });
    }

    function indivSleep(id) { let p = db.players.find(x=>x.id===id); p.lastSleep = Date.now(); p.energy = 100; save(); renderSleep(); }
    function renderLeague() { const b = document.getElementById('league-body'); b.innerHTML = ""; db.league.sort((x,y)=>y.pts-x.pts).forEach((t, i) => { b.innerHTML += `<tr class="${t.isPlayer?'my-team-row':''}"><td>${i+1}</td><td>${t.name}</td><td>${t.strength}</td><td>${t.pts}</td></tr>`; }); }
    function renderShop() { const l = document.getElementById('shop-list'); l.innerHTML = `<div class="card"><h3>Energeťák</h3><p>1,000 🪙</p><button onclick="buy(1000)">KOUPIT</button></div>`; }
    function buy(p) { if(db.money>=p){ db.money-=p; alert("Koupeno!"); save(); updateUI(); } }
    function startTimers() { setInterval(() => { if(document.getElementById('scr-sleep').classList.contains('active')) renderSleep(); let wait = Math.ceil((60000-(Date.now()-db.lastMatch))/1000); document.getElementById('match-timer-text').innerText = wait>0 ? "Hala se připravuje: "+wait+"s" : "Můžeš hrát!"; }, 1000); }
    function resetGame() { if(confirm("Smazat vše?")) { localStorage.clear(); location.reload(); } }

    window.onload = () => {
        let s = localStorage.getItem('fb_mgr_multi_v3');
        if(s) { db = JSON.parse(s); document.getElementById('scr-reg').classList.remove('active'); document.getElementById('top-ui').style.display='flex'; document.getElementById('nav').style.display='flex'; startTimers(); nav('match'); }
    };
</script>
</body>
</html>
