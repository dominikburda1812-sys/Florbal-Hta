<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager PRO</title>
    <style>
        :root { 
            --accent: #fbbf24; --bg: #0a0e14; --card: #151a21; 
            --text: #e2e8f0; --danger: #ef4444; --warning: #f59e0b; --success: #22c55e;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        
        /* Top Navigation with player count */
        #top-ui { 
            display: none; background: #0f131a; padding: 15px; border-bottom: 1px solid #333; 
            display: flex; justify-content: space-between; align-items: center;
        }
        .stat-group { display: flex; gap: 15px; font-size: 0.9rem; }

        .screen { display: none; padding: 20px; padding-bottom: 120px; }
        .active { display: block; }

        .card { background: var(--card); border: 1px solid #2d3748; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        
        /* Energy Bar Styling */
        .energy-wrapper { height: 8px; background: #2d3748; border-radius: 4px; overflow: hidden; margin: 8px 0; }
        .energy-fill { height: 100%; transition: width 0.6s ease, background-color 0.6s ease; }

        button { 
            background: linear-gradient(135deg, var(--accent), #d97706); border: none; color: #000;
            padding: 14px; border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer; transition: transform 0.2s;
        }
        button:active { transform: scale(0.98); }

        #bot-nav { position: fixed; bottom: 0; width: 100%; height: 80px; background: #0f131a; display: none; justify-content: space-around; align-items: center; border-top: 1px solid #333; }
        .nav-item { font-size: 1.4rem; opacity: 0.5; }
        .nav-item.active { opacity: 1; color: var(--accent); }
    </style>
</head>
<body>

    <div id="top-ui">
        <div class="stat-group">
            <div>🪙 <span id="ui-money" style="color:var(--accent); font-weight:bold;">0</span></div>
            <div>LVL: <span id="ui-lvl" style="color:var(--accent); font-weight:bold;">0</span></div>
        </div>
        <div style="font-size: 0.8rem;">Hráči: <span id="ui-count" style="color:var(--accent); font-weight:bold;">0</span></div>
    </div>

    <div id="scr-match" class="screen active">
        <div class="card" style="text-align:center;">
            <h3>DALŠÍ ZÁPAS</h3>
            <button onclick="playMatch()">START ZÁPASU</button>
        </div>
        <div id="liga-tabulka"></div>
    </div>

    <div id="bot-nav">
        <div class="nav-item" onclick="prepni('sleep')">🛌</div>
        <div class="nav-item active" onclick="prepni('match')">🥅</div>
        <div class="nav-item" onclick="prepni('profile')">👤</div>
        <div class="nav-item" onclick="prepni('shop')">📦</div>
    </div>

<script>
    // Logika energy baru s barvami
    function updateEnergyUI(h) {
        let bar = document.getElementById('e-fill-' + h.id);
        if(!bar) return;
        bar.style.width = h.e + '%';
        if(h.e < 30) bar.style.backgroundColor = 'var(--danger)';
        else if(h.e < 70) bar.style.backgroundColor = 'var(--warning)';
        else bar.style.backgroundColor = 'var(--success)';
    }

        // ... zbytek logiky
    }
</script>
</body>
</html>
