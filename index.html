<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager | Custom Team Edition</title>
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; text-align: center; overflow: hidden; }
        
        .ui-bar { background: var(--card); padding: 10px; border-bottom: 2px solid var(--primary); display: flex; justify-content: space-around; font-weight: bold; font-size: 0.9em; }
        .screen { display: none; padding: 15px; height: 82vh; overflow-y: auto; padding-bottom: 80px; }
        .active { display: block; }

        .card { background: var(--card); border: 1px solid #334155; border-radius: 12px; padding: 10px; margin: 8px auto; width: 90%; max-width: 350px; }
        
        /* FORMULÁŘ PRO TÝM */
        .setup-input { display: block; width: 85%; margin: 8px auto; padding: 12px; border-radius: 8px; border: 1px solid var(--primary); background: #1e293b; color: white; }

        /* BATOH */
        .inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: #0f172a; padding: 10px; border-radius: 10px; border: 1px solid var(--primary); }
        .inv-slot { aspect-ratio: 1; background: #1e293b; border: 1px dashed #475569; border-radius: 5px; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .inv-filled { border-style: solid; border-color: var(--primary); background: #334155; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.8em; }
        th { border-bottom: 2px solid var(--primary); padding: 5px; }
        td { padding: 8px 5px; border-bottom: 1px solid #334155; }
        .my-team-row { background: rgba(56, 189, 248, 0.2); font-weight: bold; }

        button { background: var(--primary); border: none; padding: 12px; border-radius: 8px; font-weight: bold; color: #0f172a; width: 100%; margin: 5px 0; cursor: pointer; }
        button:disabled { background: #475569; opacity: 0.5; }
        
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 65px; background: var(--card); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #334155; z-index: 100; }
        .nav-item { font-size: 24px; color: #64748b; cursor: pointer; flex: 1; }
        .nav-item.selected { color: var(--primary); }

        #sim-canvas { background: #15803d; border: 2px solid white; display: none; margin: 10px auto; border-radius: 5px; }
    </style>
</head>
<body>

<div id="top-ui" style="display:none" class="ui-bar">
    <span>🪙 <span id="money">0</span></span>
    <span>📊 Tým: <span id="team-avg">0</span></span>
    <span>👥 <span id="player-count">0</span>/20</span>
</div>

<div id="scr-reg" class="screen active">
    <h1>VYTVOŘ SVŮJ TÝM</h1>
    <p>Zadej jméno manažera a svých 6 hráčů:</p>
    <input type="text" id="mgr-name" class="setup-input" placeholder="Jméno Manažera">
    <div id="player-inputs">
        <input type="text" class="setup-input p-name" placeholder="Hráč 1">
        <input type="text" class="setup-input p-name" placeholder="Hráč 2">
        <input type="text" class="setup-input p-name" placeholder="Hráč 3">
        <input type="text" class="setup-input p-name" placeholder="Hráč 4">
        <input type="text" class="setup-input p-name" placeholder="Hráč 5">
        <input type="text" class="setup-input p-name" placeholder="Hráč 6">
    </div>
    <button onclick="createTeam()">ZALOŽIT KLUB</button>
</div>

<div id="scr-sleep" class="screen">
    <h2>REGENERACE 😴</h2>
    <div id="sleep-list"></div>
</div>

<div id="scr-match" class="screen">
    <h2>LIGOVÁ TABULKA 🏆</h2>
    <div class="card" style="width:95%; max-width:none;">
        <table id="league-table">
            <thead><tr><th>#</th><th>Tým</th><th>Síla</th><th>B</th></tr></thead>
            <tbody id="league-body"></tbody>
        </table>
    </div>
    <canvas id="sim-canvas" width="300" height="200"></canvas>
    <button id="match-btn" onclick="runMatch()">HRÁT ZÁPAS (+500 🪙)</button>
    <p id="match-timer-text" style="font-size:0.7em; color:#94a3b8;"></p>
</div>

<div id="scr-shop" class="screen">
    <h2>OBCHOD 🛒</h2>
    <div class="card" style="background: #1e3a8a;">
        <p>Úroveň obchodu: <span id="shop-lvl">1</span></p>
        <p>Max. stat hráče: <span id="shop-max-stat">10</span></p>
        <button onclick="upgradeShop()" id="up-shop-btn">Vylepšit (50 000 🪙)</button>
    </div>
    <div id="shop-list"></div>
</div>

<div id="scr-profile" class="screen">
    <h2 id="prof-name">Manažer</h2>
    <div class="card">
        <h3>🎒 BATOH (INVENTÁŘ)</h3>
        <p style="font-size: 0.7em;">Místo: <span id="inv-count">0</span> / 20</p>
        <div class="inventory-grid" id="backpack"></div>
    </div>
    <div class="card">
        <p>Zlatáky celkem: <span id="stat-earned">0</span></p>
        <button style="background:#ef4444; color: white;" onclick="resetGame()">RESET HRY</button>
    </div>
</div>

<div id="nav" class="nav-bar" style="display:none">
    <div class="nav-item" id="n-sleep" onclick="nav('sleep')">🛏️</div>
    <div class="nav-item selected" id="n-match" onclick="nav('match')">🥅</div>
    <div class="nav-item" id="n-shop" onclick="nav('shop')">🛒</div>
    <div class="nav-item" id="n-profile" onclick="nav('profile')">👤</div>
</div>

<script>
    let db = {
        name: "", money: 10000, earned: 10000, shopLvl: 1, lastMatch: 0,
        players: [], inventory: [],
        league: [
            { name: "FK Kuličky", strength: 2, pts: 0 },
            { name: "SK Beton", strength: 5, pts: 0 },
            { name: "HC Prach", strength: 8, pts: 0 },
            { name: "Lvi z Lhoty", strength: 12, pts: 0 },
            { name: "Můj Tým", strength: 0, pts: 0, isPlayer: true }
        ]
    };

    function createTeam() {
        db.name = document.getElementById('mgr-name').value || "Manažer";
        let playerInputs = document.querySelectorAll('.p-name');
        
        playerInputs.forEach((input, i) => {
            let name = input.value || ("Hráč " + (i+1));
            db.players.push({ name: name, stat: 1, energy: 100, id: Date.now() + i });
        });

        db.league.find(t => t.isPlayer).name = "Tým " + db.name;
        
        document.getElementById('scr-reg').classList.remove('active');
        document.getElementById('top-ui').style.display = 'flex';
        document.getElementById('nav').style.display = 'flex';
        
        save();
        startTimers(); 
        nav('match');
    }

    function getTeamAvg() {
        if(db.players.length === 0) return 0;
        let sum = db.players.reduce((a, b) => a + b.stat, 0);
        return Math.round(sum / db.players.length);
    }

    function runMatch() {
        const readyPlayers = db.players.filter(p => p.energy >= 30);
        if(readyPlayers.length < 6) return alert("Potřebuješ 6 hráčů s energií!");
        if(Date.now() - db.lastMatch < 60000) return alert("Počkej na další zápas!");

        let myPower = getTeamAvg();
        let opp = db.league.filter(t => !t.isPlayer)[Math.floor(Math.random()*4)];
        
        let winChance = 0.5;
        let diff = myPower - opp.strength;
        if(diff === 0) winChance = 0.5;
        else if(diff === 1) winChance = 0.75;
        else if(diff >= 2) winChance = 0.99;
        else if(diff === -1) winChance = 0.1;
        else winChance = 0.01;

        db.lastMatch = Date.now();
        document.getElementById('sim-canvas').style.display = "block";
        
        setTimeout(() => {
            document.getElementById('sim-canvas').style.display = "none";
            if(Math.random() < winChance) {
                db.money += 500; db.earned += 500;
                db.league.find(t => t.isPlayer).pts += 3;
                alert("VÝHRA proti " + opp.name + "! (+500 🪙)");
            } else {
                alert("PROHRA! " + opp.name + " byl nad tvé síly.");
            }
            db.players.slice(0,6).forEach(p => p.energy -= 10);
            db.league.forEach(t => { if(!t.isPlayer) t.pts += (Math.random() > 0.5 ? 3 : 0); });
            save(); updateUI(); renderLeague();
        }, 2500);
    }

    function generateShop() {
        let maxStat = db.shopLvl * 10;
        db.shopItems = [];
        for(let i=0; i<2; i++) {
            let s = Math.floor(Math.random() * maxStat) + 1;
            let price = 10000 + (s * 900); 
            db.shopItems.push({ type: 'player', stat: s, price: price, name: "Posila Lvl " + s });
        }
        if(Math.random() > 0.5) db.shopItems.push({ type: 'item', name: '⚡ Energeťák', price: 1000, icon: '🥤' });
        renderShop();
    }

    function buyShop(idx) {
        let item = db.shopItems[idx];
        if(db.money < item.price) return alert("Nedostatek financí!");
        
        if(item.type === 'player') {
            db.money -= item.price;
            db.players.push({ name: item.name, stat: item.stat, energy: 100, id: Date.now() });
        } else {
            if(db.inventory.length >= 20) return alert("Plný batoh!");
            db.money -= item.price;
            db.inventory.push(item);
        }
        db.shopItems.splice(idx, 1);
        save(); updateUI(); renderShop(); renderBackpack();
    }

    function upgradeShop() {
        let cost = db.shopLvl * 50000;
        if(db.money >= cost) {
            db.money -= cost; db.shopLvl++;
            save(); updateUI(); generateShop();
        } else alert("Potřebuješ " + cost + " 🪙");
    }

    function renderBackpack() {
        const grid = document.getElementById('backpack');
        grid.innerHTML = "";
        for(let i=0; i<20; i++) {
            let item = db.inventory[i];
            grid.innerHTML += `<div class="inv-slot ${item ? 'inv-filled' : ''}">${item ? item.icon : ''}</div>`;
        }
        document.getElementById('inv-count').innerText = db.inventory.length;
    }

    function renderLeague() {
        const body = document.getElementById('league-body');
        body.innerHTML = "";
        let pTeam = db.league.find(t => t.isPlayer);
        pTeam.strength = getTeamAvg();
        db.league.sort((a,b) => b.pts - a.pts).forEach((t, i) => {
            body.innerHTML += `<tr class="${t.isPlayer ? 'my-team-row' : ''}"><td>${i+1}</td><td>${t.name}</td><td>${t.strength}</td><td>${t.pts}</td></tr>`;
        });
    }

    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('selected'));
        document.getElementById('scr-'+id).classList.add('active');
        document.getElementById('n-'+id).classList.add('selected');
        updateUI();
        if(id === 'profile') renderBackpack();
        if(id === 'shop') renderShop();
        if(id === 'match') renderLeague();
        if(id === 'sleep') renderSleep();
    }

    function updateUI() {
        document.getElementById('money').innerText = db.money;
        document.getElementById('team-avg').innerText = getTeamAvg();
        document.getElementById('player-count').innerText = db.players.length;
        document.getElementById('shop-lvl').innerText = db.shopLvl;
        document.getElementById('shop-max-stat').innerText = db.shopLvl * 10;
        document.getElementById('up-shop-btn').innerText = "Vylepšit (" + (db.shopLvl * 50000) + " 🪙)";
    }

    function renderSleep() {
        const cont = document.getElementById('sleep-list');
        cont.innerHTML = "";
        db.players.forEach(p => {
            cont.innerHTML += `<div class="card">
                <b>${p.name}</b> (${p.energy}%)
                <div class="energy-bar"><div class="energy-fill" style="width:${p.energy}%"></div></div>
            </div>`;
        });
    }

    function renderShop() {
        const cont = document.getElementById('shop-list');
        cont.innerHTML = "";
        db.shopItems.forEach((item, i) => {
            cont.innerHTML += `<div class="card">
                <h3>${item.name}</h3>
                <p>Cena: ${item.price} 🪙</p>
                <button onclick="buyShop(${i})">KOUPIT</button>
            </div>`;
        });
    }

    function startTimers() {
        setInterval(() => {
            db.players.forEach(p => { if(p.energy < 100) p.energy = Math.min(100, p.energy + 1); });
            let sec = Math.ceil((60000 - (Date.now() - db.lastMatch)) / 1000);
            document.getElementById('match-timer-text').innerText = sec > 0 ? "Příprava haly: " + sec + "s" : "Můžeš hrát!";
            if(document.getElementById('scr-sleep').classList.contains('active')) renderSleep();
        }, 1000);
    }

    function save() { localStorage.setItem('fb_mgr_custom_v1', JSON.stringify(db)); }
    function resetGame() { if(confirm("Smazat tým a kariéru?")) { localStorage.clear(); location.reload(); } }

    window.onload = () => {
        let saved = localStorage.getItem('fb_mgr_custom_v1');
        if(saved) {
            db = JSON.parse(saved);
            document.getElementById('scr-reg').classList.remove('active');
            document.getElementById('top-ui').style.display = 'flex';
            document.getElementById('nav').style.display = 'flex';
            nav('match'); startTimers(); updateUI();
        }
    };
</script>
</body>
</html>
