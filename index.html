<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager v9.5 Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #05080f; --surface: rgba(19, 28, 42, 0.85); --surface-border: rgba(255, 255, 255, 0.1);
            --accent: #00ff88; --text: #e2e8f0; --text-muted: #94a3b8;
            --blue: #3b82f6; --red: #ef4444; --gold: #fbbf24; --gold-glow: rgba(251, 191, 36, 0.4);
            --field: linear-gradient(180deg, #022c22 0%, #064e3b 100%);
            /* Rarities */
            --r-basic: #94a3b8; --r-medium: #22c55e; --r-rare: #3b82f6; --r-epic: #a855f7;
        }

        /* GLOBÁLNÍ STYLY */
        body { font-family: 'Montserrat', sans-serif; color: var(--text); margin: 0; background: var(--bg); overflow-x: hidden; user-select: none; }
        .card { background: var(--surface); backdrop-filter: blur(10px); border: 1px solid var(--surface-border); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); position: relative; overflow: hidden; }
        
        /* TROPHY ROAD - VYLEPŠENÝ DESIGN */
        .tr-progress-container { width: 100%; height: 12px; background: rgba(0,0,0,0.5); border-radius: 6px; margin: 15px 0; overflow: hidden; border: 1px solid var(--surface-border); }
        .tr-progress-fill { height: 100%; background: linear-gradient(90deg, #f97316, #fbbf24); transition: width 1s ease-in-out; box-shadow: 0 0 10px var(--gold-glow); }

        /* ZÁPASOVÁ ANIMACE - PLYNULOST */
        .player-dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; z-index: 5; transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .ball { position: absolute; width: 10px; height: 10px; background: #fff; border-radius: 50%; z-index: 10; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 0 15px #fff; }

        /* TABULKA */
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; color: var(--text-muted); padding: 10px; border-bottom: 1px solid var(--surface-border); font-size: 0.7rem; text-transform: uppercase; }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .highlight { background: rgba(0, 255, 136, 0.05); }

        /* TLAČÍTKA OBCHODU */
        .shop-btn-container { display: flex; flex-direction: column; gap: 10px; }
        .btn-buy { position: relative; overflow: hidden; }
        .btn-buy::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: rgba(255,255,255,0.1); transform: rotate(45deg); transition: 0.3s; pointer-events: none; }
        .btn-buy:hover::after { left: 100%; }

        /* Kopíruji zbytek tvých původních stylů pro zachování layoutu... */
        #top-ui { display: none; background: rgba(5, 8, 15, 0.9); backdrop-filter: blur(20px); padding: 15px 20px; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--surface-border); position: sticky; top: 0; z-index: 1000; }
        .screen { display: none; padding: 20px; padding-bottom: 120px; animation: fade 0.4s ease; }
        .active { display: block; }
        @keyframes fade { from { opacity: 0; filter: blur(10px); } to { opacity: 1; filter: blur(0); } }
        
        /* (Vynecháno pro stručnost, v kódu zůstává tvůj CSS pro tactical field, nav atd.) */
        .tactical-field { width: 100%; height: 280px; background: rgba(255,255,255,0.02); border: 2px solid var(--surface-border); border-radius: 16px; position: relative; overflow: hidden; }
        .pos-slot { position: absolute; width: 56px; height: 56px; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; cursor: pointer; z-index: 10; }
        .pos-avatar { width: 44px; height: 44px; border-radius: 50%; background: #000; border: 2px solid var(--surface-border); overflow: hidden; display: flex; justify-content: center; align-items: flex-end; position: relative; }
        .pos-avatar img { width: 90%; height: 90%; }
        .pos-lvl { position: absolute; bottom: -8px; background: var(--accent); color: #000; font-size: 0.7rem; font-weight: 900; padding: 2px 6px; border-radius: 8px; border: 2px solid #022c22; }
        #p-GK { top: 85%; left: 50%; } #p-LD { top: 65%; left: 25%; } #p-RD { top: 65%; left: 75%; }
        #p-LW { top: 35%; left: 20%; } #p-C { top: 40%; left: 50%; } #p-RW { top: 35%; left: 80%; }
        #bot-nav { display: none; position: fixed; bottom: 0; width: 100%; height: 70px; background: rgba(5, 8, 15, 0.95); border-top: 1px solid var(--surface-border); z-index: 1000; justify-content: space-around; align-items: center; }
        .nav-item { display: flex; flex-direction: column; align-items: center; opacity: 0.4; }
        .nav-item.active { opacity: 1; color: var(--accent); }
        .nav-icon { width: 24px; height: 24px; fill: currentColor; }
        .nav-text { font-size: 0.6rem; font-weight: 700; margin-top: 4px; }
        button { background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: 900; width: 100%; cursor: pointer; text-transform: uppercase; }
        button:disabled { opacity: 0.3; }
        .stat-badge { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 12px; font-weight: 800; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
        .bag-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .bag-slot { aspect-ratio: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--surface-border); border-radius: 12px; display: flex; justify-content: center; align-items: center; position: relative; }
        .rarity-badge { font-size: 0.6rem; font-weight: 900; padding: 2px 6px; border-radius: 4px; border: 1px solid currentColor; }
    </style>
</head>
<body>

    <div id="top-ui">
        <div style="display:flex; gap:10px;">
            <div class="stat-badge"><span style="color:var(--gold)">🪙</span> <span id="ui-money">0</span></div>
            <div class="stat-badge"><span style="color:#f97316">🏆</span> <span id="ui-trophies">0</span></div>
        </div>
        <div class="stat-badge" style="color:var(--accent)">SÍLA <span id="ui-lvl">0</span></div>
    </div>

    <div id="scr-match" class="screen active">
        <div class="card" style="border-color: #f97316; cursor: pointer;" onclick="openTrophyRoad()">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0; font-size:0.9rem; color:#f97316;">TROPHY ROAD</h3>
                <span id="next-goal" style="font-size:0.7rem; font-weight:900;">CÍL: 500 🏆</span>
            </div>
            <div class="tr-progress-container">
                <div id="tr-progress-bar" class="tr-progress-fill" style="width: 0%"></div>
            </div>
        </div>

        <div id="match-area" style="width:100%; height:240px; border-radius:16px; position:relative; overflow:hidden; display:none; background:var(--field); border:2px solid rgba(255,255,255,0.1); margin-bottom:20px;">
            <div id="m-ball" class="ball" style="top:50%; left:50%;"></div>
            <div id="players-layer"></div>
            <div style="position:absolute; top:10px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); padding:5px 15px; border-radius:10px; font-family:'Orbitron';">
                <span id="score-h">0</span> : <span id="score-a">0</span>
            </div>
        </div>

        <button id="btn-play" onclick="initMatch()">ZAHÁJIT ZÁPAS</button>
        <div id="match-cooldown-ui" style="display:none; text-align:center; margin-top:20px;">
            <span style="color:var(--text-muted)">Regenerace týmu...</span>
            <h2 id="cd-timer" style="color:var(--accent); font-family:'Orbitron';">30</h2>
        </div>

        <div class="card" style="margin-top:20px; padding:10px;">
            <h3 style="font-size:0.8rem; margin-bottom:10px;">LIGOVÁ TABULKA</h3>
            <div id="liga-tabulka"></div>
        </div>
    </div>

    <div id="scr-profile" class="screen">
        <h3>Taktická sestava</h3>
        <div class="tactical-field">
            <div class="pos-slot" id="p-GK" onclick="openSelect('GK')"><div class="pos-avatar" id="av-GK"></div><div class="pos-lvl" id="lvl-GK">-</div></div>
            <div class="pos-slot" id="p-LD" onclick="openSelect('LD')"><div class="pos-avatar" id="av-LD"></div><div class="pos-lvl" id="lvl-LD">-</div></div>
            <div class="pos-slot" id="p-RD" onclick="openSelect('RD')"><div class="pos-avatar" id="av-RD"></div><div class="pos-lvl" id="lvl-RD">-</div></div>
            <div class="pos-slot" id="p-LW" onclick="openSelect('LW')"><div class="pos-avatar" id="av-LW"></div><div class="pos-lvl" id="lvl-LW">-</div></div>
            <div class="pos-slot" id="p-C" onclick="openSelect('C')"><div class="pos-avatar" id="av-C"></div><div class="pos-lvl" id="lvl-C">-</div></div>
            <div class="pos-slot" id="p-RW" onclick="openSelect('RW')"><div class="pos-avatar" id="av-RW"></div><div class="pos-lvl" id="lvl-RW">-</div></div>
        </div>
        <div id="select-box"></div>
        <h3>Batoh</h3>
        <div class="bag-grid" id="bag-ui"></div>
    </div>

    <div id="scr-sleep" class="screen">
        <h3>Kabina (Energie)</h3>
        <div id="hraci-list"></div>
    </div>

    <div id="scr-shop" class="screen">
        <h3>Obchod</h3>
        <div class="shop-btn-container">
            <button class="btn-buy" id="shop-bronz" onclick="buyPack('bronz')">BRONZOVÝ BALÍČEK (5 000 🪙)</button>
            <button class="btn-buy" id="shop-silver" onclick="buyPack('silver')" style="background:#94a3b8">STŘÍBRNÝ BALÍČEK (10 000 🪙)</button>
            <button class="btn-buy" id="shop-gold" onclick="buyPack('gold')" style="background:var(--gold)">ZLATÝ BALÍČEK (15 000 🪙)</button>
        </div>
    </div>

    <div id="bot-nav">
        <div class="nav-item" onclick="prepni('sleep')"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 4v16h20V4H2zm2 2h16v12H4V6zm3 2v2h10V8H7zm0 4v2h10v-2H7zm0 4v2h7v-2H7z"/></svg><div class="nav-text">KABINA</div></div>
        <div class="nav-item active" onclick="prepni('match')"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg><div class="nav-text">ZÁPAS</div></div>
        <div class="nav-item" onclick="prepni('profile')"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><div class="nav-text">TÝM</div></div>
        <div class="nav-item" onclick="prepni('shop')"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg><div class="nav-text">OBCHOD</div></div>
    </div>

<script>
    // DATA INICIALIZACE
    let db = JSON.parse(localStorage.getItem('fb_v9_5')) || {
        m: 10000, trophies: 0, p: [], lineup: {GK:null,LD:null,RD:null,LW:null,C:null,RW:null},
        b: Array(20).fill(null), sticks: [], shop: { bronz: true, silver: true, gold: true },
        league: [{n:"Tatran",pts:12},{n:"Boleslav",pts:10}], lastMatchEnd: 0
    };

    function save() { localStorage.setItem('fb_v9_5', JSON.stringify(db)); }
    function getAvatarUrl(seed) { return `https://api.dicebear.com/9.x/adventurer/svg?seed=${seed}`; }
    
    function getRarity(lvl) {
        if(lvl < 10) return {n:'BASIC', c:'var(--r-basic)'};
        if(lvl < 20) return {n:'MEDIUM', c:'var(--r-medium)'};
        if(lvl < 30) return {n:'RARE', c:'var(--r-rare)'};
        return {n:'EPIC', c:'var(--r-epic)'};
    }

    // PŘEPÍNÁNÍ OBRAZOVEK
    function prepni(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('scr-' + id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if(id === 'profile') { renderField(); renderBag(); }
        if(id === 'sleep') renderSleep();
        updateUI();
    }

    // UPDATE UI (Trophy bar, Peníze, atd.)
    function updateUI() {
        document.getElementById('ui-money').innerText = db.m.toLocaleString();
        document.getElementById('ui-trophies').innerText = db.trophies;
        
        // Trophy Road progress
        let progress = (db.trophies / 500) * 100;
        document.getElementById('tr-progress-bar').style.width = Math.min(progress, 100) + "%";
        
        let sum = 0, count = 0;
        for(let pos in db.lineup) {
            let h = db.p.find(x => x.id === db.lineup[pos]);
            if(h) { sum += h.lvl; count++; }
        }
        db.avgLvl = count > 0 ? Math.round(sum/count) : 0;
        document.getElementById('ui-lvl').innerText = db.avgLvl;
        
        // Shop buttons
        document.getElementById('shop-bronz').disabled = db.m < 5000;
        document.getElementById('shop-silver').disabled = db.m < 10000;
        document.getElementById('shop-gold').disabled = db.m < 15000;
    }

    // LOGIKA ZÁPASU S PLYNULOU ANIMACÍ
    function initMatch() {
        let now = Date.now();
        if(now < db.lastMatchEnd + 30000) return;
        
        document.getElementById('match-area').style.display = 'block';
        document.getElementById('btn-play').style.display = 'none';
        
        let ball = document.getElementById('m-ball');
        let layer = document.getElementById('players-layer');
        layer.innerHTML = "";
        
        let dots = [];
        for(let i=0; i<12; i++) {
            let d = document.createElement('div');
            d.className = 'player-dot';
            d.style.backgroundColor = i < 6 ? 'var(--blue)' : 'var(--red)';
            layer.appendChild(d);
            dots.push(d);
        }

        let time = 0;
        let matchInterval = setInterval(() => {
            time++;
            // Plynulý pohyb hráčů
            dots.forEach(d => {
                d.style.left = Math.random() * 90 + "%";
                d.style.top = Math.random() * 85 + "%";
            });
            
            // Míček sleduje náhodného hráče
            let leader = dots[Math.floor(Math.random()*12)];
            ball.style.left = leader.style.left;
            ball.style.top = leader.style.top;

            if(time > 10) {
                clearInterval(matchInterval);
                finishMatch();
            }
        }, 800);
    }

    function finishMatch() {
        let win = Math.random() > 0.5;
        let reward = win ? 750 : 100;
        let tReward = win ? 25 : 5;
        
        db.m += reward;
        db.trophies += tReward;
        db.lastMatchEnd = Date.now();
        
        alert(win ? `Vítězství! +${reward} 🪙` : `Prohra. +${reward} 🪙`);
        document.getElementById('match-area').style.display = 'none';
        save();
        updateUI();
    }

    // SYSTÉM REGENERACE
    function renderSleep() {
        let div = document.getElementById('hraci-list');
        div.innerHTML = "";
        db.p.forEach(h => {
            let r = getRarity(h.lvl);
            div.innerHTML += `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="display:flex; gap:10px; align-items:center;">
                        <img src="${getAvatarUrl(h.id)}" style="width:40px; border-radius:50%; border: 2px solid ${r.c}">
                        <div>
                            <b>${h.n}</b> <span class="rarity-badge" style="color:${r.c}">${r.n}</span><br>
                            <small>Energie: ${h.e}%</small>
                        </div>
                    </div>
                    <button onclick="h.e=100; save(); renderSleep();" style="width:auto; padding:5px 10px; font-size:0.7rem;">DOPLNIT</button>
                </div>`;
        });
    }

    // Iniciační funkce pro start
    window.onload = () => {
        // Pokud je prázdný tým, vygeneruj základ
        if(db.p.length === 0) {
            const pos = ["GK","LD","RD","LW","C","RW"];
            pos.forEach(p => {
                db.p.push({id: Date.now()+Math.random(), n: "Hráč "+p, lvl: 1, pos: p, e: 100});
            });
            save();
        }
        updateUI();
        renderLeague();
    };

    function renderLeague() {
        let html = "<table><tr><th>KLUB</th><th>BODY</th></tr>";
        db.league.forEach(t => {
            html += `<tr><td>${t.n}</td><td>${t.pts}</td></tr>`;
        });
        document.getElementById('liga-tabulka').innerHTML = html + "</table>";
    }
</script>
</body>
</html>
