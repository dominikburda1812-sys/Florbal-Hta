<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager Pro 2026</title>
    <style>
        :root { --gold: #fbbf24; --glass: rgba(0,0,0,0.85); --border: rgba(251,191,36,0.3); }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; color: white; background: #000; overflow: hidden; }
        .ui-bar { background: #111; padding: 10px; display: flex; justify-content: space-around; border-bottom: 2px solid var(--gold); font-weight: bold; }
        .screen { display: none; padding: 15px; height: 85vh; overflow-y: auto; box-sizing: border-box; padding-bottom: 100px; }
        .active { display: block; }
        
        /* TABULKA */
        .stat-table { width: 100%; border-collapse: collapse; margin-top: 10px; background: var(--glass); border-radius: 8px; overflow: hidden; }
        .stat-table th, .stat-table td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        .stat-table th { background: #222; color: var(--gold); }

        /* PACK REVEAL */
        #pack-opener { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 6000; flex-direction: column; align-items: center; justify-content: center; }
        .reveal-card { width: 200px; height: 280px; background: #fff; border: 8px solid var(--gold); border-radius: 20px; color: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: flip 0.6s; }
        @keyframes flip { from { transform: rotateY(90deg); } to { transform: rotateY(0); } }

        /* SIMULACE */
        #sim-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #064e3b; z-index: 5000; }
        .tv-score { display: flex; width: 100%; background: #000; border-bottom: 2px solid var(--gold); }
        .score-box { flex: 1; padding: 10px; font-weight: bold; text-align: center; }
        
        .card { background: var(--glass); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin: 10px auto; width: 92%; }
        button { background: linear-gradient(135deg, #f59e0b, #fbbf24); border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

<div id="top-ui" style="display:none" class="ui-bar">
    <span>💰 <span id="money">0</span></span>
    <span>📊 AVG: <span id="avg">0</span></span>
    <span>👥 <span id="p-count">0</span></span>
</div>

<div id="scr-reg" class="screen active">
    <h1>FLORBAL MANAŽER 26</h1>
    <div class="card">
        <input type="text" id="mgr-name" placeholder="NÁZEV TÝMU" style="width:90%; padding:10px; margin-bottom:15px;">
        <div id="player-setup">
            <input type="text" class="p-init" value="Hráč 1" style="width:45%;">
            <input type="text" class="p-init" value="Hráč 2" style="width:45%;">
            <input type="text" class="p-init" value="Hráč 3" style="width:45%;">
            <input type="text" class="p-init" value="Hráč 4" style="width:45%;">
            <input type="text" class="p-init" value="Hráč 5" style="width:45%;">
            <input type="text" class="p-init" value="Hráč 6" style="width:45%;">
        </div>
        <button onclick="createTeam()" style="margin-top:20px;">ZAČÍT KARIÉRU</button>
    </div>
</div>

<div id="scr-match" class="screen">
    <h2>LIGOVÁ TABULKA</h2>
    <table class="stat-table">
        <thead><tr><th>Tým</th><th>AVG</th><th>Body</th></tr></thead>
        <tbody id="league-body"></tbody>
    </table>
    <div class="card" style="margin-top:20px;">
        <button id="btn-match" onclick="runMatch()">ODEHRÁT ZÁPAS</button>
    </div>
</div>

<div id="scr-shop" class="screen">
    <h2>DRAFT HRÁČŮ 📦</h2>
    <div class="card" onclick="buyPack('bronze')">BRONZ (5 000 🪙) <br><small>LVL 1-9 + Drinky</small></div>
    <div class="card" onclick="buyPack('silver')">STŘÍBRO (10 000 🪙) <br><small>LVL 10-19 + Drinky</small></div>
    <div class="card" onclick="buyPack('gold')">ZLATO (15 000 🪙) <br><small>LVL 20-29 + Drinky</small></div>
</div>

<div id="scr-sleep" class="screen"><h2>KABINA 🛌</h2><div id="sleep-list"></div></div>
<div id="scr-profile" class="screen"><h2>BATOH 🎒</h2><div id="backpack" style="display:grid; grid-template-columns:repeat(5,1fr); gap:5px;"></div></div>

<div id="pack-opener">
    <div id="p-reveal" style="font-size:5em; color:var(--gold); font-weight:bold;">?</div>
    <div id="p-loot" style="margin:20px; color:var(--gold);"></div>
    <button id="p-close" style="display:none; width:200px;" onclick="closePack()">PŘIDAT DO TÝMU</button>
</div>

<div id="sim-screen">
    <div class="tv-score">
        <div class="score-box" id="tv-h">DOM</div>
        <div class="score-box" style="background:var(--gold); color:black;"><span id="s-h">0</span>:<span id="s-a">0</span></div>
        <div class="score-box" id="tv-a">HOS</div>
    </div>
    <h2 id="timer" style="text-align:center;">30</h2>
    <canvas id="sim-canvas" style="width:100%; height:50vh;"></canvas>
    <div id="sim-msg" style="text-align:center; padding:15px; color:var(--gold);"></div>
</div>

<div id="nav" class="ui-bar" style="display:none; position:fixed; bottom:0; width:100%; border-top:2px solid var(--gold);">
    <span onclick="nav('sleep')">🛌</span>
    <span onclick="nav('match')">🥅</span>
    <span onclick="nav('shop')">📦</span>
    <span onclick="nav('profile')">🎒</span>
</div>

<script>
    let db = { money: 10000, players: [], inventory: [], matchesPlayed: 0, 
               league: [ {n: "FBC Lvi", a: 5, p: 0}, {n: "Tatran", a: 12, p: 0}, {n: "Boleslav", a: 22, p: 0} ] };

    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('scr-'+id).classList.add('active');
        if(id==='match') renderLeague();
        if(id==='sleep') renderSleep();
        if(id==='profile') renderBackpack();
        updateUI();
    }

    function createTeam() {
        db.teamName = document.getElementById('mgr-name').value || "Můj Tým";
        document.querySelectorAll('.p-init').forEach((el, i) => {
            db.players.push({name: el.value, stat: 1, energy: 100, id: Date.now()+i, sleepUntil: 0, lastSleep: 0});
        });
        db.league.push({n: db.teamName, a: 1, p: 0, isPlayer: true});
        document.getElementById('scr-reg').style.display='none';
        document.getElementById('nav').style.display='flex';
        document.getElementById('top-ui').style.display='flex';
        save(); nav('match');
    }

    function updateUI() {
        document.getElementById('money').innerText = db.money.toLocaleString();
        let avg = db.players.length ? Math.round(db.players.reduce((a,b)=>a+b.stat,0)/db.players.length) : 0;
        document.getElementById('avg').innerText = avg;
        document.getElementById('p-count').innerText = db.players.length;
        let pT = db.league.find(t=>t.isPlayer); if(pT) pT.a = avg;
        document.getElementById('btn-match').disabled = db.players.filter(p => p.sleepUntil < Date.now()).length < 6;
    }

    function buyPack(type) {
        let costs = {bronze: 5000, silver: 10000, gold: 15000};
        if(db.money < costs[type]) return alert("Nemáš dost peněz!");
        db.money -= costs[type];
        
        document.getElementById('pack-opener').style.display = 'flex';
        document.getElementById('p-close').style.display = 'none';
        
        let lvlRange = type==='bronze'?[1,9]:type==='silver'?[10,19]:[20,29];
        let lvl = Math.floor(Math.random()*(lvlRange[1]-lvlRange[0]+1)) + lvlRange[0];
        let pName = "Hvězda " + (db.players.length + 1);
        window.lastP = {name: pName, stat: lvl, energy: 100, id: Date.now(), sleepUntil:0, lastSleep:0};
        
        let dr = Math.floor(Math.random()*6); window.lastDr = dr;

        // ANIMACE
        let rev = document.getElementById('p-reveal');
        rev.innerText = "?";
        setTimeout(() => { rev.innerText = pName[0] + "..."; }, 1000);
        setTimeout(() => {
            rev.innerHTML = `<div class="reveal-card"><h2>${lvl}</h2><h1>${pName}</h1></div>`;
            document.getElementById('p-loot').innerText = dr > 0 ? `+ ${dr}x Energeťák 🥤` : "";
            document.getElementById('p-close').style.display = 'block';
        }, 2500);
    }

    function closePack() {
        db.players.push(window.lastP);
        if(window.lastDr > 0) {
            let s = db.inventory.find(i=>i.count < 10);
            if(s) s.count = Math.min(10, s.count + window.lastDr); else db.inventory.push({count: window.lastDr});
        }
        document.getElementById('pack-opener').style.display = 'none';
        save(); updateUI();
    }

    function runMatch() {
        let playerTeam = db.league.find(t=>t.isPlayer);
        // Výběr soupeře: Pokud AVG < 10, soupeři mají max LVL 8
        let opponents = db.league.filter(t=>!t.isPlayer);
        let opp = opponents[Math.floor(Math.random()*opponents.length)];
        if(playerTeam.a < 10) opp.a = Math.min(opp.a, 8);

        document.getElementById('sim-screen').style.display = 'block';
        document.getElementById('tv-h').innerText = db.teamName;
        document.getElementById('tv-a').innerText = opp.n;
        
        let time = 30; let sh = 0, sa = 0;
        let interval = setInterval(() => {
            time--; document.getElementById('timer').innerText = time;
            if(Math.random()<0.1) { if(Math.random()>0.5) sh++; else sa++;
                document.getElementById('s-h').innerText = sh; document.getElementById('s-a').innerText = sa; }
            if(time <= 0) { clearInterval(interval); finishMatch(sh, sa, opp); }
        }, 1000);
        
        // Jednoduchý vizuál
        const ctx = document.getElementById('sim-canvas').getContext('2d');
        function d() { if(document.getElementById('sim-screen').style.display==='none') return;
            ctx.clearRect(0,0,300,300); ctx.fillStyle="white"; 
            for(let i=0;i<10;i++) ctx.beginPath(), ctx.arc(Math.random()*300, Math.random()*200, 5, 0, 7), ctx.fill();
            requestAnimationFrame(d);
        } d();
    }

    function finishMatch(sh, sa, opp) {
        document.getElementById('sim-screen').style.display = 'none';
        let pT = db.league.find(t=>t.isPlayer);
        let diff = pT.a - opp.a;
        let winProb = 0;

        // TVOJE TABULKA PRAVDĚPODOBNOSTI
        if(diff <= -8) winProb = 1;
        else if(diff === -7) winProb = 5;
        else if(diff === -6) winProb = 10;
        else if(diff === -5) winProb = 15;
        else if(diff === -4) winProb = 20;
        else if(diff === -3) winProb = 25;
        else if(diff === -2) winProb = 30;
        else if(diff === -1) winProb = 50;
        else if(diff === 0) winProb = 67;
        else if(diff === 1) winProb = 75;
        else if(diff >= 2) winProb = 99;

        // PRVNÍ ZÁPAS VŽDY VÝHRA
        let isWin = (db.matchesPlayed === 0) ? true : (Math.random() * 100 < winProb);
        
        let reward = isWin ? 750 : 0;
        let bonus = Math.random() < 0.1 ? 1000 : 0;
        db.money += (reward + bonus);
        if(isWin) pT.p += 3;
        db.matchesPlayed++;

        db.players.filter(p => p.sleepUntil < Date.now()).forEach(p => {
            p.energy = Math.max(0, p.energy - (Math.floor(Math.random()*10)+1));
        });

        alert(isWin ? `VÝHRA! Získáno ${reward + bonus} 🪙` : `PROHRA. ${bonus>0 ? 'Ale máš bonus '+bonus+' 🪙' : 'Příště to vyjde.'}`);
        save(); nav('match');
    }

    function renderLeague() {
        const b = document.getElementById('league-body'); b.innerHTML = "";
        db.league.sort((x,y)=>y.p - x.p).forEach(t => {
            b.innerHTML += `<tr style="${t.isPlayer?'color:var(--gold)':''}"><td>${t.n}</td><td>${t.a}</td><td>${t.p}</td></tr>`;
        });
    }

    function renderSleep() {
        const l = document.getElementById('sleep-list'); l.innerHTML = "";
        db.players.forEach(p => {
            let isS = p.sleepUntil > Date.now();
            let cd = Math.ceil((600000 - (Date.now() - p.lastSleep))/1000);
            l.innerHTML += `<div class="card"><b>${p.name}</b> (LVL ${p.stat}) <br>
                <button ${isS || cd>0 ? 'disabled' : ''} onclick="startSleep(${p.id})">${isS?'SPÍ...':cd>0?'WAIT '+cd+'s':'SPÁNEČEK'}</button></div>`;
        });
    }

    function startSleep(id) { let p = db.players.find(x=>x.id===id); p.sleepUntil=Date.now()+60000; p.lastSleep=Date.now(); p.energy=100; save(); renderSleep(); }

    function renderBackpack() {
        const bp = document.getElementById('backpack'); bp.innerHTML = "";
        db.inventory.forEach((item, i) => {
            bp.innerHTML += `<div class="card" style="text-align:center;" onclick="useDr(${i})">🥤 x${item.count}</div>`;
        });
    }

    function useDr(i) {
        let n = prompt("Komu dát drink?"); let p = db.players.find(x=>x.name===n);
        if(p) { p.energy=100; p.sleepUntil=0; db.inventory[i].count--; if(db.inventory[i].count<=0) db.inventory.splice(i,1); save(); renderBackpack(); }
    }

    function save() { localStorage.setItem('fb_mgr_v15', JSON.stringify(db)); }
    window.onload = () => {
        let s = localStorage.getItem('fb_mgr_v15');
        if(s) { db = JSON.parse(s); document.getElementById('scr-reg').style.display='none'; document.getElementById('nav').style.display='flex'; document.getElementById('top-ui').style.display='flex'; nav('match'); }
        setInterval(() => { if(document.getElementById('scr-sleep').classList.contains('active')) renderSleep(); }, 1000);
    };
</script>
</body>
</html>
