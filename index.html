<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager v9.5 Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0f172a; --surface: rgba(30, 41, 59, 0.85); --surface-border: rgba(255, 255, 255, 0.15);
            --accent: #00ff88; --text: #f8fafc; --text-muted: #94a3b8;
            --blue: #3b82f6; --red: #ef4444; --gold: #fbbf24; --gold-glow: rgba(251, 191, 36, 0.4);
            --field: linear-gradient(180deg, #022c22 0%, #064e3b 100%);
            /* Rarities */
            --r-basic: #94a3b8; --r-medium: #22c55e; --r-rare: #3b82f6; --r-epic: #a855f7;
        }
        
        body { 
            font-family: 'Montserrat', sans-serif; color: var(--text); margin: 0; 
            background: linear-gradient(135deg, rgba(11, 19, 43, 0.9) 0%, rgba(28, 37, 65, 0.9) 100%), url('1773165632248.png') no-repeat center center fixed;
            background-size: cover;
            overflow-x: hidden; user-select: none; 
        }
        
        /* --- ÚPRAVA: KABINA S TROFEJÍ --- */
        #scr-sleep { 
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), url('1773235073970.png') no-repeat center center; 
            background-size: cover;
        }

        #scr-match { background: radial-gradient(circle at center, rgba(6, 78, 59, 0.3) 0%, transparent 100%); }
        #scr-profile { background: radial-gradient(circle at top, rgba(30, 41, 59, 0.5) 0%, transparent 100%); }
        #scr-shop { background: linear-gradient(135deg, rgba(67, 20, 7, 0.5) 0%, transparent 100%); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--surface-border); border-radius: 10px; }

        h3 { color: var(--text); text-transform: uppercase; letter-spacing: 1px; font-size: 1.1rem; border-left: 4px solid var(--accent); padding-left: 10px; margin-top: 0; text-shadow: 0 0 10px rgba(0,255,136,0.2); }
        .card { background: var(--surface); backdrop-filter: blur(10px); border: 1px solid var(--surface-border); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        button { background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: 900; width: 100%; cursor: pointer; text-transform: uppercase; transition: all 0.2s; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(0,255,136,0.3); }
        button:active { transform: scale(0.96); }
        button:disabled { background: #1e293b !important; color: #475569 !important; pointer-events: none; box-shadow: none !important; }

        .btn-red { background: var(--red); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); color: white; }
        .btn-blue { background: var(--blue); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); color: white; }

        #top-ui { display: none; background: rgba(5, 8, 15, 0.9); backdrop-filter: blur(20px); padding: 15px 20px; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--surface-border); position: sticky; top: 0; z-index: 1000; }
        .stat-badge { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 12px; font-weight: 800; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; border: 1px solid var(--surface-border); }
        .coin-badge { color: var(--gold); text-shadow: 0 0 8px var(--gold-glow); }
        .trophy-badge { color: #f97316; text-shadow: 0 0 8px rgba(249, 115, 22, 0.4); }

        .screen { display: none; padding: 20px; padding-bottom: 120px; min-height: calc(100vh - 70px); animation: fade 0.3s ease-out; }
        .active { display: block; }
        @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- ÚPRAVA: TROPHY ROAD S FLORBALKOU --- */
        #tr-overlay { 
            position: fixed; inset: 0; 
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('1773235072252.png') no-repeat center center; 
            background-size: cover;
            backdrop-filter: blur(5px); z-index: 5500; display: none; flex-direction: column; padding: 20px; padding-top: 50px; 
        }

        .tr-header { text-align: center; font-family: 'Orbitron', sans-serif; color: var(--gold); font-size: 2rem; margin-bottom: 30px; text-shadow: 0 0 15px var(--gold-glow); }
        .tr-track-container { width: 100%; overflow-x: auto; padding: 20px 0; position: relative; display: flex; align-items: center; }
        .tr-line { position: absolute; top: 50%; left: 0; height: 8px; background: #333; width: max-content; min-width: 100%; z-index: 1; transform: translateY(-50%); border-radius: 4px; }
        .tr-line-fill { position: absolute; top: 0; left: 0; height: 100%; background: linear-gradient(90deg, #f97316, var(--gold)); border-radius: 4px; box-shadow: 0 0 15px var(--gold); transition: width 0.5s; }
        .tr-nodes { display: flex; gap: 70px; padding: 0 40px; position: relative; z-index: 2; width: max-content; }
        .tr-node { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100px; text-align: center; position: relative; }
        .tr-circle { width: 55px; height: 55px; background: #111; border: 4px solid #444; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; transition: 0.3s; cursor: pointer; }
        .tr-node.unlocked .tr-circle { border-color: var(--gold); background: rgba(251, 191, 36, 0.2); box-shadow: 0 0 20px var(--gold-glow); }
        .tr-node.claimed .tr-circle { border-color: var(--accent); opacity: 0.6; }
        
        .tr-req { font-family: 'Orbitron', sans-serif; font-weight: 900; color: #f97316; font-size: 1rem; }
        .tr-desc { font-size: 0.8rem; font-weight: 700; color: var(--text); line-height: 1.2; background: rgba(0,0,0,0.6); padding: 5px; border-radius: 6px; }

        /* MATCH AREA */
        #match-area { 
            width: 100%; height: 30vh; min-height: 240px; border-radius: 16px; position: relative; overflow: hidden; display: none; 
            background: url('1773165633895.png') no-repeat center center;
            background-size: cover; border: 2px solid rgba(255,255,255,0.1); margin-bottom: 20px; 
        }

        .tactical-field { 
            width: 100%; height: 280px; 
            background: url('1773165633895.png') no-repeat center center;
            background-size: cover; border: 3px solid rgba(255,255,255,0.2); border-radius: 16px; position: relative; 
        }

        #bot-nav { display: none; position: fixed; bottom: 0; width: 100%; height: 70px; background: rgba(5, 8, 15, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--surface-border); z-index: 1000; justify-content: space-around; align-items: center; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; opacity: 0.4; cursor: pointer; transition: 0.3s; color: var(--text); }
        .nav-item.active { opacity: 1; color: var(--accent); transform: translateY(-3px); }
        .nav-icon { width: 24px; height: 24px; fill: currentColor; }
        .nav-text { font-size: 0.65rem; font-weight: 700; }
    </style>
</head>
<body>

    <div id="custom-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(8px); padding: 20px;">
        <div class="modal-box" id="cm-box" style="background: linear-gradient(145deg, #1e293b, #0f172a); border: 2px solid var(--accent); border-radius: 20px; padding: 30px; text-align: center; width: 100%; max-width: 350px;">
            <div class="modal-title" id="cm-title" style="font-family: 'Orbitron', sans-serif; font-size: 1.5rem; margin-bottom: 15px; color: var(--accent);">OZNÁMENÍ</div>
            <div class="modal-text" id="cm-text" style="color: var(--text); margin-bottom: 25px; line-height: 1.5;">Text okna</div>
            <button onclick="closeModal()" id="cm-btn">OK</button>
        </div>
    </div>

    <div id="top-ui">
        <div style="display:flex; gap:10px;">
            <div class="stat-badge coin-badge">💰 <span id="ui-money">0</span></div>
            <div class="stat-badge trophy-badge">🏆 <span id="ui-trophies">0</span></div>
        </div>
        <div class="stat-badge" style="color:var(--accent);">SÍLA <span id="ui-lvl">0</span></div>
    </div>

    <div id="tr-overlay">
        <div class="tr-header">CESTA SLÁVY 🏆</div>
        <button onclick="document.getElementById('tr-overlay').style.display='none'" style="margin-bottom:20px; background:rgba(255,255,255,0.1); color:white;">ZAVŘÍT</button>
        <div class="tr-track-container">
            <div class="tr-line"><div class="tr-line-fill" id="tr-fill-bar"></div></div>
            <div class="tr-nodes" id="tr-list"></div>
        </div>
    </div>

    <div id="scr-match" class="screen">
        <div class="card" style="background: linear-gradient(135deg, #f97316, #fbbf24); color: #000; padding: 15px; font-weight: 900; text-align: center; cursor: pointer;" onclick="openTrophyRoad()">
            VSTOUPIT NA TROPHY ROAD 🏆
        </div>
        <div id="match-area">
            <div style="text-align: center; color: white; background: rgba(0,0,0,0.7); padding: 10px;">
                <span id="score-h">0</span> : <span id="score-a">0</span> | <span id="match-timer">00:00</span>
            </div>
            <div id="players-layer"></div>
        </div>
        <button id="btn-play" onclick="initMatch()">HLEDAT ZÁPAS</button>
        <div id="liga-tabulka" class="card" style="margin-top: 20px;"></div>
    </div>

    <div id="scr-sleep" class="screen">
        <h3>Kabina týmu</h3>
        <p style="font-size:0.8rem; color:var(--text-muted);">Zde spravuješ odpočinek a práci svých hráčů.</p>
        <div id="hraci-list"></div>
    </div>

    <div id="scr-profile" class="screen">
        <h3>Taktika</h3>
        <div class="tactical-field">
            <div id="lvl-GK" style="position:absolute; bottom:10px; left:50%; transform:translateX(-50%); background:var(--accent); color:black; padding:2px 8px; border-radius:5px; font-weight:900;">-</div>
        </div>
        <div id="bag-ui" class="card" style="margin-top:20px;">
            <h4>Inventář předmětů</h4>
            <div id="bag-list" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;"></div>
        </div>
    </div>

    <div id="scr-shop" class="screen">
        <h3>Fanshop & Posily</h3>
        <div class="card"><button onclick="buyPack('bronz')">BRONZOVÝ BALÍČEK (5 000 🪙)</button></div>
        <div class="card"><button onclick="buyPack('silver')">STŘÍBRNÝ BALÍČEK (10 000 🪙)</button></div>
        <div class="card"><button onclick="buyPack('gold')">ZLATÝ BALÍČEK (15 000 🪙)</button></div>
    </div>

    <div id="bot-nav">
        <div class="nav-item" onclick="prepni('sleep')"><span class="nav-text">KABINA</span></div>
        <div class="nav-item active" onclick="prepni('match')"><span class="nav-text">ZÁPAS</span></div>
        <div class="nav-item" onclick="prepni('profile')"><span class="nav-text">TÝM</span></div>
        <div class="nav-item" onclick="prepni('shop')"><span class="nav-text">OBCHOD</span></div>
    </div>

    <script>
        // Data a základní logika (zkráceno pro přehlednost vizuálu)
        let db = JSON.parse(localStorage.getItem('fb_v9_5')) || {
            m: 10000, trophies: 0, trClaimed: [], p: [], lineup: {GK:null}, teamName: "Hráč"
        };

        const trData = [
            { req: 10, desc: "START BALÍČEK" }, { req: 50, desc: "5 000 🪙" }, { req: 100, desc: "ELITE KARTA" }
        ];

        function prepni(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('scr-' + id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            updateUI();
        }

        function updateUI() {
            document.getElementById('ui-money').innerText = db.m;
            document.getElementById('ui-trophies').innerText = db.trophies;
        }

        function openTrophyRoad() {
            const list = document.getElementById('tr-list');
            list.innerHTML = '';
            trData.forEach((node, i) => {
                const unl = db.trophies >= node.req;
                list.innerHTML += `
                    <div class="tr-node">
                        <div class="tr-circle" style="border-color:${unl?'var(--gold)':'#444'}">${unl?'🎁':'🔒'}</div>
                        <div class="tr-req">${node.req} 🏆</div>
                        <div class="tr-desc">${node.desc}</div>
                    </div>`;
            });
            document.getElementById('tr-overlay').style.display = 'flex';
        }

        function closeModal() { document.getElementById('custom-modal').style.display = 'none'; }

        window.onload = () => {
            document.getElementById('top-ui').style.display = 'flex';
            document.getElementById('bot-nav').style.display = 'flex';
            prepni('match');
        };
    </script>
</body>
</html>
