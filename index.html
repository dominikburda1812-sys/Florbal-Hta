<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager | Commentary Edition</title>
    <style>
        :root {
            --bg-dark: #000000; --bg-card: #111111; --primary-gold: #fbbf24;
            --secondary-gold: #f59e0b; --text-main: #f8fafc; --text-muted: #94a3b8;
            --border: #333333; --shadow: 0 4px 6px -1px rgba(251, 191, 36, 0.1);
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; text-align: center; overflow: hidden; touch-action: none; }
        h1, h2, h3 { color: var(--primary-gold); text-transform: uppercase; letter-spacing: 1px; }

        .ui-bar { background-color: var(--bg-card); padding: 12px; border-bottom: 2px solid var(--primary-gold); display: flex; justify-content: space-around; align-items: center; font-weight: bold; font-size: 0.9em; }
        .screen { display: none; padding: 15px; height: 82vh; overflow-y: auto; padding-bottom: 100px; box-sizing: border-box; }
        .screen.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin: 12px auto; width: 92%; max-width: 380px; box-shadow: var(--shadow); }
        button { background: linear-gradient(135deg, var(--secondary-gold), var(--primary-gold)); border: none; padding: 12px; border-radius: 10px; font-weight: bold; color: var(--bg-dark); text-transform: uppercase; width: 100%; cursor: pointer; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        input.setup-input { display: block; width: 85%; margin: 10px auto; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: #1a1a1a; color: white; }

        .energy-container { background: #222; height: 12px; border-radius: 6px; margin: 12px 0; overflow: hidden; border: 1px solid #333; }
        .energy-fill { background: linear-gradient(90deg, #ca8a04, var(--primary-gold)); height: 100%; transition: width 0.3s; }
        .sleeping-tag { color: #ef4444; font-size: 0.85em; font-weight: bold; display: block; margin-top: 8px; }

        .inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #080808; padding: 15px; border-radius: 12px; }
        .inv-slot { aspect-ratio: 1; background: var(--bg-card); border: 1px dashed var(--border); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 28px; position: relative; }
        .stack-count { position: absolute; bottom: 4px; right: 6px; font-size: 12px; color: var(--primary-gold); background: rgba(0,0,0,0.7); padding: 2px 4px; border-radius: 4px; }

        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th { border-bottom: 2px solid var(--primary-gold); padding: 8px; color: var(--primary-gold); }
        td { padding: 10px 8px; border-bottom: 1px solid var(--border); }
        .my-team-row { background: rgba(251, 191, 36, 0.1); color: var(--primary-gold); font-weight: bold; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 70px; background: var(--bg-card); display: flex; border-top: 2px solid var(--primary-gold); z-index: 100; }
        .nav-item { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 28px; color: var(--text-muted); cursor: pointer; }
        .nav-item.selected { color: var(--primary-gold); transform: translateY(-5px); }

        #sim-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; padding-top: 20px; }
        #sim-canvas { background: #0a0a0a; border: 3px solid var(--primary-gold); border-radius: 12px; }
        #commentary-box { background: rgba(251, 191, 36, 0.1); border: 1px solid var(--primary-gold); margin: 15px auto; width: 90%; padding: 10px; border-radius: 10px; min-height: 50px; color: var(--primary-gold); font-style: italic; font-size: 0.9em; }
        #half-time-overlay { display: none; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 20px; border: 2px solid var(--primary-gold); color: var(--primary-gold); font-weight: bold; border-radius: 10px; }
    </style>
</head>
<body>

<div id="top-ui" style="display:none" class="ui-bar">
    <span><b><span id="money">0</span> 🪙</b></span>
    <span><b>AVG: <span id="team-avg">0</span> 📊</b></span>
    <span><b><span id="player-count">0</span>/20 👥</b></span>
</div>

<div id="scr-reg" class="screen active">
    <h1>FLORBAL MANAŽER</h1>
    <div class="card">
        <input type="text" id="mgr-name" class="setup-input" placeholder="Jméno Manažera">
        <p style="color: var(--text-muted); font-size: 0.8em;">Pojmenuj základní šestku:</p>
        <div id="player-inputs">
            <input type="text" class="setup-input p-name" placeholder="Hráč 1">
            <input type="text" class="setup-input p-name" placeholder="Hráč 2">
            <input type="text" class="setup-input p-name" placeholder="Hráč 3">
            <input type="text" class="setup-input p-name" placeholder="Hráč 4">
            <input type="text" class="setup-input p-name" placeholder="Hráč 5">
            <input type="text" class="setup-input p-name" placeholder="Hráč 6">
        </div>
        <button onclick="createTeam()">Zahájit kariéru</button>
    </div>
</div>

<div id="scr-sleep" class="screen">
    <h2>Kabina 🛌</h2>
    <p id="use-msg" style="display:none; color: var(--primary-gold);">Klikni na hráče, kterému chceš dát Energeťák!</p>
    <div id="sleep-list"></div>
</div>

<div id="scr-match" class="screen">
    <h2>Ligová Tabulka 🏆</h2>
    <div class="card" style="width:100%; padding: 5px;"><table id="league-table"><thead><tr><th>#</th><th>Tým</th><th>Lvl</th><th>Body</th></tr></thead><tbody id="league-body"></tbody></table></div>
    <div class="card">
        <button id="match-btn" onclick="runMatch()">Hrát Zápas</button>
        <p id="match-timer-text" style="font-size:0.75em; color: var(--text-muted); margin-top: 8px;"></p>
    </div>
</div>

<div id="scr-shop" class="screen">
    <h2>Obchod 🛒</h2>
    <div id="shop-list"></div>
</div>

<div id="scr-profile" class="screen">
    <h2 id="prof-name">Manažer</h2>
    <div class="card">
        <h3>🎒 Batoh</h3>
        <div class="inventory-grid" id="backpack"></div>
    </div>
    <button style="background: red; color: white;" onclick="resetGame()">Smazat kariéru</button>
</div>

<div id="sim-container">
    <h3 id="sim-time-text" style="color: var(--primary-gold);">ČAS: 0s</h3>
    <div style="position: relative; display: inline-block;">
        <canvas id="sim-canvas" width="320" height="200"></canvas>
        <div id="half-time-overlay">POLOČAS - VÝMĚNA STRAN</div>
    </div>
    <div id="commentary-box">Vítejte u dnešního zápasu!</div>
</div>

<div id="nav" class="nav-bar" style="display:none">
    <div class="nav-item" id="n-sleep" onclick="nav('sleep')">🛏️</div>
    <div class="nav-item selected" id="n-match" onclick="nav('match')">🥅</div>
    <div class="nav-item" id="n-shop" onclick="nav('shop')">🛒</div>
    <div class="nav-item" id="n-profile" onclick="nav('profile')">👤</div>
</div>

<script>
    let db = {
        name: "", money: 10000, lastMatch: 0, matchCount: 0,
        players: [], inventory: [], shopLvl: 1, shopReset: 120, shopItems: [],
        league: [
            { name: "FK Kuličky", strength: 2, pts: 0 },
            { name: "SK Beton", strength: 6, pts: 0 },
            { name: "HC Prach", strength: 10, pts: 0 },
            { name: "Lvi z Lhoty", strength: 15, pts: 0 },
            { name: "Můj Tým", strength: 0, pts: 0, isPlayer: true }
        ]
    };

    const funnyLines = [
        "Manažer právě zakopl o střídačku!",
        "Gólman chytil míček... vlastním břichem.",
        "Pepík právě trefil babičku v první řadě!",
        "Míček se zasekl v mantinelu, hraje se dál botou.",
        "Rozhodčí si právě čistí brýle, nic neviděl.",
        "Hráč zkouší otočku, ale zamotal se do hokejky.",
        "Diváci skandují: 'Kde je pivo?!'",
        "Gólman zrovna svačí, ale míček ho trefil do masky!",
        "Neskutečná střela! Ale trefila jenom strop haly.",
        "To byla rána! Gólmanovi právě uletěla helma."
    ];

    let simInterval = null;
    let matchTime = 0;
    let isPaused = false;
    let currentMatchOpponent = null;

    function save() { localStorage.setItem('fb_mgr_final_v1', JSON.stringify(db)); }

    function createTeam() {
        db.name = document.getElementById('mgr-name').value || "Manažer";
        document.querySelectorAll('.p-name').forEach((input, i) => {
            db.players.push({ name: input.value || ("Hráč "+(i+1)), stat: 1, energy: 100, lastSleep: 0, id: Date.now()+i });
        });
        db.league.find(t => t.isPlayer).name = "Tým " + db.name;
        document.getElementById('scr-reg').classList.remove('active');
        document.getElementById('top-ui').style.display = 'flex';
        document.getElementById('nav').style.display = 'flex';
        generateShop(); save(); startTimers(); nav('match');
    }

    function getTeamAvg() { return Math.round(db.players.reduce((a, b) => a + b.stat, 0) / db.players.length) || 1; }

    function runMatch() {
        let now = Date.now();
        const ready = db.players.filter(p => p.energy >= 30 && (now - p.lastSleep > 60000));
        if(ready.length < 6) return alert("Hráči spí nebo jsou unavení!");
        if(now - db.lastMatch < 60000) return alert("Hala se uklízí.");

        // DYNAMICKÝ MATCHMAKING
        let myStrength = getTeamAvg();
        let base = Math.floor(myStrength / 10) * 10;
        let oppStrength = (base === 0) ? Math.floor(Math.random() * 8) + 1 : base + Math.floor(Math.random() * 8) + 1;
        
        currentMatchOpponent = { name: "Hosté", strength: oppStrength };
        
        db.lastMatch = now;
        db.matchCount++;
        document.getElementById('nav').style.display = 'none';
        document.getElementById('scr-match').classList.remove('active');
        document.getElementById('sim-container').style.display = 'block';

        initSimulation();
        simInterval = setInterval(drawSimulation, 33);

        setTimeout(() => {
            clearInterval(simInterval);
            document.getElementById('sim-container').style.display = 'none';
            document.getElementById('nav').style.display = 'flex';
            document.getElementById('scr-match').classList.add('active');
            processMatchResult(ready);
        }, 32000);
    }

    function processMatchResult(activePlayers) {
        let myP = getTeamAvg();
        let chance = 0.5 + (myP - currentMatchOpponent.strength) * 0.15;
        
        // PRVNÍ ZÁPAS VŽDY VÝHRA
        let win = (db.matchCount === 1) ? true : Math.random() < Math.max(0.1, Math.min(0.9, chance));

        if(win) {
            db.money += 500; db.league.find(t => t.isPlayer).pts += 3;
            alert("VÝHRA! Manažer je spokojen.");
        } else alert("PROHRA! To bude v šatně dusno.");

        activePlayers.slice(0,6).forEach(p => {
            let pDb = db.players.find(x => x.id === p.id);
            pDb.energy = Math.max(0, pDb.energy - 25);
        });
        db.league.forEach(t => { if(!t.isPlayer) t.pts += (Math.random() > 0.6 ? 3 : 0); });
        save(); updateUI(); renderLeague();
    }

    function initSimulation() {
        matchTime = 0; isPaused = false;
        document.getElementById('commentary-box').innerText = "Zápas začíná! Hráči vběhli na hřiště.";
    }

    function drawSimulation() {
        if(isPaused) return;
        const ctx = document.getElementById('sim-canvas').getContext('2d');
        ctx.fillStyle = "#0a0a0a"; ctx.fillRect(0,0,320,200);
        ctx.strokeStyle = "#fbbf24"; ctx.strokeRect(0,0,320,200);
        
        // Náhodné pohyby pro vizuální efekt
        for(let i=0; i<10; i++) {
            ctx.fillStyle = i<5 ? "#fbbf24" : "#444";
            ctx.beginPath(); ctx.arc(Math.random()*300+10, Math.random()*180+10, 5, 0, 7); ctx.fill();
        }

        matchTime += 0.033;
        document.getElementById('sim-time-text').innerText = "ČAS: " + Math.floor(matchTime) + "s";
        
        // Vtipné hlášky každých 5 sekund
        if(Math.floor(matchTime) % 5 === 0 && matchTime % 1 < 0.04) {
            document.getElementById('commentary-box').innerText = funnyLines[Math.floor(Math.random()*funnyLines.length)];
        }

        if(Math.floor(matchTime) === 15) {
            isPaused = true; document.getElementById('half-time-overlay').style.display='block';
            document.getElementById('commentary-box').innerText = "Poločas! Hráči mění strany a manažer si dává párek.";
            setTimeout(() => { isPaused=false; document.getElementById('half-time-overlay').style.display='none'; }, 2000);
            matchTime += 1;
        }
    }

    // --- POMOCNÉ FUNKCE (Z minula) ---
    function nav(id) {
        db.usingItem = false; document.getElementById('use-msg').style.display = 'none';
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('selected'));
        document.getElementById('scr-'+id).classList.add('active');
        document.getElementById('n-'+id).classList.add('selected');
        if(id === 'sleep') renderSleep(); if(id === 'shop') renderShop(); if(id === 'profile') renderBackpack(); if(id === 'match') renderLeague();
    }

    function updateUI() { document.getElementById('money').innerText = db.money.toLocaleString(); document.getElementById('team-avg').innerText = getTeamAvg(); document.getElementById('player-count').innerText = db.players.length; }
    
    function renderSleep() {
        const c = document.getElementById('sleep-list'); c.innerHTML = "";
        db.players.forEach(p => {
            let sleeping = (Date.now() - p.lastSleep) < 60000;
            c.innerHTML += `<div class="card" onclick="giveDrink(${p.id})"><b>${p.name}</b> (Lvl ${p.stat}) | ${p.energy}% <div class="energy-container"><div class="energy-fill" style="width:${p.energy}%"></div></div> ${sleeping ? '<span class="sleeping-tag">💤 SPÍ - NELZE HRÁT</span>' : `<button onclick="individualSleep(${p.id})" ${(Date.now()-p.lastSleep < 600000)?'disabled':''}>POSLAT SPÁT</button>`}</div>`;
        });
    }

    function individualSleep(id) { let p = db.players.find(x => x.id === id); p.lastSleep = Date.now(); p.energy = 100; save(); renderSleep(); }
    function renderBackpack() {
        const g = document.getElementById('backpack'); g.innerHTML = "";
        for(let i=0; i<20; i++) { let it = db.inventory[i]; g.innerHTML += `<div class="inv-slot" onclick="prepareUseItem()">${it ? it.icon + '<span class="stack-count">x'+it.count+'</span>' : ''}</div>`; }
    }
    function prepareUseItem() { db.usingItem = true; nav('sleep'); document.getElementById('use-msg').style.display = 'block'; }
    function giveDrink(id) {
        if(!db.usingItem) return;
        let p = db.players.find(x => x.id === id); let idx = db.inventory.findIndex(i => i.name === 'Energeťák');
        if(idx !== -1) { p.energy = 100; db.inventory[idx].count--; if(db.inventory[idx].count<=0) db.inventory.splice(idx,1); db.usingItem=false; document.getElementById('use-msg').style.display='none'; save(); renderSleep(); renderBackpack(); }
    }
    function renderShop() {
        const l = document.getElementById('shop-list'); l.innerHTML = "";
        db.shopItems.forEach((it, i) => { l.innerHTML += `<div class="card"><h3>${it.name}</h3><p>${it.price} 🪙</p><button onclick="buyShop(${i})">KOUPIT</button></div>`; });
    }
    function buyShop(i) {
        let it = db.shopItems[i]; if(db.money < it.price) return alert("Máš málo peněz!");
        if(it.type === 'player') {
            let n = prompt("Jméno posily:", it.name); db.players.push({ name: n||it.name, stat: it.stat, energy: 100, lastSleep: 0, id: Date.now() });
        } else {
            let s = db.inventory.find(x => x.name === 'Energeťák'); if(s) s.count++; else db.inventory.push({...it, count: 1});
        }
        db.money -= it.price; db.shopItems.splice(i,1); save(); updateUI(); renderShop();
    }
    function generateShop() {
        db.shopItems = []; for(let i=0; i<3; i++) { let s = Math.floor(Math.random()*(db.shopLvl*10))+1; db.shopItems.push({type:'player', stat:s, price: 5000+(s*1000), name: "Posila Lvl "+s}); }
        db.shopItems.push({type:'item', name:'Energeťák', price:1000, icon:'🥤'}); renderShop();
    }
    function renderLeague() {
        const b = document.getElementById('league-body'); b.innerHTML = "";
        db.league.find(t=>t.isPlayer).strength = getTeamAvg();
        db.league.sort((x,y)=>y.pts-x.pts).forEach((t, i) => { b.innerHTML += `<tr class="${t.isPlayer?'my-team-row':''}"><td>${i+1}</td><td>${t.name}</td><td>${t.strength}</td><td>${t.pts}</td></tr>`; });
    }
    function startTimers() {
        setInterval(() => {
            db.shopReset--; if(db.shopReset<=0) { db.shopReset=120; generateShop(); }
            let wait = Math.ceil((60000-(Date.now()-db.lastMatch))/1000);
            if(document.getElementById('match-timer-text')) document.getElementById('match-timer-text').innerText = wait>0 ? "Hala se uklízí: "+wait+"s" : "Můžeš hrát!";
        }, 1000);
    }
    function resetGame() { if(confirm("Smazat vše?")) { localStorage.clear(); location.reload(); } }

    window.onload = () => {
        let s = localStorage.getItem('fb_mgr_final_v1');
        if(s) { db = JSON.parse(s); document.getElementById('scr-reg').classList.remove('active'); document.getElementById('top-ui').style.display = 'flex'; document.getElementById('nav').style.display = 'flex'; nav('match'); startTimers(); updateUI(); }
    };
</script>
</body>
</html>
