<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager Pro 26</title>
    <style>
        :root { --gold: #fbbf24; --glass: rgba(0,0,0,0.8); --border: rgba(251,191,36,0.3); }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; color: white; background: #000; overflow: hidden; }
        
        .ui-bar { background: #111; padding: 10px; display: flex; justify-content: space-around; border-bottom: 2px solid var(--gold); font-weight: bold; }
        .screen { display: none; padding: 15px; height: 85vh; overflow-y: auto; box-sizing: border-box; padding-bottom: 100px; }
        .active { display: block; }

        /* TV SCOREBOARD */
        .tv-score { 
            background: linear-gradient(to bottom, #222, #000); border: 2px solid #444; 
            display: flex; width: 90%; margin: 10px auto; border-radius: 5px; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .tv-team { flex: 1; padding: 10px; font-weight: 900; text-transform: uppercase; }
        .tv-points { background: var(--gold); color: black; padding: 10px 20px; font-size: 1.2em; font-weight: 900; }

        .card { background: var(--glass); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin: 10px auto; width: 92%; }
        button { background: linear-gradient(135deg, #f59e0b, #fbbf24); border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        button:disabled { background: #444; color: #888; }

        /* KABINA & INVENTÁŘ */
        .inv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .inv-slot { aspect-ratio: 1; background: #222; border: 1px solid #444; border-radius: 5px; display: flex; align-items: center; justify-content: center; position: relative; font-size: 1.5em; cursor: pointer; }
        .stack { position: absolute; bottom: 2px; right: 4px; font-size: 10px; color: var(--gold); }

        /* ANIMACE SIMULACE */
        #sim-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #064e3b; z-index: 5000; }
        #sim-canvas { width: 100%; height: 60vh; background: #064e3b; display: block; }
    </style>
</head>
<body>

<div id="top-ui" style="display:none" class="ui-bar">
    <span>💰 <span id="money">0</span></span>
    <span>📊 AVG: <span id="avg">0</span></span>
    <span>👥 <span id="p-count">0</span></span>
</div>

<div id="scr-reg" class="screen active">
    <h1>NOVÁ KARIÉRA</h1>
    <div class="card">
        <input type="text" id="mgr-name" placeholder="NÁZEV TÝMU" style="width:90%; padding:10px; margin-bottom:10px;">
        <h3>JMÉNA PRVNÍCH 6 HRÁČŮ:</h3>
        <div id="initial-players">
            <input type="text" class="p-name" value="Hráč 1" style="width:40%; margin:2px;">
            <input type="text" class="p-name" value="Hráč 2" style="width:40%; margin:2px;">
            <input type="text" class="p-name" value="Hráč 3" style="width:40%; margin:2px;">
            <input type="text" class="p-name" value="Hráč 4" style="width:40%; margin:2px;">
            <input type="text" class="p-name" value="Hráč 5" style="width:40%; margin:2px;">
            <input type="text" class="p-name" value="Hráč 6" style="width:40%; margin:2px;">
        </div>
        <button onclick="createTeam()" style="margin-top:15px;">ZALOŽIT KLUB</button>
    </div>
</div>

<div id="scr-match" class="screen">
    <div class="card">
        <button id="btn-match" onclick="runMatch()">HRÁT ZÁPAS (30s)</button>
    </div>
    <div class="card" id="league-box"></div>
</div>

<div id="scr-shop" class="screen">
    <h2>OBCHOD 🛒</h2>
    <div class="card" onclick="buyPack('bronze')">BRONZ (1 000 🪙)</div>
    <div class="card" onclick="buyPack('silver')">SILVER (5 000 🪙)</div>
    <div class="card" onclick="buyPack('gold')">GOLD (10 000 🪙)</div>
</div>

<div id="scr-sleep" class="screen">
    <h2>KABINA 🛌</h2>
    <div id="sleep-list"></div>
</div>

<div id="scr-profile" class="screen">
    <h2>BATOH 🎒</h2>
    <div class="card">
        <div id="backpack" class="inv-grid"></div>
        <p style="font-size:0.8em; color:gray;">Klikni na drink pro použití na hráče</p>
    </div>
</div>

<div id="sim-screen">
    <div class="tv-score">
        <div class="tv-team" id="tv-h">DOM</div>
        <div class="tv-points" id="tv-sh">0</div>
        <div class="tv-points" id="tv-sa" style="background:#fff">0</div>
        <div class="tv-team" id="tv-a">HOS</div>
    </div>
    <h2 id="sim-timer" style="text-align:center;">30s</h2>
    <canvas id="sim-canvas"></canvas>
    <div id="sim-msg" style="text-align:center; padding:10px; font-style:italic; color:var(--gold);"></div>
</div>

<div id="nav" class="ui-bar" style="display:none; position:fixed; bottom:0; width:100%; border-top:2px solid var(--gold); border-bottom:none;">
    <span onclick="nav('sleep')">🛌</span>
    <span onclick="nav('match')">🥅</span>
    <span onclick="nav('shop')">🛒</span>
    <span onclick="nav('profile')">🎒</span>
</div>

<script>
    let db = { money: 10000, players: [], inventory: [], lastMatch: 0, teamName: "" };
    const jokes = ["To byla rána!", "Gólman teď čaruje!", "Míček létá vzduchem!", "Rozhodčí si čistí brýle!", "Neskutečný zákrok!"];

    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('scr-'+id).classList.add('active');
        if(id==='sleep') renderSleep();
        if(id==='profile') renderBackpack();
        updateUI();
    }

    function createTeam() {
        db.teamName = document.getElementById('mgr-name').value || "Můj Tým";
        let inputs = document.querySelectorAll('.p-name');
        inputs.forEach((input, i) => {
            db.players.push({name: input.value, stat: 1, energy: 100, id: Date.now()+i, sleepUntil: 0, lastSleep: 0});
        });
        document.getElementById('scr-reg').style.display='none';
        document.getElementById('nav').style.display='flex';
        document.getElementById('top-ui').style.display='flex';
        save(); nav('match');
    }

    function updateUI() {
        document.getElementById('money').innerText = db.money.toLocaleString();
        let avg = db.players.length ? Math.round(db.players.reduce((a,b)=>a+b.stat,0)/db.players.length) : 0;
        document.getElementById('avg').innerText = avg;
        document.getElementById('p-count').innerText = db.players.length;
        document.getElementById('btn-match').disabled = db.players.filter(p => p.sleepUntil < Date.now()).length < 6;
    }

    function renderSleep() {
        const list = document.getElementById('sleep-list');
        list.innerHTML = "";
        db.players.forEach(p => {
            let isSleeping = p.sleepUntil > Date.now();
            let cd = Math.ceil((600000 - (Date.now() - p.lastSleep))/1000);
            list.innerHTML += `<div class="card">
                <b>${p.name}</b> (Lvl ${p.stat}) - ${p.energy}%
                <button ${isSleeping || cd>0 ? 'disabled' : ''} onclick="startSleep(${p.id})">
                    ${isSleeping ? 'SPÍ...' : (cd>0 ? 'WAIT '+cd+'s' : 'SPÁNEČEK PRO HRÁČE')}
                </button>
            </div>`;
        });
    }

    function startSleep(id) {
        let p = db.players.find(x => x.id === id);
        p.sleepUntil = Date.now() + 60000;
        p.lastSleep = Date.now();
        p.energy = 100;
        save(); renderSleep();
    }

    function renderBackpack() {
        const bp = document.getElementById('backpack');
        bp.innerHTML = "";
        for(let i=0; i<20; i++) {
            let item = db.inventory[i];
            bp.innerHTML += `<div class="inv-slot" onclick="useDrink(${i})">${item ? '🥤' : ''} ${item ? `<span class="stack">x${item.count}</span>` : ''}</div>`;
        }
    }

    function useDrink(idx) {
        if(!db.inventory[idx]) return;
        let pName = prompt("Komu dáš drink? (Napiš přesné jméno hráče)");
        let p = db.players.find(x => x.name === pName);
        if(p) {
            p.energy = 100;
            p.sleepUntil = 0; // Okamžitě probudí
            db.inventory[idx].count--;
            if(db.inventory[idx].count <= 0) db.inventory.splice(idx,1);
            save(); renderBackpack(); alert(pName + " je jako rybička!");
        } else { alert("Hráč nenalezen!"); }
    }

    function buyPack(type) {
        let cost = {bronze:1000, silver:5000, gold:10000}[type];
        if(db.money < cost) return alert("Málo peněz!");
        db.money -= cost;
        // Loot drinků
        let drinks = Math.floor(Math.random()*6);
        if(drinks > 0) {
            let slot = db.inventory.find(s => s.count < 10);
            if(slot) slot.count = Math.min(10, slot.count + drinks);
            else db.inventory.push({count: drinks});
        }
        let lvl = type==='gold'?25:type==='silver'?12:5;
        db.players.push({name: "Hvězda "+db.players.length, stat: lvl, energy:100, id:Date.now(), sleepUntil:0, lastSleep:0});
        save(); updateUI(); alert("Balíček otevřen! Získáno i " + drinks + " drinků.");
    }

    function runMatch() {
        const screen = document.getElementById('sim-screen');
        const canvas = document.getElementById('sim-canvas');
        const ctx = canvas.getContext('2d');
        screen.style.display = 'block';
        
        let time = 30;
        let score = {h:0, a:0};
        let objects = [];
        // Hráči (5+5)
        for(let i=0; i<10; i++) objects.push({x: Math.random()*300, y: Math.random()*200, dx: Math.random()*4-2, dy: Math.random()*4-2, team: i<5?'h':'a'});
        // Míček
        let ball = {x: 150, y: 100, dx: 5, dy: 3};
        
        document.getElementById('tv-h').innerText = db.teamName;

        let interval = setInterval(() => {
            time--;
            document.getElementById('sim-timer').innerText = time + "s";
            if(Math.random() < 0.1) {
                if(Math.random() > 0.5) score.h++; else score.a++;
                document.getElementById('tv-sh').innerText = score.h;
                document.getElementById('tv-sa').innerText = score.a;
            }
            if(time%5===0) document.getElementById('sim-msg').innerText = jokes[Math.floor(Math.random()*jokes.length)];
            if(time <= 0) { clearInterval(interval); finishMatch(score); }
        }, 1000);

        function draw() {
            if(screen.style.display === 'none') return;
            ctx.clearRect(0,0,canvas.width, canvas.height);
            // Branky
            ctx.strokeStyle = "white"; ctx.strokeRect(0, 75, 20, 50); ctx.strokeRect(canvas.width-20, 75, 20, 50);
            // Míček
            ball.x += ball.dx; ball.y += ball.dy;
            if(ball.x<0 || ball.x>canvas.width) ball.dx *= -1;
            if(ball.y<0 || ball.y>canvas.height) ball.dy *= -1;
            ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(ball.x, ball.y, 4, 0, 7); ctx.fill();
            // Hráči
            objects.forEach(o => {
                o.x += o.dx; o.y += o.dy;
                if(o.x<0 || o.x>canvas.width) o.dx *= -1;
                if(o.y<0 || o.y>canvas.height) o.dy *= -1;
                ctx.fillStyle = o.team === 'h' ? 'yellow' : 'white';
                ctx.beginPath(); ctx.arc(o.x, o.y, 8, 0, 7); ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        canvas.width = window.innerWidth; canvas.height = window.innerHeight * 0.6;
        draw();
    }

    function finishMatch(s) {
        document.getElementById('sim-screen').style.display = 'none';
        let winMoney = s.h > s.a ? 750 : 0;
        let bonus = Math.random() < 0.1 ? 1000 : 0;
        db.money += (winMoney + bonus);
        
        db.players.filter(p => p.sleepUntil < Date.now()).forEach(p => {
            p.energy = Math.max(0, p.energy - (Math.floor(Math.random()*10)+1));
        });

        save(); updateUI();
        alert(`Zápas skončil! Výhra: ${winMoney} 🪙. Bonus: ${bonus} 🪙.`);
    }

    function save() { localStorage.setItem('fb_pro_final', JSON.stringify(db)); }
    function resetGame() { localStorage.clear(); location.reload(); }

    window.onload = () => {
        let s = localStorage.getItem('fb_pro_final');
        if(s) { db = JSON.parse(s); document.getElementById('scr-reg').style.display='none'; document.getElementById('nav').style.display='flex'; document.getElementById('top-ui').style.display='flex'; nav('match'); }
        setInterval(() => { if(document.getElementById('scr-sleep').classList.contains('active')) renderSleep(); }, 1000);
    };
</script>
</body>
</html>
