<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Pro Manager v9.4</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #020617; --accent: #00ff88; --gold: #fbbf24; --text: #f8fafc;
            --r-basic: #94a3b8; --r-medium: #22c55e; --r-rare: #3b82f6; --r-epic: #a855f7;
            --glass: rgba(15, 23, 42, 0.8);
        }
        body { font-family: 'Montserrat', sans-serif; color: var(--text); margin: 0; background: var(--bg); overflow: hidden; }

        /* UNIKÁTNÍ POZADÍ PRO SEKCE */
        #scr-match { background: radial-gradient(circle at center, #064e3b 0%, #020617 100%); }
        #scr-sleep { background: linear-gradient(135deg, #1e1b4b 0%, #020617 100%); }
        #scr-profile { background: radial-gradient(circle at top, #1e293b 0%, #020617 100%); }
        #scr-shop { background: linear-gradient(135deg, #431407 0%, #020617 100%); }

        .screen { display: none; padding: 20px; height: 100vh; box-sizing: border-box; overflow-y: auto; padding-bottom: 100px; }
        .active { display: block; }

        /* UI PRVKY */
        #top-ui { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-around; padding: 15px 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .stat { display: flex; align-items: center; gap: 8px; font-weight: 900; font-family: 'Orbitron'; }

        /* HŘIŠTĚ V SESTAVĚ */
        .tactical-field { 
            width: 100%; height: 400px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); 
            border-radius: 20px; position: relative; margin-top: 20px; overflow: hidden;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='50' cy='50' r='10' fill='none' stroke='white' stroke-opacity='0.1'/%3E%3C/svg%3E");
        }
        .pos-slot { position: absolute; transform: translate(-50%, -50%); text-align: center; width: 80px; }
        .avatar-circle { width: 55px; height: 55px; border-radius: 50%; background: #000; border: 3px solid var(--r-basic); margin: 0 auto; overflow: hidden; }
        .avatar-circle img { width: 100%; height: 100%; }
        .lvl-tag { background: var(--accent); color: #000; font-size: 0.7rem; font-weight: 900; padding: 2px 6px; border-radius: 5px; margin-top: -10px; position: relative; z-index: 2; display: inline-block; }

        /* MATCH ENGINE */
        #match-canvas { width: 100%; height: 250px; background: #064e3b; border-radius: 15px; position: relative; overflow: hidden; border: 3px solid #059669; }
        .tv-score { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: #000; padding: 5px 15px; border-radius: 5px; display: flex; gap: 10px; font-family: 'Orbitron'; border: 1px solid #333; }
        .player-puck { position: absolute; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .game-ball { position: absolute; width: 8px; height: 8px; background: #fff; border-radius: 50%; transition: all 0.3s linear; box-shadow: 0 0 10px white; }

        /* BOT NAV */
        #bot-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; }
        .nav-btn { opacity: 0.5; text-align: center; font-size: 0.6rem; font-weight: 700; color: white; text-decoration: none; cursor: pointer; }
        .nav-btn.active { opacity: 1; color: var(--accent); }
        
        button { background: var(--accent); border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; width: 100%; }
        button:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }

        .card { background: var(--glass); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div id="top-ui">
        <div class="stat" style="color:var(--gold)">🪙 <span id="ui-money">0</span></div>
        <div class="stat" style="color:#f97316">🏆 <span id="ui-trophies">0</span></div>
        <div class="stat" style="color:var(--accent)">PWR: <span id="ui-pwr">0</span></div>
    </div>

    <div id="scr-match" class="screen">
        <h2 style="margin-top:60px; font-family:'Orbitron'">STADION</h2>
        <div id="match-canvas">
            <div class="tv-score"><span id="s-h">0</span> : <span id="s-a">0</span> <span id="m-timer" style="color:var(--accent); margin-left:10px;">30s</span></div>
            <div id="m-players"></div>
            <div id="m-ball" class="game-ball"></div>
        </div>
        <div style="margin-top:20px;">
            <button id="btn-play" onclick="startMatch()">ZAHÁJIT ZÁPAS (30s)</button>
        </div>
        <div id="match-cooldown" style="text-align:center; margin-top:10px; color:var(--r-basic); display:none;">
            Tým regeneruje... <span id="cd-timer">30</span>s
        </div>
    </div>

    <div id="scr-profile" class="screen">
        <h2 style="margin-top:60px; font-family:'Orbitron'">TAKTIKA</h2>
        <div class="tactical-field">
            <div class="pos-slot" style="top:85%; left:50%" onclick="selP('GK')"><div id="v-GK" class="avatar-circle"></div><div id="l-GK" class="lvl-tag">-</div></div>
            <div class="pos-slot" style="top:65%; left:25%" onclick="selP('LD')"><div id="v-LD" class="avatar-circle"></div><div id="l-LD" class="lvl-tag">-</div></div>
            <div class="pos-slot" style="top:65%; left:75%" onclick="selP('RD')"><div id="v-RD" class="avatar-circle"></div><div id="l-RD" class="lvl-tag">-</div></div>
            <div class="pos-slot" style="top:35%; left:20%" onclick="selP('LW')"><div id="v-LW" class="avatar-circle"></div><div id="l-LW" class="lvl-tag">-</div></div>
            <div class="pos-slot" style="top:40%; left:50%" onclick="selP('C')"><div id="v-C" class="avatar-circle"></div><div id="l-C" class="lvl-tag">-</div></div>
            <div class="pos-slot" style="top:35%; left:80%" onclick="selP('RW')"><div id="v-RW" class="avatar-circle"></div><div id="l-RW" class="lvl-tag">-</div></div>
        </div>
        <div id="selection-list" style="margin-top:20px;"></div>

        <h3 style="border-left:4px solid var(--accent); padding-left:10px;">VYBAVENÍ (FLORBALKY)</h3>
        <div id="sticks-list" style="display:grid; grid-template-columns: repeat(2,1fr); gap:10px;"></div>
    </div>

    <div id="scr-shop" class="screen">
        <h2 style="margin-top:60px; font-family:'Orbitron'">OBCHOD</h2>
        <div class="card" style="border-color:var(--accent)">
            <h3>FREEZ Balíček</h3>
            <p style="font-size:0.8rem">Obsahuje 1x FREEZ florbalku (Lvl 1-9).<br>Bonus: +5% až +25% k síle týmu.</p>
            <button onclick="buyStick()">KOUPIT (3 000 🪙)</button>
        </div>
        <div class="card">
            <h3>Hráčský Balíček</h3>
            <button onclick="buyPlayer()" style="background:var(--r-rare)">KOUPIT (5 000 🪙)</button>
        </div>
    </div>

    <div id="scr-sleep" class="screen">
        <h2 style="margin-top:60px; font-family:'Orbitron'">KABINA</h2>
        <div id="sleep-list"></div>
    </div>

    <div id="bot-nav">
        <div class="nav-btn" onclick="prepni('sleep')">💤<br>KABINA</div>
        <div class="nav-btn active" onclick="prepni('match')">🏟️<br>ZÁPAS</div>
        <div class="nav-btn" onclick="prepni('profile')">📋<br>TÝM</div>
        <div class="nav-btn" onclick="prepni('shop')">🛒<br>OBCHOD</div>
    </div>

<script>
    let db = JSON.parse(localStorage.getItem('fb_v9_4')) || {
        m: 5000, trophies: 0, p: [], lineup: {GK:null,LD:null,RD:null,LW:null,C:null,RW:null},
        sticks: [], activeStick: null, lastMatch: 0
    };

    function save() { localStorage.setItem('fb_v9_4', JSON.stringify(db)); }

    // Bonusy florbalek: Lvl 1=5%, 2=8%, 3=10%, 4=12%, 5=14%, 6=16%, 7=18%, 8=20%, 9=25%
    const stickBonuses = [0, 5, 8, 10, 12, 14, 16, 18, 20, 25];

    function getPwr() {
        let sum = 0;
        for(let pos in db.lineup) {
            let h = db.p.find(x => x.id === db.lineup[pos]);
            if(h) sum += h.lvl;
        }
        if(db.activeStick !== null) {
            let bonusPct = stickBonuses[db.sticks[db.activeStick].lvl] || 0;
            sum = Math.round(sum * (1 + bonusPct/100));
        }
        return sum;
    }

    function prepni(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('scr-' + id).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        if(id === 'profile') renderField();
        if(id === 'sleep') renderSleep();
        updateUI();
    }

    function updateUI() {
        document.getElementById('ui-money').innerText = db.m.toLocaleString();
        document.getElementById('ui-trophies').innerText = db.trophies;
        document.getElementById('ui-pwr').innerText = getPwr();
        
        // Cooldown check
        let now = Date.now();
        let diff = now - db.lastMatch;
        if(diff < 30000) {
            document.getElementById('btn-play').disabled = true;
            document.getElementById('match-cooldown').style.display = 'block';
        } else {
            document.getElementById('btn-play').disabled = false;
            document.getElementById('match-cooldown').style.display = 'none';
        }
    }

    // MATCH LOGIKA
    function startMatch() {
        db.lastMatch = Date.now();
        document.getElementById('btn-play').disabled = true;
        let timeLeft = 30;
        let sh = 0, sa = 0;
        
        // Vytvořit hráče na ploše
        let layer = document.getElementById('m-players'); layer.innerHTML = "";
        let dots = [];
        for(let i=0; i<10; i++) {
            let d = document.createElement('div'); d.className = 'player-puck';
            d.style.background = i < 5 ? 'var(--r-rare)' : 'var(--r-epic)';
            layer.appendChild(d); dots.push(d);
        }

        let ball = document.getElementById('m-ball');

        let interval = setInterval(() => {
            timeLeft--;
            document.getElementById('m-timer').innerText = timeLeft + "s";
            
            // Plynulý pohyb
            dots.forEach(d => {
                d.style.left = Math.random() * 90 + "%";
                d.style.top = Math.random() * 80 + "%";
            });
            ball.style.left = dots[0].style.left; ball.style.top = dots[0].style.top;

            if(Math.random() < 0.15) { Math.random() > 0.5 ? sh++ : sa++; }
            document.getElementById('s-h').innerText = sh;
            document.getElementById('s-a').innerText = sa;

            if(timeLeft <= 0) {
                clearInterval(interval);
                finishMatch(sh, sa);
            }
        }, 1000);
        updateUI();
    }

    function finishMatch(sh, sa) {
        if(sh > sa) { db.m += 1000; db.trophies += 20; alert("VÝHRA! +1000 🪙"); }
        else if(sh === sa) { db.m += 200; alert("REMÍZA. +200 🪙"); }
        else { alert("PROHRA."); }
        save();
        updateUI();
        
        // Spustit vizuální odpočet cooldownu
        let cd = 30;
        let cInt = setInterval(() => {
            cd--;
            document.getElementById('cd-timer').innerText = cd;
            if(cd <= 0) { clearInterval(cInt); updateUI(); }
        }, 1000);
    }

    // SESTAVA & FLORBALKY
    function renderField() {
        for(let pos in db.lineup) {
            let h = db.p.find(x => x.id === db.lineup[pos]);
            let circle = document.getElementById('v-' + pos);
            let tag = document.getElementById('l-' + pos);
            if(h) {
                circle.innerHTML = `<img src="https://api.dicebear.com/9.x/adventurer/svg?seed=${h.id}">`;
                tag.innerText = "Lvl " + h.lvl;
            } else {
                circle.innerHTML = ""; tag.innerText = "-";
            }
        }
        // Florbalky
        let sl = document.getElementById('sticks-list'); sl.innerHTML = "";
        db.sticks.forEach((s, idx) => {
            let active = db.activeStick === idx;
            sl.innerHTML += `<div class="card" style="border-color:${active?var(--accent):'#333'}">
                <b>FREEZ Lvl ${s.lvl}</b><br>
                <small>Bonus: +${stickBonuses[s.lvl]}%</small>
                <button onclick="useStick(${idx})" style="margin-top:5px; font-size:0.6rem; background:${active?'var(--r-basic)':''}">${active?'NASAZENO':'NASADIT'}</button>
            </div>`;
        });
    }

    function selP(pos) {
        let list = document.getElementById('selection-list');
        list.innerHTML = `<h3>Vyber: ${pos}</h3>`;
        db.p.filter(x => x.pos === pos || !x.pos).forEach(h => {
            list.innerHTML += `<div class="card" onclick="setPos('${pos}', ${h.id})" style="cursor:pointer">
                ${h.n} (Lvl ${h.lvl}) - Energie ${h.e}%
            </div>`;
        });
    }

    function setPos(pos, id) {
        db.lineup[pos] = id;
        document.getElementById('selection-list').innerHTML = "";
        save(); renderField(); updateUI();
    }

    function useStick(idx) { db.activeStick = idx; save(); renderField(); updateUI(); }

    function buyStick() {
        if(db.m < 3000) return alert("Málo peněz!");
        db.m -= 3000;
        let lvl = Math.floor(Math.random() * 9) + 1;
        db.sticks.push({lvl: lvl});
        alert("Získal jsi FREEZ Florbalku Lvl " + lvl);
        save(); updateUI();
    }

    // Generování startovních hráčů při první hře
    if(db.p.length === 0) {
        const positions = ["GK","LD","RD","LW","C","RW"];
        positions.forEach((pos, i) => {
            db.p.push({id: Date.now()+i, n: "Hráč "+(i+1), lvl: 1, pos: pos, e: 100});
            db.lineup[pos] = db.p[i].id;
        });
        save();
    }

    window.onload = () => prepni('match');
</script>
</body>
</html>
