<!DOCTYPE html>
<html>
<head>
  <title>Floorball Life Alpha</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
    .karta { border: 2px solid #00ffcc; border-radius: 15px; padding: 20px; background: #1e1e1e; max-width: 300px; margin: 0 auto; }
    .stat { font-size: 1.2em; margin: 10px 0; }
    button { background: #00ffcc; border: none; padding: 15px 30px; font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 1em; }
    button:disabled { background: #555; }
  </style>
</head>
<body>

  <h1>Floorball Life</h1>
  
  <div class="karta">
    <h2 id="jmeno">Načítání...</h2>
    <div class="stat">Střelba: <span id="strelba">0</span></div>
    <div class="stat">Chemie: <span id="chemie">0</span></div>
    <div class="stat">Energie: <span id="energie">100</span>%</div>
    <div class="stat">Peníze: <span id="penize">150</span> Kč</div>
  </div>

  <br>
  <button onclick="trenink()"> tvrdý trénink (-20% Energie, +5 Střelba)</button>

  <script>
    // Data tvého hráče
    let hrac = {
      jmeno: "Lukáš Novák",
      strelba: 50,
      chemie: 5,
      energie: 100,
      penize: 150
    };

    // Funkce pro vykreslení statistik na obrazovku
    function updateUI() {
      document.getElementById('jmeno').innerText = hrac.jmeno;
      document.getElementById('strelba').innerText = hrac.strelba;
      document.getElementById('chemie').innerText = hrac.chemie;
      document.getElementById('energie').innerText = hrac.energie;
      document.getElementById('penize').innerText = hrac.penize;
    }

    // Herní logika: Trénink
    function trenink() {
      if (hrac.energie >= 20) {
        hrac.energie -= 20;
        hrac.strelba += 5;
        alert("Dobrá práce! Tvá střela je teď o kousek přesnější.");
        updateUI();
      } else {
        alert("Jsi příliš unavený! Musíš si odpočinout.");
      }
    }

    // První vykreslení při startu
    updateUI();
  </script>
</body>
</html>
