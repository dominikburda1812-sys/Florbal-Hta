    <title>Floorball Manager PRO</title>

        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }

        /* HORNÍ LIŠTA */
        .ui-bar { background: var(--card); padding: 15px; border-bottom: 2px solid var(--primary); display: flex; justify-content: space-around; font-weight: bold; font-size: 1.1em; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }

        .screen { display: none; padding: 20px; height: 80vh; overflow-y: auto; box-sizing: border-box; padding-bottom: 100px; }
