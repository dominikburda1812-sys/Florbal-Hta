<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager v8.9</title>
    <style>
        :root { 
            --accent: #fbbf24; --field: #064e3b; 
            --text: #f8fafc; --danger: #ef4444; --success: #22c55e;
            --blue: #3b82f6; --red: #f43f5e; --glass: rgba(255, 255, 255, 0.1);
        }
        body { font-family: 'Inter', sans-serif; color: var(--text); margin: 0; background: #0a0e14; overflow-x: hidden; }
        
        /* TOP UI */
        #top-ui { display: none; background: rgba(10, 14, 20, 0.9); backdrop-filter: blur(15px); padding: 12px; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 1000; }
        .stat-badge { background: var(--glass); padding: 6px 12px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); font-weight: 700; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; }

        /* SCREENS */
        .screen { display: none; padding: 20px; padding-bottom: 110px; min-height: calc(100vh - 60px); animation: fadeIn 0.3s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: rgba(21, 26, 33, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 18px; margin-bottom: 15px; }
        button { background: linear-gradient(135deg, var(--accent), #d97706); color: #000; border: none; padding: 14px; border-radius: 12px; font-weight: 800; width: 100%; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        /* MATCH FIELD */
        #match-area { width: 100%; height: 220px; border-radius: 15px; position: relative; overflow: hidden; display: none; background: #064e3b; border: 2px solid var(--accent); margin-bottom: 15px; }
        .goal-net { position: absolute; width: 8px; height: 50px; border: 2px solid white; top: 50%; transform: translateY(-50%); }
        .player-dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; z-index: 5; transition: 0.4s ease-out; }
        .gk-dot { border-radius: 2px; width: 14px; height: 14px; }
        .ball { position: absolute; width: 8px; height: 8px; background: #fff; border-radius: 50%; z-index: 10; transition: 0.2s linear; box-shadow: 0 0 8px #fff; }

        /* SETUP FIELD */
        .field { width: 100%; height: 260px; background: #022c22; border-radius: 20px; position: relative; margin: 15px 0; border: 1px solid #059669; }
        .pos-btn { position: absolute; width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; background: #000; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 800; }
        #p-GK { bottom: 8%; left: 44%; } #p-LD { bottom: 25%; left: 15%; } #p-RD { bottom: 25%; right: 15%; }
        #p-LW { top: 25%; left: 15%; } #p-C { top: 15%; left: 44%; } #p-RW { top: 25%; right: 15%; }

        /* PACKS */
        #pack-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 6000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .pack-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 3px solid var(--accent); padding: 40px; border-radius: 20px; text-align: center; }

        /* NAV */
        #bot-nav { display: none; position: fixed; bottom: 0; width: 100%; height: 80px; background: #0a0e14; border-top: 1px solid #333; z-index: 1000; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { font-size: 1.5rem; opacity: 0.3; }
        .nav-item.active { opacity: 1; color: var(--accent); }

        #setup-overlay { position: fixed; inset: 0; background: #0a0e14; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        #setup-overlay input { background: #1a202c; border: 2px solid var(--accent); color: white; padding: 15px; border-radius: 12px; margin: 20px 0; text-align: center; }
    </style>
</head>
<body>

    <div id="setup-overlay" style="display:none;">
        <h1 style="color:var(--accent); letter-spacing: 2px;">MANAGER STUDIO</h1>
        <input type="text" id="team-input" placeholder="NÁZEV TVÉHO KLUBU" maxlength="15">
        <button onclick="confirmTeamName()">ZAČÍT KARIÉRU</button>
    </div>

    <div id="top-ui">
        <div style="display:flex; gap:8px;">
            <div class="stat-badge">🪙 <span id="ui-money">0</span></div>
            <div class="stat-badge">👥 <span id="ui-pcount">0</span></div>
            <div class="stat-badge" style="color:var(--accent)">LVL <span id="ui-lvl">0</span></div>
        </div>
        <div class="stat-badge" id="ui-team-name">Klub</div>
    </div>

    <div id="scr-match" class="screen">
        <h3 id="league-info">Ligový zápas</h3>
        <div id="match-area">
            <div style="position:absolute; top:10px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); padding:5px 20px; border-radius:30px; font-weight:900; z-index:100; border:1px solid var(--accent);">
                <span id="score-h" style="color:var(--blue)">0</span> : <span id="score-a" style="color:var(--red)">0</span>
            </div>
            <div class="goal-net" style="left:0; border-left:none;"></div>
            <div class="goal-net" style="right:0; border-right:none;"></div>
            <div id="m-ball" class="ball"></div>
            <div id="players-layer"></div>
        </div>
        <button id="btn-play" onclick="initMatch()">ODEHRÁT ZÁPAS</button>
        <div id="liga-tabulka" style="margin-top:20px;"></div>
    </div>

    <div id="scr-sleep" class="screen">
        <h3>Kabina / Regenerace</h3>
        <div id="hraci-list"></div>
    </div>

    <div id="scr-profile" class="screen">
        <h3>Sestava týmu</h3>
        <div class="field">
            <div id="p-GK" class="pos-btn" onclick="openSelect('GK')">GK</div>
            <div id="p-LW" class="pos-btn" onclick="openSelect('LW')">LW</div>
            <div id="p-C" class="pos-btn" onclick="openSelect('C')">C</div>
            <div id="p-RW" class="pos-btn" onclick="openSelect('RW')">RW</div>
            <div id="p-LD" class="pos-btn" onclick="openSelect('LD')">LD</div>
            <div id="p-RD" class="pos-btn" onclick="openSelect('RD')">RD</div>
        </div>
        <div id="select-box"></div>
    </div>

    <div id="scr-shop" class="screen">
        <h3>Drafty & Balíčky</h3>
        <div class="card">
            <p>Bronzový Draft (Lvl 1-9)</p>
            <button onclick="buyPack('bronz')">5 000 🪙</button>
        </div>
        <div class="card">
            <p>Stříbrný Draft (Lvl 10-19)</p>
            <button onclick="buyPack('silver')" style="background:#94a3b8;">10 000 🪙</button>
        </div>
        <div class="card">
            <p>Zlatý Draft (Lvl 20-29)</p>
            <button onclick="buyPack('gold')" style="background:#fde047;">15 000 🪙</button>
        </div>
    </div>

    <div id="pack-overlay">
        <div class="pack-card">
            <p id="pack-lvl" style="font-size:4rem; font-weight:900; color:var(--accent); margin:0;">?</p>
            <div id="pack-name" style="font-size:1.2rem; margin:20px 0; font-weight:bold;">...</div>
            <button id="pack-btn" style="display:none;" onclick="closePack()">PŘIDAT DO TÝMU</button>
        </div>
    </div>

    <div id="bot-nav">
        <div class="nav-item" onclick="prepni('sleep')">🛌</div>
        <div class="nav-item active" onclick="prepni('match')">🥅</div>
        <div class="nav-item" onclick="prepni('profile')">👤</div>
        <div class="nav-item" onclick="prepni('shop')">📦</div>
    </div>

<script>
    let db = JSON.parse(localStorage.getItem('fb_v8_9')) || {
        m: 10000, p: [], lineup: {GK:null,LW:null,C:null,RW:null,LD:null,RD:null},
        wins: 0, league: [{n:"Sparta",lvl:6,pts:0},{n:"Chodov",lvl:8,pts:0}],
        lastMatch: 0, teamName: "", firstMatchDone: false
    };

    const names = ["Filip","Lukáš","Matěj","Adam","Jakub","Tomáš","Petr","David","Honza","Vojta"];
    const sNames = ["Kysela","Němec","Dvořák","Marek","Horák","Beneš","Konečný","Kříž","Svoboda"];

    function save() { localStorage.setItem('fb_v8_9', JSON.stringify(db)); }

    function confirmTeamName() {
        let n = document.getElementById('team-input').value.trim();
        if(n.length < 3) return alert("Zadej aspoň 3 znaky!");
        db.teamName = n;
        db.league.push({n: n, lvl: 1, pts: 0, isP: true});
        const pos = ["GK","LW","C","RW","LD","RD"];
        pos.forEach((p, i) => {
            let h = {id:Date.now()+i, n:names[i]+" "+sNames[i], lvl:1, pos:p, e:100};
            db.p.push(h); db.lineup[p] = h.id;
        });
        document.getElementById('setup-overlay').style.display = 'none';
        save(); window.location.reload();
    }

    function prepni(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('scr-' + id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        const navMap = {sleep:0, match:1, profile:2, shop:3};
        document.querySelectorAll('.nav-item')[navMap[id]].classList.add('active');
        if(id==='profile') renderField();
        if(id==='match') renderLeague();
        updateUI();
    }

    function updateUI() {
        document.getElementById('ui-money').innerText = db.m.toLocaleString();
        document.getElementById('ui-pcount').innerText = db.p.length;
        document.getElementById('ui-team-name').innerText = db.teamName || "Klub";
        let sum = 0, count = 0;
        for(let pos in db.lineup) {
            let h = db.p.find(x => x.id === db.lineup[pos]);
            if(h) { sum += h.lvl; count++; }
        }
        db.avgLvl = count === 6 ? Math.round(sum/6) : 0;
        document.getElementById('ui-lvl').innerText = db.avgLvl;
    }

    // MATCH ENGINE
    function calculateWinProb(pLvl, oLvl) {
        let d = pLvl - oLvl;
        if(d <= -8) return 1; if(d === -7) return 5; if(d === -6) return 10;
        if(d === -5) return 15; if(d === -4) return 20; if(d === -3) return 25;
        if(d === -2) return 30; if(d === -1) return 50; if(d === 0) return 67;
        if(d === 1) return 75; return 99;
    }

    function initMatch() {
        if(db.p.length < 6) return alert("Máš málo hráčů!");
        let oppLvl = (db.avgLvl < 10) ? Math.floor(Math.random()*8)+1 : Math.floor(Math.random()*15)+8;
        let prob = calculateWinProb(db.avgLvl, oppLvl);
        let roll = Math.random() * 100;
        
        let result = "loss";
        if(!db.firstMatchDone || roll < prob) result = "win";
        else if(roll < prob + 10) result = "draw";

        startMatchAnimation(result);
    }

    function startMatchAnimation(finalResult) {
        db.lastMatch = Date.now(); save(); updateTimers();
        document.getElementById('match-area').style.display = 'block';
        document.getElementById('btn-play').style.display = 'none';
        
        let sh = 0, sa = 0;
        let ball = document.getElementById('m-ball');
        let layer = document.getElementById('players-layer'); layer.innerHTML = "";
        let dots = [];
        for(let i=0; i<12; i++) {
            let d = document.createElement('div'); d.className = 'player-dot' + (i%6===0?' gk-dot':'');
            d.style.backgroundColor = i < 6 ? 'var(--blue)' : 'var(--red)';
            layer.appendChild(d); dots.push(d);
        }

        let timer = 0;
        let int = setInterval(() => {
            dots.forEach((d) => { d.style.left = Math.random()*90 + "%"; d.style.top = Math.random()*80 + "%"; });
            ball.style.left = dots[Math.floor(Math.random()*12)].style.left;
            ball.style.top = dots[Math.floor(Math.random()*12)].style.top;
            if(Math.random() < 0.1) Math.random() > 0.5 ? sh++ : sa++;
            document.getElementById('score-h').innerText = sh; document.getElementById('score-a').innerText = sa;

            if(++timer > 20) {
                clearInterval(int);
                if(finalResult === "win") { sh = Math.max(sh, sa + 1); if(sh==sa) sh++; }
                else if(finalResult === "draw") sh = sa;
                else { sa = Math.max(sa, sh + 1); if(sa==sh) sa++; }
                document.getElementById('score-h').innerText = sh; document.getElementById('score-a').innerText = sa;
                finishMatch(sh, sa);
            }
        }, 300);
    }

    function finishMatch(sh, sa) {
        let pT = db.league.find(x => x.isP);
        let bonusText = "";
        
        // Bonus za vstupné (10% šance na 10 000)
        if(Math.random() < 0.10) {
            db.m += 10000;
            bonusText = "\n\n🔥 VYPRODÁNO! Získáváš 10 000 🪙 za vstupné!";
        }

        if(sh > sa) { 
            db.m += 750; pT.pts += 3; db.firstMatchDone = true; 
            alert("VÝHRA! Získal jsi 750 🪙." + bonusText); 
        } else {
            alert("BEZ BODU. Výhra byla blízko." + bonusText);
        }

        document.getElementById('match-area').style.display = 'none';
        document.getElementById('btn-play').style.display = 'block';
        save(); updateUI(); renderLeague();
    }

    // PACKS
    function buyPack(type) {
        let cost = type==='bronz'?5000 : type==='silver'?10000 : 15000;
        if(db.m < cost) return alert("Chybí ti zlatáky!");
        db.m -= cost;
        
        let range = type==='bronz'?[1,9] : type==='silver'?[10,19] : [20,29];
        let lvl = Math.floor(Math.random()*(range[1]-range[0]+1))+range[0];
        let name = names[Math.floor(Math.random()*names.length)] + " " + sNames[Math.floor(Math.random()*sNames.length)];
        
        window.tempH = {id:Date.now(), n:name, lvl:lvl, pos:["LW","C","RW","LD","RD","GK"][Math.floor(Math.random()*6)], e:100};
        
        document.getElementById('pack-overlay').style.display = 'flex';
        document.getElementById('pack-lvl').innerText = lvl;
        document.getElementById('pack-name').innerText = name[0] + "...";
        document.getElementById('pack-btn').style.display = 'none';

        setTimeout(() => {
            document.getElementById('pack-name').innerText = name + " (" + window.tempH.pos + ")";
            document.getElementById('pack-btn').style.display = 'block';
        }, 1200);
    }

    function closePack() {
        db.p.push(window.tempH);
        document.getElementById('pack-overlay').style.display = 'none';
        save(); updateUI();
    }

    function renderLeague() {
        let div = document.getElementById('liga-tabulka');
        let html = `<table><tr><th>Tým</th><th>Body</th></tr>`;
        db.league.sort((a,b)=>b.pts-a.pts).forEach(t => {
            html += `<tr style="${t.isP?'color:var(--accent); font-weight:bold':''}"><td>${t.n}</td><td>${t.pts}</td></tr>`;
        });
        div.innerHTML = html + "</table>";
    }

    function renderField() {
        for(let pos in db.lineup) {
            let h = db.p.find(x => x.id === db.lineup[pos]);
            document.getElementById('p-'+pos).innerHTML = h ? `<b style="color:var(--accent)">${h.lvl}</b>` : pos;
        }
    }

    function openSelect(pos) {
        let div = document.getElementById('select-box');
        div.innerHTML = `<div class="card"><h3>Vyber pro ${pos}</h3>`;
        db.p.filter(x => x.pos === pos).forEach(h => {
            div.innerHTML += `<button onclick="setPos('${pos}', ${h.id})" style="margin:4px 0;">${h.n} (Lvl ${h.lvl})</button>`;
        });
        div.innerHTML += `<button onclick="this.parentElement.remove()" style="background:none; margin-top:10px;">ZAVŘÍT</button></div>`;
    }
    function setPos(pos, id) { db.lineup[pos] = id; renderField(); save(); document.getElementById('select-box').innerHTML=''; }

    function updateTimers() {
        let b = document.getElementById('btn-play');
        let rem = Math.ceil((db.lastMatch + 60000 - Date.now()) / 1000);
        if(rem > 0) { b.disabled = true; b.innerText = `ODPOČINEK ${rem}S`; }
        else { b.disabled = false; b.innerText = "ODEHRÁT ZÁPAS"; }
    }

    setInterval(updateTimers, 1000);

    window.onload = () => {
        if(!db.teamName) document.getElementById('setup-overlay').style.display = 'flex';
        else {
            document.getElementById('top-ui').style.display = 'flex';
            document.getElementById('bot-nav').style.display = 'flex';
            prepni('match');
        }
    }
</script>
</body>
</html>
