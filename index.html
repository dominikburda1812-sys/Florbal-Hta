<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager v6.9 - EMERGENCY FIX</title>
    <style>
        :root { --accent: #fbbf24; --bg: #05070a; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 0; }
        
        /* Layout */
        #top-ui { display: none; background: #111; padding: 10px; justify-content: space-around; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 100; }
        .screen { display: none; padding: 20px; padding-bottom: 100px; }
        #scr-reg { display: block; } /* Startovní obrazovka je vidět vždy jako první */
        
        /* UI Prvky */
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        button { background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; }
        button:disabled { background: #444; color: #888; }
        
        /* Hřiště */
        .field { width: 100%; height: 220px; background: #064e3b; border: 2px solid #059669; border-radius: 15px; position: relative; margin: 10px 0; }
        .pos-btn { position: absolute; width: 45px; height: 45px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,0.5); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; cursor: pointer; }
        #p-LW { top: 15%; left: 10%; } #p-C { top: 10%; left: 43%; } #p-RW { top: 15%; right: 10%; }
        #p-LD { bottom: 15%; left: 20%; } #p-RD { bottom: 15%; right: 20%; }

        /* Navigace */
        #bot-nav { display: none; position: fixed; bottom: 0; width: 100%; height: 70px; background: #111; justify-content: space-around; align-items: center; border-top: 1px solid #333; }
        .nav-item { font-size: 1.5rem; cursor: pointer; opacity: 0.5; }
        .nav-item.active { opacity: 1; color: var(--accent); }

        input { width: 100%; padding: 15px; margin-bottom: 15px; background: #000; border: 1px solid #444; color: #fff; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="top-ui">
        <div>🪙 <span id="m-money">0</span></div>
        <div>TÝM LVL: <span id="m-lvl">0</span></div>
        <div onclick="localStorage.clear(); location.reload();" style="color:red; font-size:0.6rem;">RESET</div>
    </div>

    <div id="scr-reg" class="screen">
        <h2>FLORBALOVÝ MANAŽER</h2>
        <div class="card">
            <input type="text" id="team-name" placeholder="Název tvého týmu...">
            <button onclick="startHry()">ZALOŽIT KLUB A HRÁT</button>
        </div>
    </div>

    <div id="scr-match" class="screen">
        <h3>ZÁPAS</h3>
        <div id="match-info" class="card" style="display:none; text-align:center; background:#064e3b;">
            <h2 id="live-score">0 : 0</h2>
            <p>Probíhá zápas...</p>
        </div>
        <button id="btn-match" onclick="hrajZapas()">ODEHRÁT ZÁPAS</button>
        <div class="card">
            <h4>TABULKA LIGY</h4>
            <div id="div-liga"></div>
        </div>
    </div>

    <div id="scr-sleep" class="screen">
        <h3>KABINA</h3>
        <div id="div-hraci"></div>
    </div>

    <div id="scr-profile" class="screen">
        <h3>SESTAVA</h3>
        <div class="field">
            <div id="p-LW" class="pos-btn" onclick="vyber('LW')">LW</div>
            <div id="p-C" class="pos-btn" onclick="vyber('C')">C</div>
            <div id="p-RW" class="pos-btn" onclick="vyber('RW')">RW</div>
            <div id="p-LD" class="pos-btn" onclick="vyber('LD')">LD</div>
            <div id="p-RD" class="pos-btn" onclick="vyber('RD')">RD</div>
        </div>
        <div id="vyber-hracu"></div>
    </div>

    <div id="bot-nav">
        <div class="nav-item" onclick="prepni('sleep')">🛌</div>
        <div class="nav-item" onclick="prepni('match')">🥅</div>
        <div class="nav-item" onclick="prepni('profile')">👤</div>
    </div>

<script>
    let hra = {
        penize: 10000,
        hraci: [],
        sestava: {LW:null, C:null, RW:null, LD:null, RD:null},
        nazevTymu: "",
        liga: [{n:"Tatran", p:0, lvl:5}, {n:"Vítkovice", p:0, lvl:7}]
    };

    function prepni(id) {
        let screens = document.getElementsByClassName('screen');
        for(let s of screens) s.style.display = 'none';
        document.getElementById('scr-' + id).style.display = 'block';
        
        if(id === 'match') vykresliLigu();
        if(id === 'sleep') vykresliHraci();
        if(id === 'profile') vykresliSestavu();
        aktualizujUI();
    }

    function startHry() {
        let n = document.getElementById('team-name').value;
        if(!n) { alert("Zadej jméno!"); return; }

        hra.nazevTymu = n;
        // Vytvořit 5 základních hráčů
        let pozice = ["LW","C","RW","LD","RD"];
        pozice.forEach((pos, i) => {
            let h = {id: Date.now()+i, jmeno: "Hráč " + (i+1), lvl: 1, pos: pos, energie: 100};
            hra.hraci.push(h);
            hra.sestava[pos] = h.id;
        });
        hra.liga.push({n: n, p: 0, lvl: 1, isP: true});

        document.getElementById('top-ui').style.display = 'flex';
        document.getElementById('bot-nav').style.display = 'flex';
        prepni('match');
        uloz();
    }

    function aktualizujUI() {
        document.getElementById('m-money').innerText = hra.penize;
        let soucet = 0;
        let count = 0;
        for(let p in hra.sestava) {
            let h = hra.hraci.find(x => x.id === hra.sestava[p]);
            if(h) { soucet += h.lvl; count++; }
        }
        let prumer = count === 5 ? Math.round(soucet/5) : 0;
        document.getElementById('m-lvl').innerText = prumer;
        
        let pT = hra.liga.find(x => x.isP);
        if(pT) pT.lvl = prumer;

        let btn = document.getElementById('btn-match');
        if(btn) btn.disabled = (count < 5);
    }

    function vykresliSestavu() {
        for(let p in hra.sestava) {
            let h = hra.hraci.find(x => x.id === hra.sestava[p]);
            let el = document.getElementById('p-' + p);
            el.innerHTML = h ? h.lvl : p;
            el.style.background = h ? "var(--accent)" : "rgba(0,0,0,0.5)";
            el.style.color = h ? "#000" : "#fff";
        }
    }

    function vyber(pos) {
        let div = document.getElementById('vyber-hracu');
        div.innerHTML = "<h4>Vyber pro " + pos + ":</h4>";
        hra.hraci.filter(x => x.pos === pos).forEach(h => {
            div.innerHTML += `<div class="card" onclick="nastavHrace('${pos}', ${h.id})">${h.jmeno} (LVL ${h.lvl})</div>`;
        });
    }

    function nastavHrace(pos, id) {
        hra.sestava[pos] = id;
        vykresliSestavu();
        document.getElementById('vyber-hracu').innerHTML = "";
        aktualizujUI();
        uloz();
    }

    function hrajZapas() {
        document.getElementById('match-info').style.display = 'block';
        document.getElementById('btn-match').style.display = 'none';
        let s1 = 0; let s2 = 0;
        let cas = 0;
        let int = setInterval(() => {
            cas++;
            if(Math.random() < 0.1) s1++;
            if(Math.random() < 0.1) s2++;
            document.getElementById('live-score').innerText = s1 + " : " + s2;
            if(cas > 10) {
                clearInterval(int);
                let pT = hra.liga.find(x => x.isP);
                if(s1 >= s2) { pT.p += 3; hra.penize += 1000; alert("VÝHRA! +1000 🪙"); }
                else { alert("PROHRA"); }
                document.getElementById('match-info').style.display = 'none';
                document.getElementById('btn-match').style.display = 'block';
                uloz();
                vykresliLigu();
            }
        }, 500);
    }

    function vykresliLigu() {
        let div = document.getElementById('div-liga');
        let html = "<table>";
        hra.liga.sort((a,b) => b.p - a.p).forEach(t => {
            html += `<tr style="${t.isP ? 'color:var(--accent)' : ''}"><td>${t.n}</td><td>${t.p} b.</td></tr>`;
        });
        div.innerHTML = html + "</table>";
    }

    function vykresliHraci() {
        let div = document.getElementById('div-hraci');
        div.innerHTML = "";
        hra.hraci.forEach(h => {
            div.innerHTML += `<div class="card">${h.jmeno} (${h.pos}) - LVL ${h.lvl}</div>`;
        });
    }

    function uloz() { localStorage.setItem('fb_v6_9', JSON.stringify(hra)); }

    window.onload = () => {
        let s = localStorage.getItem('fb_v6_9');
        if(s) {
            hra = JSON.parse(s);
            document.getElementById('scr-reg').style.display = 'none';
            document.getElementById('top-ui').style.display = 'flex';
            document.getElementById('bot-nav').style.display = 'flex';
            prepni('match');
        }
    };
</script>
</body>
</html>
