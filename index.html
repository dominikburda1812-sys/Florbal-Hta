<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Florbalové Karty</title>
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            max-width: 100%;
            height: auto;
        }
        .card:hover {
            transform: scale(1.1); /* Efekt zvětšení při najetí */
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="gallery">
        <img src="floorball_card_1.png" alt="Floorball Player 1" class="card">
        <img src="floorball_card_2.png" alt="Floorball Player 2" class="card">
        <img src="floorball_card_3.png" alt="Floorball Player 3" class="card">
        </div>

</body>
</html>
