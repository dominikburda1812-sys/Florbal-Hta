<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager v9.5 Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0f172a; --surface: rgba(30, 41, 59, 0.85); --surface-border: rgba(255, 255, 255, 0.15);
            --accent: #00ff88; --text: #f8fafc; --text-muted: #94a3b8;
            --blue: #3b82f6; --red: #ef4444; --gold: #fbbf24; --gold-glow: rgba(251, 191, 36, 0.4);
            --field: linear-gradient(180deg, #022c22 0%, #064e3b 100%);
            /* Rarities */
            --r-basic: #94a3b8; --r-medium: #22c55e; --r-rare: #3b82f6; --r-epic: #a855f7;
        }
        
        body { 
            font-family: 'Montserrat', sans-serif; color: var(--text); margin: 0; 
            background: linear-gradient(135deg, rgba(11, 19, 43, 0.9) 0%, rgba(28, 37, 65, 0.9) 100%), url('1773165632248.png') no-repeat center center fixed;
            background-size: cover; overflow-x: hidden; user-select: none; 
        }
        
        h3 { color: var(--text); text-transform: uppercase; letter-spacing: 1px; font-size: 1.1rem; border-left: 4px solid var(--accent); padding-left: 10px; margin-top: 0; }
        .card { background: var(--surface); backdrop-filter: blur(10px); border: 1px solid var(--surface-border); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        button { background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: 900; width: 100%; cursor: pointer; text-transform: uppercase; transition: all 0.2s; letter-spacing: 1px; }
        button:active { transform: scale(0.96); }
        button:disabled { background: #1e293b !important; color: #475569 !important; pointer-events: none; }

        .btn-red { background: var(--red); color: white; }
        .btn-blue { background: var(--blue); color: white; }

        #top-ui { display: none; background: rgba(5, 8, 15, 0.9); backdrop-filter: blur(20px); padding: 15px 20px; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--surface-border); position: sticky; top: 0; z-index: 1000; }
        .stat-badge { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 12px; font-weight: 800; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; border: 1px solid var(--surface-border); }
        .coin-badge { color: var(--gold); }

        .screen { display: none; padding: 20px; padding-bottom: 120px; animation: fade 0.3s ease-out; }
        .active { display: block; }
        @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

        /* MODAL CUSTOM */
        #custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(8px); padding: 20px; }
        .modal-box { background: #1e293b; border: 2px solid var(--accent); border-radius: 20px; padding: 30px; text-align: center; width: 100%; max-width: 350px; }

        /* TROPHY ROAD */
        .trophy-road-btn { background: linear-gradient(135deg, #f97316, #fbbf24); color: #000; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 12px; font-family: 'Orbitron', sans-serif; font-weight: 900; margin-bottom: 20px; cursor: pointer; }
        #tr-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5500; display: none; flex-direction: column; padding: 20px; }
        .tr-track-container { width: 100%; overflow-x: auto; padding: 40px 0; position: relative; }
        .tr-line { position: absolute; top: 50%; left: 0; height: 8px; background: #333; width: 1000px; z-index: 1; }
        .tr-line-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--gold); box-shadow: 0 0 15px var(--gold); transition: width 0.5s; }
        .tr-nodes { display: flex; gap: 80px; padding: 0 40px; position: relative; z-index: 2; width: max-content; }
        .tr-node { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100px; text-align: center; }
        .tr-circle { width: 60px; height: 60px; background: #111; border: 4px solid #444; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; cursor: pointer; }
        .tr-node.unlocked .tr-circle { border-color: var(--gold); background: rgba(251, 191, 36, 0.2); box-shadow: 0 0 15px var(--gold-glow); }

        /* MATCH AREA */
        #match-area { width: 100%; height: 250px; border-radius: 16px; position: relative; overflow: hidden; display: none; background: url('1773165633895.png') no-repeat center center; background-size: cover; border: 2px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .tv-scoreboard { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); display: flex; border-radius: 8px; overflow: hidden; border: 1px solid #444; z-index: 100; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; }
        .tv-team { padding: 5px 10px; font-weight: 900; }
        .tv-score { padding: 5px 10px; background: #000; color: var(--gold); }
        .player-dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; transition: 0.8s linear; }
        .ball { position: absolute; width: 8px; height: 8px; background: white; border-radius: 50%; box-shadow: 0 0 10px white; transition: 0.4s linear; }

        /* TACTICAL FIELD */
        .tactical-field { width: 100%; height: 300px; background: url('1773165633895.png') no-repeat center center; background-size: cover; border-radius: 16px; position: relative; border: 2px solid rgba(255,255,255,0.2); }
        .pos-slot { position: absolute; width: 50px; height: 50px; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .pos-avatar { width: 40px; height: 40px; border-radius: 50%; background: #000; border: 2px solid var(--surface-border); overflow: hidden; }
        .pos-avatar img { width: 100%; }
        .pos-lvl { position: absolute; bottom: -5px; background: var(--accent); color: #000; font-size: 0.6rem; font-weight: 900; padding: 2px 5px; border-radius: 5px; }
        #p-GK { top: 85%; left: 50%; } #p-LD { top: 65%; left: 25%; } #p-RD { top: 65%; left: 75%; }
        #p-LW { top: 35%; left: 20%; } #p-C { top: 40%; left: 50%; } #p-RW { top: 35%; left: 80%; }

        /* PACK OPENING */
        #pack-overlay { position: fixed; inset: 0; background: rgba(5, 8, 15, 0.98); z-index: 6000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .pack-card { background: #1e293b; padding: 40px; border-radius: 24px; text-align: center; border: 3px solid var(--surface-border); }

        #bot-nav { display: none; position: fixed; bottom: 0; width: 100%; height: 70px; background: rgba(5, 8, 15, 0.95); border-top: 1px solid var(--surface-border); z-index: 1000; justify-content: space-around; align-items: center; }
        .nav-item { display: flex; flex-direction: column; align-items: center; opacity: 0.5; color: white; font-size: 0.6rem; font-weight: 700; text-decoration: none; }
        .nav-item.active { opacity: 1; color: var(--accent); }
        .nav-icon { width: 24px; height: 24px; fill: currentColor; margin-bottom: 4px; }

        .bag-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .bag-slot { aspect-ratio: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--surface-border); border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; font-size: 1.5rem; cursor: pointer; }
        .working-badge { position: absolute; top: -5px; right: -5px; background: var(--gold); color: #000; font-size: 0.6rem; font-weight: 900; padding: 3px 6px; border-radius: 8px; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
    </style>
</head>
<body>

    <div id="custom-modal">
        <div class="modal-box" id="cm-box">
            <h2 id="cm-title" style="font-family:'Orbitron'">OZNÁMENÍ</h2>
            <p id="cm-text"></p>
            <button onclick="closeModal()" id="cm-btn">ROZUMÍM</button>
        </div>
    </div>

    <div id="top-ui">
        <div style="display:flex; gap:10px;">
            <div class="stat-badge coin-badge">🪙 <span id="ui-money">0</span></div>
            <div class="stat-badge" style="color:#f97316">🏆 <span id="ui-trophies">0</span></div>
        </div>
        <div class="stat-badge" style="color:var(--accent)">SÍLA: <span id="ui-lvl">0</span></div>
    </div>

    <div id="tr-overlay">
        <h2 style="text-align:center; font-family:'Orbitron'; color:var(--gold)">CESTA SLÁVY</h2>
        <button onclick="document.getElementById('tr-overlay').style.display='none'" style="background:#333; color:white; margin-bottom:20px;">ZAVŘÍT</button>
        <div class="tr-track-container">
            <div class="tr-line"><div class="tr-line-fill" id="tr-fill"></div></div>
            <div class="tr-nodes" id="tr-list"></div>
        </div>
    </div>

    <div id="scr-match" class="screen">
        <div class="trophy-road-btn" onclick="openTrophyRoad()">🏆 TROPHY ROAD (ODMĚNY)</div>
        
        <div id="match-area">
            <div class="tv-scoreboard">
                <div class="tv-team" id="tv-h" style="background:var(--blue)">DOM</div>
                <div class="tv-score"><span id="s-h">0</span>:<span id="s-a">0</span></div>
                <div class="tv-team" id="tv-a" style="background:var(--red)">HOS</div>
            </div>
            <div id="m-ball" class="ball"></div>
            <div id="m-players"></div>
        </div>

        <button id="btn-play" onclick="startMatch()">ZAHÁJIT ZÁPAS</button>
        <div id="match-cd" style="display:none; text-align:center; font-family:'Orbitron'; color:var(--accent); font-size:1.5rem;">REGENERACE: <span id="cd-val">30</span>s</div>
        
        <div class="card" style="margin-top:20px;">
            <h3>Ligová tabulka</h3>
            <div id="league-ui"></div>
        </div>
    </div>

    <div id="scr-team" class="screen">
        <h3>Taktická sestava</h3>
        <div class="tactical-field">
            <div class="pos-slot" id="p-GK" onclick="openSelect('GK')"><div class="pos-avatar" id="av-GK"></div><div class="pos-lvl" id="lvl-GK">-</div></div>
            <div class="pos-slot" id="p-LD" onclick="openSelect('LD')"><div class="pos-avatar" id="av-LD"></div><div class="pos-lvl" id="lvl-LD">-</div></div>
            <div class="pos-slot" id="p-RD" onclick="openSelect('RD')"><div class="pos-avatar" id="av-RD"></div><div class="pos-lvl" id="lvl-RD">-</div></div>
            <div class="pos-slot" id="p-LW" onclick="openSelect('LW')"><div class="pos-avatar" id="av-LW"></div><div class="pos-lvl" id="lvl-LW">-</div></div>
            <div class="pos-slot" id="p-C" onclick="openSelect('C')"><div class="pos-avatar" id="av-C"></div><div class="pos-lvl" id="lvl-C">-</div></div>
            <div class="pos-slot" id="p-RW" onclick="openSelect('RW')"><div class="pos-avatar" id="av-RW"></div><div class="pos-lvl" id="lvl-RW">-</div></div>
        </div>
        <div id="select-ui" style="margin-top:20px;"></div>

        <h3 style="margin-top:30px;">Inventář (Vybavení)</h3>
        <div class="bag-grid" id="bag-ui"></div>
    </div>

    <div id="scr-players" class="screen">
        <h3>Kabina a Práce</h3>
        <p style="font-size:0.7rem; color:var(--text-muted)">Hráči v práci vydělávají 🪙, ale nemohou hrát zápas.</p>
        <div id="players-list"></div>
    </div>

    <div id="scr-shop" class="screen">
        <h3>Obchod</h3>
        <div class="card" style="border-color:var(--gold)"><button onclick="buyPack('gold')">ZLATÝ BALÍČEK (10 000 🪙)</button></div>
        <div class="card" style="border-color:var(--blue)"><button onclick="buyPack('silver')">STŘÍBRNÝ BALÍČEK (5 000 🪙)</button></div>
        <div class="card" style="border-color:var(--accent)"><button onclick="buyStick()">BALÍČEK HOLÍ FREEZ (3 000 🪙)</button></div>
    </div>

    <div id="pack-overlay">
        <div class="pack-card">
            <h1 id="pack-res-lvl" style="font-family:'Orbitron'; font-size:4rem; margin:0;">?</h1>
            <p id="pack-res-name" style="font-weight:900;"></p>
            <div id="pack-res-rarity" style="font-size:0.7rem; letter-spacing:2px; margin-bottom:20px;"></div>
            <button onclick="document.getElementById('pack-overlay').style.display='none'">PŘEVZÍT</button>
        </div>
    </div>

    <div id="setup-screen" style="display:none; position:fixed; inset:0; background:var(--bg); z-index:9000; flex-direction:column; align-items:center; justify-content:center; padding:30px;">
        <h1 style="font-family:'Orbitron'; color:var(--accent)">PRO MANAGER</h1>
        <input type="text" id="setup-name" placeholder="NÁZEV KLUBU" style="width:100%; padding:15px; border-radius:10px; border:none; margin:20px 0; text-align:center; font-weight:bold;">
        <button onclick="createClub()">ZALOŽIT KLUB</button>
    </div>

    <div id="bot-nav">
        <div class="nav-item active" onclick="switchTab('match')"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>ZÁPAS</div>
        <div class="nav-item" onclick="switchTab('team')"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>TÝM</div>
        <div class="nav-item" onclick="switchTab('players')"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>KABINA</div>
        <div class="nav-item" onclick="switchTab('shop')"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>OBCHOD</div>
    </div>

<script>
    // DATA & STATE
    let db = JSON.parse(localStorage.getItem('fb_manager_v1')) || {
        money: 5000, trophies: 0, trClaimed: [], 
        players: [], sticks: [],
        lineup: {GK:null, LD:null, RD:null, LW:null, C:null, RW:null},
        league: [
            {n: "Tatran", pts: 0, lvl: 5}, {n: "Boleslav", pts: 0, lvl: 7}, 
            {n: "Vítkovice", pts: 0, lvl: 6}, {n: "Sparta", pts: 0, lvl: 4}
        ],
        clubName: "", lastMatch: 0
    };

    const trData = [
        {req: 10, rw: 1000, desc: "1 000 🪙"}, {req: 30, rw: "pack", desc: "Zlatý Balíček"},
        {req: 60, rw: 5000, desc: "5 000 🪙"}, {req: 100, rw: "stick", desc: "Pro hůl FREEZ"}
    ];

    function save() { localStorage.setItem('fb_manager_v1', JSON.stringify(db)); }

    // UTILS
    const names = ["Filip", "Matěj", "Adam", "Jakub", "Lukáš", "Tomáš"];
    const sNames = ["Němec", "Dvořák", "Marek", "Horák", "Beneš", "Kříž"];
    function getRarity(lvl) {
        if(lvl < 10) return {n:"BASIC", c:"#94a3b8"};
        if(lvl < 20) return {n:"RARE", c:"#3b82f6"};
        return {n:"EPIC", c:"#a855f7"};
    }
    function showModal(title, text) {
        document.getElementById('cm-title').innerText = title;
        document.getElementById('cm-text').innerText = text;
        document.getElementById('custom-modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('custom-modal').style.display = 'none'; }

    // SETUP
    function createClub() {
        let n = document.getElementById('setup-name').value.trim();
        if(n.length < 3) return alert("Příliš krátký název!");
        db.clubName = n;
        db.league.push({n: n, pts: 0, lvl: 1, isP: true});
        ["GK","LD","RD","LW","C","RW"].forEach(p => {
            let h = generatePlayer(1, 3, p);
            db.players.push(h);
            db.lineup[p] = h.id;
        });
        document.getElementById('setup-screen').style.display = 'none';
        save(); switchTab('match'); updateUI();
    }

    // MATCH LOGIC
    function startMatch() {
        let now = Date.now();
        if(now < db.lastMatch + 30000) return;
        
        // Kontrola, zda někdo nepracuje nebo nespí
        for(let p in db.lineup) {
            let h = db.players.find(x => x.id === db.lineup[p]);
            if(h.working) return showModal("Chyba", `Hráč ${h.n} je v práci!`);
        }

        document.getElementById('match-area').style.display = 'block';
        document.getElementById('btn-play').style.display = 'none';
        
        let sh = 0, sa = 0;
        let timer = 30;
        let mLayer = document.getElementById('m-players'); mLayer.innerHTML = "";
        let ball = document.getElementById('m-ball');
        
        // Vytvořit vizuální hráče
        for(let i=0; i<12; i++) {
            let d = document.createElement('div'); d.className = 'player-dot';
            d.style.background = i < 6 ? 'var(--blue)' : 'var(--red)';
            mLayer.appendChild(d);
        }

        let int = setInterval(() => {
            timer--;
            // Pohyb hráčů a míčku
            Array.from(mLayer.children).forEach(d => {
                d.style.left = Math.random()*90+"%"; d.style.top = Math.random()*80+"%";
            });
            ball.style.left = Math.random()*90+"%"; ball.style.top = Math.random()*80+"%";

            if(Math.random() > 0.8) { Math.random() > 0.5 ? sh++ : sa++; }
            document.getElementById('s-h').innerText = sh;
            document.getElementById('s-a').innerText = sa;

            if(timer <= 0) {
                clearInterval(int);
                finishMatch(sh, sa);
            }
        }, 1000);
    }

    function finishMatch(sh, sa) {
        db.lastMatch = Date.now();
        let pT = db.league.find(x => x.isP);
        let win = sh > sa;
        let draw = sh === sa;

        if(win) {
            db.money += 500; db.trophies += 15; pT.pts += 3;
            showModal("VÍTĚZSTVÍ!", "Získal jsi 500 🪙 a 15 🏆");
        } else if(draw) {
            db.money += 100; pT.pts += 1;
            showModal("REMÍZA", "Získal jsi 100 🪙");
        } else {
            showModal("PROHRA", "Příště to vyjde!");
        }

        document.getElementById('match-area').style.display = 'none';
        save(); updateUI(); renderLeague();
    }

    // TROPHY ROAD
    function openTrophyRoad() {
        let list = document.getElementById('tr-list'); list.innerHTML = "";
        let maxReq = trData[trData.length-1].req;
        document.getElementById('tr-fill').style.width = Math.min(100, (db.trophies/maxReq)*100) + "%";

        trData.forEach((node, i) => {
            let unlocked = db.trophies >= node.req;
            let claimed = db.trClaimed.includes(i);
            list.innerHTML += `
                <div class="tr-node ${unlocked?'unlocked':''}">
                    <div class="tr-circle" onclick="claimTR(${i})">${claimed?'✔️':(unlocked?'🎁':'🔒')}</div>
                    <div style="font-weight:900">${node.req} 🏆</div>
                    <div style="font-size:0.6rem">${node.desc}</div>
                </div>
            `;
        });
        document.getElementById('tr-overlay').style.display = 'flex';
    }

    function claimTR(i) {
        if(db.trophies < trData[i].req || db.trClaimed.includes(i)) return;
        db.trClaimed.push(i);
        let rw = trData[i].rw;
        if(typeof rw === 'number') db.money += rw;
        else if(rw === 'pack') openPack(15, 25);
        else if(rw === 'stick') { db.sticks.push({lvl: 5, n: "FREEZ Pro"}); }
        
        save(); updateUI(); openTrophyRoad();
    }

    // PLAYERS & WORK
    function renderPlayers() {
        let div = document.getElementById('players-list'); div.innerHTML = "";
        db.players.forEach(h => {
            let r = getRarity(h.lvl);
            div.innerHTML += `
                <div class="card" style="border-left: 5px solid ${r.c}">
                    <div style="display:flex; justify-content:space-between">
                        <b>${h.n} (${h.pos})</b>
                        <span style="color:${r.c}">LVL ${h.lvl}</span>
                    </div>
                    <div style="margin: 10px 0; font-size: 0.8rem">
                        Stav: ${h.working ? '💼 PRACUJE' : '🏠 V KABINĚ'}
                    </div>
                    <button class="${h.working?'btn-red':'btn-blue'}" onclick="toggleWork(${h.id})">
                        ${h.working ? 'UKONČIT PRÁCI' : 'POSLAT DO PRÁCE'}
                    </button>
                </div>
            `;
        });
    }

    function toggleWork(id) {
        let h = db.players.find(x => x.id === id);
        if(!h.working && Object.values(db.lineup).includes(id)) {
            return showModal("Pozor", "Hráč je v základní sestavě! Nejdřív ho vystřídej.");
        }
        h.working = !h.working;
        save(); renderPlayers();
    }

    // SYSTEM
    function generatePlayer(min, max, pos) {
        return {
            id: Date.now() + Math.random(),
            n: names[Math.floor(Math.random()*6)] + " " + sNames[Math.floor(Math.random()*6)],
            lvl: Math.floor(Math.random()*(max-min+1))+min,
            pos: pos || "C",
            working: false
        };
    }

    function openPack(min, max) {
        let h = generatePlayer(min, max);
        db.players.push(h);
        document.getElementById('pack-overlay').style.display = 'flex';
        document.getElementById('pack-res-lvl').innerText = h.lvl;
        document.getElementById('pack-res-name').innerText = h.n;
        let r = getRarity(h.lvl);
        document.getElementById('pack-res-rarity').innerText = r.n;
        document.getElementById('pack-res-rarity').style.color = r.c;
        save(); updateUI();
    }

    function buyPack(type) {
        let price = type === 'gold' ? 10000 : 5000;
        if(db.money < price) return;
        db.money -= price;
        openPack(type === 'gold' ? 15 : 5, type === 'gold' ? 30 : 15);
    }

    function switchTab(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('scr-'+id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if(id === 'players') renderPlayers();
        if(id === 'team') { renderField(); renderBag(); }
        if(id === 'match') renderLeague();
        updateUI();
    }

    function renderField() {
        for(let p in db.lineup) {
            let h = db.players.find(x => x.id === db.lineup[p]);
            if(h) {
                let r = getRarity(h.lvl);
                document.getElementById('lvl-'+p).innerText = h.lvl;
                document.getElementById('av-'+p).innerHTML = `<img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${h.id}">`;
                document.getElementById('av-'+p).style.borderColor = r.c;
            }
        }
    }

    function renderBag() {
        let ui = document.getElementById('bag-ui'); ui.innerHTML = "";
        db.sticks.forEach(s => {
            ui.innerHTML += `<div class="bag-slot">🏒<div style="font-size:0.5rem; position:absolute; bottom:2px;">LVL ${s.lvl}</div></div>`;
        });
    }

    function renderLeague() {
        let ui = document.getElementById('league-ui');
        let sorted = [...db.league].sort((a,b) => b.pts - a.pts);
        ui.innerHTML = sorted.map((t, i) => `
            <div style="display:flex; justify-content:space-between; padding:5px; border-bottom:1px solid #333; ${t.isP?'color:var(--accent)':''}">
                <span>${i+1}. ${t.n}</span>
                <b>${t.pts} b.</b>
            </div>
        `).join("");
    }

    function updateUI() {
        document.getElementById('ui-money').innerText = db.money.toLocaleString();
        document.getElementById('ui-trophies').innerText = db.trophies;
        document.getElementById('tv-h').innerText = db.clubName.substring(0,3).toUpperCase();
        
        let totalLvl = 0;
        for(let p in db.lineup) {
            let h = db.players.find(x => x.id === db.lineup[p]);
            if(h) totalLvl += h.lvl;
        }
        document.getElementById('ui-lvl').innerText = Math.floor(totalLvl / 6);
    }

    // GAME LOOP (Peníze z práce)
    setInterval(() => {
        db.players.forEach(h => {
            if(h.working) db.money += Math.floor(h.lvl / 2);
        });
        updateUI();
        
        // Cooldown timer
        let cd = Math.ceil((db.lastMatch + 30000 - Date.now()) / 1000);
        if(cd > 0) {
            document.getElementById('match-cd').style.display = 'block';
            document.getElementById('cd-val').innerText = cd;
            document.getElementById('btn-play').style.display = 'none';
        } else {
            document.getElementById('match-cd').style.display = 'none';
            document.getElementById('btn-play').style.display = 'block';
        }
    }, 5000);

    window.onload = () => {
        if(!db.clubName) document.getElementById('setup-screen').style.display = 'flex';
        else { switchTab('match'); }
    };
</script>
</body>
</html>
