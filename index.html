<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager PRO v7.5</title>
    <style>
        :root { 
            --accent: #fbbf24; --bg: #0a0e14; --card: #151a21; 
            --text: #e2e8f0; --danger: #ef4444; --warning: #f59e0b; --success: #22c55e;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; overflow-x: hidden; }
        
        #top-ui { 
            display: flex; background: #0f131a; padding: 15px; border-bottom: 1px solid #333; 
            justify-content: space-between; align-items: center; font-size: 0.9rem; position: sticky; top: 0; z-index: 1000;
        }
        
        .screen { display: none; padding: 20px; padding-bottom: 120px; }
        .active { display: block; }

        .card { background: var(--card); border: 1px solid #2d3748; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
        
        /* Energy & Progress */
        .energy-bar { height: 8px; background: #2d3748; border-radius: 4px; margin: 8px 0; overflow: hidden; }
        .energy-fill { height: 100%; transition: width 0.5s, background-color 0.5s; }

        button { 
            background: linear-gradient(135deg, var(--accent), #d97706); border: none; color: #000;
            padding: 12px; border-radius: 10px; font-weight: 800; width: 100%; cursor: pointer; text-transform: uppercase;
        }
        button:disabled { background: #2d3748; color: #555; cursor: not-allowed; }

        /* Bottom Nav */
        #bot-nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: #0f131a; border-top: 1px solid #333; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { font-size: 1.5rem; opacity: 0.4; cursor: pointer; }
        .nav-item.active { opacity: 1; color: var(--accent); }
    </style>
</head>
<body>

    <div id="top-ui">
        <div style="display:flex; gap:15px;">
            <div>🪙 <span id="ui-money" style="color:var(--accent); font-weight:bold;">10 000</span></div>
            <div>LVL: <span id="ui-lvl" style="color:var(--accent); font-weight:bold;">0</span></div>
        </div>
        <div>Hráči: <span id="ui-count" style="color:var(--accent); font-weight:bold;">0</span></div>
    </div>

    <div id="scr-sleep" class="screen">
        <h2 style="margin-top:0">KABINA & REGENERACE</h2>
        <div id="hraci-list"></div>
    </div>

    <div id="bot-nav">
        <div class="nav-item active" onclick="prepni('sleep')">🛌</div>
        <div class="nav-item" onclick="prepni('match')">🥅</div>
        <div class="nav-item" onclick="prepni('profile')">👤</div>
        <div class="nav-item" onclick="prepni('shop')">📦</div>
    </div>

<script>
    // Předpokládáme existenci db z předchozích verzí
    let db = JSON.parse(localStorage.getItem('fb_v7_5')) || {
        m: 10000, p: [], b: Array(20).fill(null),
        lineup: {LW:null, C:null, RW:null, LD:null, RD:null},
        name: "", matches: 0,
        league: [{n:"Tatran", lvl:5, pts:0}, {n:"Vítkovice", lvl:8, pts:0}]
    };

    function save() { localStorage.setItem('fb_v7_5', JSON.stringify(db)); }

    function updateUI() {
        document.getElementById('ui-money').innerText = db.m.toLocaleString();
        document.getElementById('ui-count').innerText = db.p.length;
        // Výpočet průměrného LVL týmu
        let sum = 0, count = 0;
        for(let pos in db.lineup) {
            let h = db.p.find(x => x.id === db.lineup[pos]);
            if(h) { sum += h.lvl; count++; }
        }
        document.getElementById('ui-lvl').innerText = count === 5 ? Math.round(sum/5) : 0;
    }

    function renderSleep() {
        const div = document.getElementById('hraci-list');
        div.innerHTML = "";
        const now = Date.now();

        db.p.forEach(h => {
            const isSleeping = h.sleepUntil && h.sleepUntil > now;
            const onCooldown = h.sleepCooldown && h.sleepCooldown > now;
            const color = h.e < 30 ? 'var(--danger)' : (h.e < 70 ? 'var(--warning)' : 'var(--success)');
            
            let btnText = "SPÁNEČEK";
            if(isSleeping) btnText = "SPÍ (cca " + Math.ceil((h.sleepUntil - now)/1000) + "s)";
            else if(onCooldown) btnText = "ODPOČÍVÁ (" + Math.ceil((h.sleepCooldown - now)/60000) + " min)";

            div.innerHTML += `
            <div class="card">
                <div style="display:flex; justify-content:space-between">
                    <b>${h.n}</b> <span>${h.pos}</span>
                </div>
                <div class="energy-bar">
                    <div class="energy-fill" style="width:${h.e}%; background-color:${color}"></div>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                    <small>Energie: ${h.e}%</small>
                    <button style="width:auto; padding:8px 15px; font-size:0.7rem;" 
                        onclick="startSleep(${h.id})" 
                        ${isSleeping || onCooldown ? 'disabled' : ''}>
                        ${btnText}
                    </button>
                </div>
            </div>`;
        });
    }

    function startSleep(id) {
        const h = db.p.find(x => x.id === id);
        const now = Date.now();
        h.sleepUntil = now + 60000; // 1 minuta spánku
        h.sleepCooldown = now + 600000; // 10 minut cooldown
        h.e = 100; // Okamžitě nastavíme 100, ale nemůže hrát, dokud sleepUntil neskončí
        save();
        renderSleep();
    }

    // Úprava funkce pro zápas - energie se ubírá jen hráčům v sestavě
    function finishMatch(sh, sa) {
        // ... logika výhry/prohry ...
        
        // Úbytek energie jen pro ty v LINEUP
        for(let pos in db.lineup) {
            let hId = db.lineup[pos];
            let h = db.p.find(x => x.id === hId);
            if(h) {
                h.e = Math.max(0, h.e - (Math.floor(Math.random()*10) + 1));
            }
        }
        save();
        updateUI();
    }

    function prepni(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('scr-' + id).classList.add('active');
        if(id === 'sleep') renderSleep();
        updateUI();
    }

    // Refreshování kabiny každou sekundu, aby běžel časovač
    setInterval(() => {
        if(document.getElementById('scr-sleep').classList.contains('active')) {
            renderSleep();
        }
    }, 1000);

    window.onload = () => { prepni('match'); updateUI(); };
</script>
</body>
</html>
