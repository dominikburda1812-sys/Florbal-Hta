<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager | High-Stakes Packs</title>
    <style>
        :root {
            --primary-gold: #fbbf24; --secondary-gold: #f59e0b; --text-main: #f8fafc;
            --glass: rgba(0, 0, 0, 0.7); --border: rgba(255, 255, 255, 0.1);
            --bg-reg: radial-gradient(circle at top, #1e293b, #000);
            --bg-sleep: radial-gradient(circle at top, #1e1b4b, #020617);
            --bg-match: radial-gradient(circle at top, #064e3b, #020617);
            --bg-shop: radial-gradient(circle at top, #451a03, #020617);
            --bg-profile: radial-gradient(circle at top, #0f172a, #000);
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-reg); background-attachment: fixed; color: var(--text-main); margin: 0; text-align: center; overflow: hidden; transition: background 0.5s ease; }
        .grid-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 30px 30px; z-index: -1; }
        
        .ui-bar { background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-around; font-weight: bold; font-size: 0.9em; }
        .screen { display: none; padding: 15px; height: 82vh; overflow-y: auto; padding-bottom: 100px; box-sizing: border-box; }
        .screen.active { display: block; animation: fadeIn 0.3s; }

        .card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 18px; padding: 15px; margin: 10px auto; width: 92%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        button { background: linear-gradient(135deg, var(--secondary-gold), var(--primary-gold)); border: none; padding: 12px; border-radius: 10px; font-weight: 800; color: #000; text-transform: uppercase; width: 100%; cursor: pointer; }

        /* Styly pro balíčky */
        .pack { border: 3px solid; padding: 25px; border-radius: 20px; margin: 15px 0; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative; overflow: hidden; }
        .pack:active { transform: scale(0.95); }
        .pack::after { content: "OPEN"; position: absolute; right: -20px; top: 10px; background: white; color: black; padding: 5px 30px; transform: rotate(45deg); font-size: 10px; font-weight: bold; }
        
        .pack-bronze { background: linear-gradient(145deg, #78350f, #451a03); border-color: #92400e; box-shadow: 0 0 15px rgba(146, 64, 14, 0.4); }
        .pack-silver { background: linear-gradient(145deg, #475569, #1e293b); border-color: #94a3b8; box-shadow: 0 0 15px rgba(148, 163, 184, 0.4); }
        .pack-gold { background: linear-gradient(145deg, #854d0e, #fbbf24); border-color: #fef08a; color: #000; box-shadow: 0 0 25px rgba(251, 191, 36, 0.5); }

        /* Animace otevírání */
        #pack-opener { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #1e293b 0%, #000 100%); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(20px); }
        .reveal-card { width: 220px; height: 320px; background: #fff; border: 8px solid var(--primary-gold); border-radius: 20px; color: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 50px var(--primary-gold); animation: flip 0.8s ease-out; }
        @keyframes flip { from { transform: rotateY(180deg) scale(0); opacity: 0; } to { transform: rotateY(0) scale(1); opacity: 1; } }

        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 70px; background: rgba(0,0,0,0.95); display: flex; border-top: 1px solid var(--border); z-index: 100; }
        .nav-item { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #4b5563; }
        .nav-item.selected { color: var(--primary-gold); }

        .inv-slot { aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; }
        .stack { position: absolute; bottom: 2px; right: 4px; font-size: 10px; color: var(--primary-gold); }
    </style>
</head>
<body id="main-body">
<div class="grid-overlay"></div>

<div id="top-ui" style="display:none" class="ui-bar">
    <span>💰 <span id="money">0</span></span>
    <span>📊 AVG: <span id="team-avg">0</span></span>
    <span>👥 <span id="player-count">0</span>/20</span>
</div>

<div id="scr-reg" class="screen active">
    <h1>FLORBAL MANAŽER</h1>
    <div class="card">
        <input type="text" id="mgr-name" style="width:85%; padding:12px; border-radius:10px; margin-bottom:15px; border:none;" placeholder="JMÉNO MANAŽERA">
        <button onclick="createTeam()">ZALOŽIT KLUB</button>
    </div>
</div>

<div id="scr-shop" class="screen">
    <h2>OBCHOD S BALÍČKY 📦</h2>
    <div class="card pack pack-bronze" onclick="buyPack('bronze')">
        <h3>BRONZOVÝ BALÍČEK</h3>
        <p>Hráči Lvl 1-6</p>
        <button disabled style="background:white; color:black; width:auto; padding:5px 15px;">1 000 🪙</button>
    </div>
    <div class="card pack pack-silver" onclick="buyPack('silver')">
        <h3>STŘÍBRNÝ BALÍČEK</h3>
        <p>Hráči Lvl 7-15</p>
        <button disabled style="background:white; color:black; width:auto; padding:5px 15px;">5 000 🪙</button>
    </div>
    <div class="card pack pack-gold" onclick="buyPack('gold')">
        <h3>ZLATÝ BALÍČEK</h3>
        <p>Hráči Lvl 16-35</p>
        <button disabled style="background:black; color:white; width:auto; padding:5px 15px;">10 000 🪙</button>
    </div>
</div>

<div id="scr-match" class="screen">
    <h2>LIGA 🏆</h2>
    <div class="card"><table style="width:100%;" id="league-table"><thead><tr><th>#</th><th>TÝM</th><th>LVL</th><th>PTS</th></tr></thead><tbody id="league-body"></tbody></table></div>
    <div class="card"><button onclick="runMatch()">HRÁT ZÁPAS</button><p id="match-timer-text"></p></div>
</div>

<div id="scr-sleep" class="screen">
    <h2>KABINA 🛌</h2>
    <div id="sleep-list"></div>
</div>

<div id="scr-profile" class="screen">
    <h2>PROFIL 👤</h2>
    <div class="card"><h3>🎒 BATOH</h3><div id="backpack" style="display:grid; grid-template-columns:repeat(5,1fr); gap:8px;"></div></div>
    <button style="background:#ef4444; color:white; margin-top:20px;" onclick="resetGame()">RESET HRY</button>
</div>

<div id="pack-opener" style="display:none;">
    <h2 id="pack-status-text" style="color:var(--primary-gold); letter-spacing:3px;">OTEVÍRÁM...</h2>
    <div id="reveal-area"></div>
    <button id="pack-close-btn" style="margin-top:30px; width:220px; display:none;" onclick="closePack()">PŘIDAT DO TÝMU</button>
</div>

<div id="nav" class="nav-bar" style="display:none">
    <div class="nav-item" id="n-sleep" onclick="nav('sleep')">🛌</div>
    <div class="nav-item selected" id="n-match" onclick="nav('match')">🥅</div>
    <div class="nav-item" id="n-shop" onclick="nav('shop')">📦</div>
    <div class="nav-item" id="n-profile" onclick="nav('profile')">👤</div>
</div>

<script>
    let db = {
        name: "", money: 2000, lastMatch: 0, players: [], inventory: [],
        league: [
            { name: "FK Kuličky", strength: 3, pts: 0 }, { name: "SK Beton", strength: 12, pts: 0 },
            { name: "HC Prach", strength: 20, pts: 0 }, { name: "Lvi z Lhoty", strength: 30, pts: 0 },
            { name: "Můj Tým", strength: 0, pts: 0, isPlayer: true }
        ]
    };

    function save() { localStorage.setItem('fb_mgr_luxury_v7', JSON.stringify(db)); }

    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('selected'));
        document.getElementById('scr-'+id).classList.add('active');
        document.getElementById('n-'+id).classList.add('selected');
        document.getElementById('main-body').style.background = `var(--bg-${id})`;
        updateUI();
        if(id==='sleep') renderSleep(); if(id==='match') renderLeague(); if(id==='profile') renderBackpack();
    }

    function createTeam() {
        db.name = document.getElementById('mgr-name').value || "Manažer";
        for(let i=0; i<6; i++) db.players.push({ name: "Hráč "+(i+1), stat: 1, energy: 100, lastSleep: 0, id: Date.now()+i });
        db.league.find(t => t.isPlayer).name = db.name;
        document.getElementById('scr-reg').classList.remove('active');
        document.getElementById('top-ui').style.display = 'flex';
        document.getElementById('nav').style.display = 'flex';
        save(); startTimers(); nav('match');
    }

    function buyPack(type) {
        let prices = { bronze: 1000, silver: 5000, gold: 10000 };
        if(db.money < prices[type]) return alert("Na tohle nemáš, manažere! Vyhraj nějaké zápasy.");
        
        db.money -= prices[type];
        updateUI();

        document.getElementById('pack-opener').style.display = 'flex';
        document.getElementById('pack-close-btn').style.display = 'none';
        document.getElementById('pack-status-text').innerText = "OTEVÍRÁM...";
        document.getElementById('reveal-area').innerHTML = "";

        setTimeout(() => {
            let lvl = 1;
            if(type === 'bronze') lvl = Math.floor(Math.random()*6)+1;
            if(type === 'silver') lvl = Math.floor(Math.random()*9)+7;
            if(type === 'gold') lvl = Math.floor(Math.random()*20)+16;

            let surnames = ["Krejčí", "Dvořák", "Souček", "Pastrňák", "Voráček", "Hertl", "Jágr", "Hašek"];
            let pName = surnames[Math.floor(Math.random()*surnames.length)];
            
            document.getElementById('pack-status-text').innerText = "ZÍSKÁNO!";
            document.getElementById('reveal-area').innerHTML = `
                <div class="reveal-card">
                    <h2 style="margin:0; color:#444; font-size:1.2em;">ELITE PLAYER</h2>
                    <h1 style="font-size:5em; margin:10px 0;">${lvl}</h1>
                    <h2 style="margin:0; letter-spacing:2px;">${pName.toUpperCase()}</h2>
                </div>
            `;
            document.getElementById('pack-close-btn').style.display = 'block';
            window.lastPulled = { name: pName, stat: lvl, energy: 100, lastSleep: 0, id: Date.now() };
        }, 1500);
    }

    function closePack() {
        if(db.players.length < 20) db.players.push(window.lastPulled);
        document.getElementById('pack-opener').style.display = 'none';
        save(); updateUI();
    }

    function updateUI() {
        document.getElementById('money').innerText = db.money.toLocaleString();
        let avg = Math.round(db.players.reduce((a, b) => a + b.stat, 0) / db.players.length) || 1;
        document.getElementById('team-avg').innerText = avg;
        document.getElementById('player-count').innerText = db.players.length;
        db.league.find(t=>t.isPlayer).strength = avg;
    }

    function renderLeague() {
        const b = document.getElementById('league-body'); b.innerHTML = "";
        db.league.sort((x,y)=>y.pts-x.pts).forEach((t, i) => {
            b.innerHTML += `<tr><td>${i+1}.</td><td>${t.name}</td><td>Lvl ${t.strength || 1}</td><td>${t.pts}b</td></tr>`;
        });
    }

    function runMatch() {
        let now = Date.now();
        if(now - db.lastMatch < 60000) return alert("Hala se uklízí!");
        db.lastMatch = now;
        let win = Math.random() > 0.5;
        if(win) { db.money += 800; db.league.find(t=>t.isPlayer).pts += 3; alert("Výhra! +800 🪙"); }
        else { db.money += 150; alert("Prohra, ale dostal jsi aspoň 150 🪙 z lístků."); }
        save(); nav('match');
    }

    function renderSleep() {
        const c = document.getElementById('sleep-list'); c.innerHTML = "";
        db.players.forEach(p => {
            c.innerHTML += `<div class="card"><b>${p.name}</b> (Lvl ${p.stat}) | ${p.energy}% <button onclick="db.players.find(x=>x.id===${p.id}).energy=100; save(); renderSleep();">DOPLNIT</button></div>`;
        });
    }

    function renderBackpack() {
        const g = document.getElementById('backpack'); g.innerHTML = "";
        for(let i=0; i<20; i++) { g.innerHTML += `<div class="inv-slot"></div>`; }
    }

    function startTimers() { setInterval(() => { let wait = Math.ceil((60000-(Date.now()-db.lastMatch))/1000); document.getElementById('match-timer-text').innerText = wait>0 ? "Další zápas za: "+wait+"s" : "Můžeš hrát!"; }, 1000); }
    function resetGame() { localStorage.clear(); location.reload(); }

    window.onload = () => {
        let s = localStorage.getItem('fb_mgr_luxury_v7');
        if(s) { db = JSON.parse(s); document.getElementById('scr-reg').classList.remove('active'); document.getElementById('top-ui').style.display='flex'; document.getElementById('nav').style.display='flex'; startTimers(); nav('match'); }
    };
</script>
</body>
</html>
