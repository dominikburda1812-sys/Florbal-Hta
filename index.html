<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager v10 PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #030712; --surface: rgba(17, 24, 39, 0.8); --surface-border: rgba(255, 255, 255, 0.08);
            --accent: #00ff88; --text: #f8fafc; --text-muted: #94a3b8;
            --blue: #3b82f6; --red: #ef4444; --gold: #fbbf24; --gold-glow: rgba(251, 191, 36, 0.4);
            --field: linear-gradient(180deg, #064e3b 0%, #022c22 100%);
            --r-basic: #94a3b8; --r-medium: #22c55e; --r-rare: #3b82f6; --r-epic: #a855f7;
        }
        
        body { 
            font-family: 'Montserrat', sans-serif; color: var(--text); margin: 0; 
            background-color: var(--bg); 
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 255, 136, 0.05) 0%, transparent 80%);
            overflow-x: hidden; user-select: none; background-attachment: fixed; 
        }

        h3 { color: var(--text); text-transform: uppercase; letter-spacing: 2px; font-size: 1rem; border-left: 4px solid var(--accent); padding-left: 12px; margin-bottom: 20px; font-family: 'Orbitron', sans-serif; }
        
        .card { 
            background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--surface-border); 
            border-radius: 20px; padding: 20px; margin-bottom: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        }

        button { 
            background: var(--accent); color: #000; border: none; padding: 16px; border-radius: 14px; 
            font-weight: 900; width: 100%; cursor: pointer; text-transform: uppercase; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); letter-spacing: 1px; 
            box-shadow: 0 4px 20px rgba(0,255,136,0.2); 
            font-family: 'Orbitron', sans-serif; font-size: 0.85rem;
        }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,255,136,0.4); }
        button:active { transform: scale(0.96); }
        button:disabled { background: #1e293b !important; color: #475569 !important; pointer-events: none; box-shadow: none !important; opacity: 0.6; }

        .btn-red { background: linear-gradient(135deg, #ef4444, #991b1b); color: white; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        .btn-blue { background: linear-gradient(135deg, #3b82f6, #1e3a8a); color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }

        #top-ui { display: none; background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(20px); padding: 18px 25px; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--surface-border); position: sticky; top: 0; z-index: 1000; }
        .stat-badge { background: rgba(255,255,255,0.03); padding: 10px 16px; border-radius: 14px; font-weight: 800; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; border: 1px solid var(--surface-border); }
        .coin-badge { color: var(--gold); border-color: rgba(251, 191, 36, 0.2); }

        .screen { display: none; padding: 20px; padding-bottom: 120px; min-height: 100vh; animation: slideUp 0.4s ease-out; }
        .active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* DESIGN PRO TR-OVERLAY */
        #tr-overlay { position: fixed; inset: 0; background: #020617; z-index: 5500; display: none; flex-direction: column; padding: 30px 20px; }
        .tr-track-container { width: 100%; overflow-x: auto; padding: 40px 0; position: relative; }
        .tr-line { position: absolute; top: 50%; left: 0; height: 6px; background: #1e293b; width: 1500px; transform: translateY(-50%); border-radius: 10px; }
        .tr-line-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--accent); box-shadow: 0 0 15px var(--accent); transition: width 0.8s ease; }

        /* MATCH DESIGN */
        #match-area { width: 100%; height: 260px; border-radius: 24px; position: relative; overflow: hidden; display: none; background: var(--field); border: 2px solid rgba(255,255,255,0.05); margin-bottom: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .player-dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; z-index: 5; box-shadow: 0 0 10px rgba(0,0,0,0.5); transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1); }

        .bag-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 15px; }
        .bag-slot { aspect-ratio: 1; background: rgba(255,255,255,0.02); border: 1px solid var(--surface-border); border-radius: 16px; display: flex; flex-direction:column; align-items: center; justify-content: center; position: relative; font-size: 1.8rem; transition: 0.2s; }
        .bag-slot:active { transform: scale(0.9); background: rgba(255,255,255,0.05); }

        #bot-nav { display: none; position: fixed; bottom: 0; width: 100%; height: 80px; background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(25px); border-top: 1px solid var(--surface-border); z-index: 1000; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: 0.4; cursor: pointer; transition: 0.3s; color: var(--text); }
        .nav-item.active { opacity: 1; color: var(--accent); transform: translateY(-5px); }
        .nav-icon { width: 26px; height: 26px; fill: currentColor; }
        .nav-text { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        #custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(10px); padding: 25px; }
        .modal-box { background: #0f172a; border: 1px solid var(--surface-border); border-radius: 28px; padding: 35px; text-align: center; width: 100%; max-width: 340px; }
    </style>
</head>
<body>

    <div id="custom-modal">
        <div class="modal-box" id="cm-box">
            <div class="modal-title" id="cm-title" style="font-family:'Orbitron'; font-weight:900; margin-bottom:15px;">OZNÁMENÍ</div>
            <div class="modal-text" id="cm-text" style="margin-bottom:25px; line-height:1.6;">Text</div>
            <button onclick="closeModal()" id="cm-btn">ROZUMÍM</button>
        </div>
    </div>

    <div id="top-ui">
        <div style="display:flex; gap:12px;">
            <div class="stat-badge coin-badge">
                <span id="ui-money">0</span> 🪙
            </div>
            <div class="stat-badge" style="color:#f97316;">
                <span id="ui-trophies">0</span> 🏆
            </div>
        </div>
        <div class="stat-badge" style="color:var(--accent);">SÍLA <span id="ui-lvl" style="margin-left:5px;">0</span></div>
    </div>

    <div id="scr-match" class="screen">
        <div class="card" onclick="openTrophyRoad()" style="background: linear-gradient(90deg, #f97316, #fbbf24); color:#000; cursor:pointer; font-weight:900; text-align:center; font-family:'Orbitron';">CESTA SLÁVY (TROPHY ROAD)</div>
        
        <h3>Zápasové centrum</h3>
        <div id="match-area">
            <div id="m-ball" style="position:absolute; width:8px; height:8px; background:#fff; border-radius:50%; z-index:10; box-shadow:0 0 10px #fff;"></div>
            <div id="players-layer"></div>
            <div style="position:absolute; top:10px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); padding:5px 15px; border-radius:10px; font-family:'Orbitron'; font-size:1.2rem;">
                <span id="score-h">0</span> : <span id="score-a">0</span>
            </div>
        </div>
        
        <button id="btn-play" onclick="initMatch()">ZAHÁJIT ZÁPAS</button>
        <div id="match-cooldown-ui" style="display:none; text-align:center; margin-top:20px;">
            <div style="color:var(--text-muted); font-size:0.7rem; text-transform:uppercase;">Regenerace týmu</div>
            <div id="cd-timer" style="font-family:'Orbitron'; font-size:2rem; color:var(--accent);">30s</div>
        </div>

        <div class="card" style="margin-top:30px; padding:0; overflow:hidden;">
            <div style="padding:15px; background:rgba(255,255,255,0.05); font-weight:900;">LIGOVÁ TABULKA</div>
            <div id="liga-tabulka" style="padding:10px;"></div>
        </div>
    </div>

    <div id="scr-sleep" class="screen">
        <h3>Kabina a práce</h3>
        <div id="hraci-list"></div>
    </div>

    <div id="scr-profile" class="screen">
        <h3>Taktická sestava</h3>
        <div id="tactical-field-ui" class="card" style="height:250px; background:rgba(255,255,255,0.02); position:relative; border-radius:20px;">
             <p style="text-align:center; padding-top:100px; color:var(--text-muted);">Klikni na pozici a vyber hráče</p>
        </div>
        <div id="select-box"></div>
        <h3>Inventář</h3>
        <div class="bag-grid" id="bag-ui"></div>
    </div>

    <div id="scr-shop" class="screen">
        <h3>Obchod</h3>
        <div class="card" style="border-color:var(--accent);">
            <p><b>Balíček vybavení</b><br><small>Obsahuje florbalku s náhodným levelem.</small></p>
            <button onclick="buyStickPack()">KOUPIT (3 000 🪙)</button>
        </div>
    </div>

    <div id="setup-overlay" style="display:none; position:fixed; inset:0; background:var(--bg); z-index:8000; flex-direction:column; align-items:center; justify-content:center; padding:30px;">
        <h1 style="font-family:'Orbitron'; color:var(--accent);">PRO MANAGER</h1>
        <input type="text" id="team-input" placeholder="NÁZEV KLUBU" style="background:#1e293b; border:none; color:white; padding:20px; border-radius:15px; width:100%; max-width:300px; margin:30px 0; text-align:center;">
        <button onclick="confirmTeamName()">ZALOŽIT KLUB</button>
    </div>

    <div id="bot-nav">
        <div class="nav-item" onclick="prepni('sleep')"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span class="nav-text">Hráči</span></div>
        <div class="nav-item active" onclick="prepni('match')"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg><span class="nav-text">Zápas</span></div>
        <div class="nav-item" onclick="prepni('profile')"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span class="nav-text">Tým</span></div>
        <div class="nav-item" onclick="prepni('shop')"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg><span class="nav-text">Obchod</span></div>
    </div>

<script>
    // INICIALIZACE S 10 000 KČ
    let db = JSON.parse(localStorage.getItem('fb_v10')) || {
        m: 10000, trophies: 0, p: [], lineup: {GK:null,LD:null,RD:null,LW:null,C:null,RW:null},
        b: [], sticks: [], lastMatchEnd: 0, teamName: ""
    };

    function save() { localStorage.setItem('fb_v10', JSON.stringify(db)); }

    function showModal(title, text) {
        document.getElementById('cm-title').innerText = title;
        document.getElementById('cm-text').innerText = text;
        document.getElementById('custom-modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('custom-modal').style.display = 'none'; }

    function confirmTeamName() {
        let n = document.getElementById('team-input').value.trim();
        if(n.length < 3) return alert("Krátký název!");
        db.teamName = n;
        // Vytvoření startovních hráčů
        const pos = ["GK","LD","RD","LW","C","RW"];
        pos.forEach((p, i) => {
            db.p.push({id: Date.now()+i, n: "Hráč "+(i+1), lvl: 1, pos: p, e: 100, sleepUntil: 0});
            db.lineup[p] = db.p[i].id;
        });
        save(); window.location.reload();
    }

    // --- OPRAVA: PROBUZENÍ TÝMU PŘED ZÁPASEM ---
    function wakeUpTeam() {
        let now = Date.now();
        let wokeUp = false;
        for(let pos in db.lineup) {
            let h = db.p.find(x => x.id === db.lineup[pos]);
            if(h && h.sleepUntil > now) {
                h.sleepUntil = 0; // Okamžitě probudit
                h.e = 100;       // Doplnit energii
                wokeUp = true;
            }
        }
        if(wokeUp) {
            console.log("Tým byl probuzen pro zápas!");
        }
    }

    function initMatch() {
        wakeUpTeam(); // Zavoláme probuzení
        
        // Zbytek tvé logiky zápasu...
        document.getElementById('match-area').style.display = 'block';
        document.getElementById('btn-play').style.display = 'none';
        
        let sh = 0, sa = 0;
        let timer = 5; // zkráceno pro ukázku
        let int = setInterval(() => {
            timer--;
            if(Math.random() > 0.5) sh++; else sa++;
            document.getElementById('score-h').innerText = sh;
            document.getElementById('score-a').innerText = sa;
            if(timer <= 0) {
                clearInterval(int);
                finishMatch(sh, sa);
            }
        }, 1000);
    }

    function finishMatch(sh, sa) {
        db.lastMatchEnd = Date.now();
        if(sh > sa) { db.m += 500; db.trophies += 20; showModal("VÝHRA!", "Tým vyhrál! Získal jsi 500 🪙 a 20 🏆"); }
        else { showModal("PROHRA", "Příště to vyjde."); }
        save();
        updateUI();
        document.getElementById('match-area').style.display = 'none';
    }

    function buyStickPack() {
        if(db.m < 3000) return showModal("Chyba", "Nemáš dost peněz!");
        db.m -= 3000;
        let novyLevel = Math.floor(Math.random() * 5) + 1;
        // Žádná divná florbalka - vytváříme jasný objekt s levelem
        db.sticks.push({ id: Date.now(), nazev: "FREEZ Stick", lvl: novyLevel });
        save();
        updateUI();
        showModal("Nový kousek!", "V batohu máš novou florbalku level " + novyLevel);
    }

    function prepni(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('scr-' + id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        updateUI();
    }

    function updateUI() {
        document.getElementById('ui-money').innerText = db.m.toLocaleString();
        document.getElementById('ui-trophies').innerText = db.trophies;
        // Vykreslení batohu
        let bagUI = document.getElementById('bag-ui');
        if(bagUI) {
            bagUI.innerHTML = "";
            db.sticks.forEach(s => {
                bagUI.innerHTML += `<div class="bag-slot">🏒<div style="font-size:0.6rem; font-weight:900;">LVL ${s.lvl}</div></div>`;
            });
        }
    }

    window.onload = () => {
        if(!db.teamName) document.getElementById('setup-overlay').style.display = 'flex';
        else { 
            document.getElementById('top-ui').style.display = 'flex'; 
            document.getElementById('bot-nav').style.display = 'flex'; 
            prepni('match'); 
        }
    }
</script>
</body>
</html>
