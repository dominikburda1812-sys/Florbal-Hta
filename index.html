<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Elite Manager</title>
    <style>
        :root {
            --accent: #fbbf24;
            --bg: #05070a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass: rgba(15, 20, 30, 0.95);
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: #fff;
            margin: 0;
            overflow: hidden;
        }

        /* --- TOP UI --- */
        .top-nav {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            padding: 15px 5px;
            font-weight: bold;
            z-index: 1000;
            position: relative;
        }
        .stat-val { color: var(--accent); display: block; font-size: 1.1rem; }

        /* --- SCREENS --- */
        .screen { display: none; height: 100vh; padding: 20px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .active { display: block; }

        .header { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; margin-bottom: 20px; border-left: 4px solid var(--accent); padding-left: 15px; }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 12px;
        }

        button {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #000; border: none; padding: 14px; border-radius: 12px;
            font-weight: 800; width: 100%; cursor: pointer; text-transform: uppercase;
        }
        button:disabled { background: #222; color: #555; }

        /* --- MINI MATCH ANIMACE --- */
        .match-box {
            width: 100%; height: 160px; background: #022c22;
            border-radius: 12px; border: 2px solid #059669;
            position: relative; margin-bottom: 15px; display: none;
            overflow: hidden;
        }

        /* --- NAVIGACE --- */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 75px;
            background: var(--glass); border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-around; align-items: center;
        }
        .nav-item { font-size: 1.6rem; opacity: 0.4; transition: 0.2s; cursor: pointer; }
        .nav-item.active { opacity: 1; color: var(--accent); transform: translateY(-3px); }

        /* --- PACK OPENER --- */
        #pack-screen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background:#000; z-index:9999; display:none;
            flex-direction:column; align-items:center; justify-content:center;
        }
        .reveal-card {
            width: 220px; height: 300px; background: #fff; border: 8px solid var(--accent);
            border-radius: 20px; color: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; font-weight: 900;
        }

        input { width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="top-ui" class="top-nav" style="display:none">
        <div align="center">PENÍZE <span class="stat-val" id="m-money">0</span></div>
        <div align="center">AVG <span class="stat-val" id="m-avg">0</span></div>
        <div align="center">HRÁČI <span class="stat-val" id="m-count">0</span></div>
    </div>

    <div id="scr-reg" class="screen active">
        <div class="header">Registrace Klubu</div>
        <div class="card">
            <input type="text" id="reg-team" placeholder="Název týmu">
            <p style="font-size:0.8rem; color:gray;">Jména tvých 6 hvězd:</p>
            <div id="reg-players">
                <input type="text" class="p-name" value="Hráč 1">
                <input type="text" class="p-name" value="Hráč 2">
                <input type="text" class="p-name" value="Hráč 3">
                <input type="text" class="p-name" value="Hráč 4">
                <input type="text" class="p-name" value="Hráč 5">
                <input type="text" class="p-name" value="Hráč 6">
            </div>
            <button onclick="firstStart()">Založit tým</button>
        </div>
    </div>

    <div id="scr-match" class="screen">
        <div class="header">Zápasy</div>
        <div id="match-anim" class="match-box">
            <canvas id="match-canvas"></canvas>
            <div style="position:absolute; top:5px; width:100%; text-align:center; font-weight:bold;">
                <span id="score-h">0</span> : <span id="score-a">0</span>
            </div>
        </div>
        <div class="card">
            <div id="match-status" style="margin-bottom:10px; font-weight:bold;">PŘIPRAVEN</div>
            <button id="btn-match" onclick="playMatch()">Hrát zápas (30s)</button>
        </div>
        <div class="card">
            <table style="width:100%; font-size:0.9rem;">
                <thead><tr style="color:var(--accent); text-align:left;"><th>Tým</th><th>AVG</th><th>Body</th></tr></thead>
                <tbody id="league-table"></tbody>
            </table>
        </div>
    </div>

    <div id="scr-sleep" class="screen">
        <div class="header">Kabina</div>
        <div id="sleep-container"></div>
    </div>

    <div id="scr-shop" class="screen">
        <div class="header">Obchod</div>
        <div class="card" onclick="buyPack('bronze')"><h3>BRONZ</h3><p>Lvl 1-9 | 5 000 🪙</p></div>
        <div class="card" onclick="buyPack('silver')"><h3>STŘÍBRO</h3><p>Lvl 10-19 | 10 000 🪙</p></div>
        <div class="card" onclick="buyPack('gold')"><h3>GOLD</h3><p>Lvl 20-29 | 15 000 🪙</p></div>
    </div>

    <div id="scr-bag" class="screen">
        <div class="header">Inventář</div>
        <div id="bag-grid" style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px;"></div>
    </div>

    <div id="bot-nav" class="bottom-nav" style="display:none">
        <div class="nav-item" onclick="changeScr('sleep')">🛌</div>
        <div class="nav-item active" onclick="changeScr('match')">🥅</div>
        <div class="nav-item" onclick="changeScr('shop')">📦</div>
        <div class="nav-item" onclick="changeScr('bag')">🎒</div>
    </div>

    <div id="pack-screen">
        <div id="pack-letter" style="font-size:5rem; color:var(--accent); font-weight:bold;">?</div>
        <div id="pack-result"></div>
        <button id="btn-pack-done" style="display:none; width:200px; margin-top:20px;" onclick="closePack()">PŘIJMOUT</button>
    </div>

<script>
    let game = {
        money: 10000, players: [], inventory: [], matches: 0,
        league: [{n:"Eagles", a:5, p:0}, {n:"Bulldogs", a:15, p:0}, {n:"Titans", a:25, p:0}]
    };

    function changeScr(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('scr-' + id).classList.add('active');
        const items = document.querySelectorAll('.nav-item');
        if(id=='sleep') { items[0].classList.add('active'); renderSleep(); }
        if(id=='match') { items[1].classList.add('active'); renderLeague(); }
        if(id=='shop') { items[2].classList.add('active'); }
        if(id=='bag') { items[3].classList.add('active'); renderBag(); }
        updateUI();
    }

    function firstStart() {
        game.teamName = document.getElementById('reg-team').value || "Můj Tým";
        document.querySelectorAll('.p-name').forEach((inp, i) => {
            game.players.push({name: inp.value, stat: 1, energy: 100, id: Date.now()+i, sleepUntil: 0, cooldownUntil: 0});
        });
        game.league.push({n: game.teamName, a: 1, p: 0, isPlayer: true});
        document.getElementById('scr-reg').classList.remove('active');
        document.getElementById('bot-nav').style.display = 'flex';
        document.getElementById('top-ui').style.display = 'flex';
        save(); changeScr('match');
    }

    function updateUI() {
        document.getElementById('m-money').innerText = game.money.toLocaleString();
        let avg = game.players.length ? Math.round(game.players.reduce((a,b)=>a+b.stat,0)/game.players.length) : 0;
        document.getElementById('m-avg').innerText = avg;
        document.getElementById('m-count').innerText = game.players.length;
        
        let pT = game.league.find(t=>t.isPlayer); if(pT) pT.a = avg;
        let ready = game.players.filter(p => p.sleepUntil < Date.now()).length;
        document.getElementById('btn-match').disabled = ready < 6;
        document.getElementById('match-status').innerText = ready < 6 ? `UNAVENI (${ready}/6)` : "PŘIPRAVEN";
    }

    function playMatch() {
        let opp = game.league.filter(t=>!t.isPlayer)[Math.floor(Math.random()*3)];
        if(game.players.length < 10) opp.a = Math.min(opp.a, 8); // Scalování na začátku

        document.getElementById('match-anim').style.display = 'block';
        let time = 30; let sh=0, sa=0;
        let interval = setInterval(() => {
            time--;
            if(Math.random()<0.1) { if(Math.random()>0.5) sh++; else sa++; }
            document.getElementById('score-h').innerText = sh;
            document.getElementById('score-a').innerText = sa;
            if(time <= 0) { clearInterval(interval); endMatch(sh, sa, opp); }
        }, 1000);
    }

    function endMatch(sh, sa, opp) {
        document.getElementById('match-anim').style.display = 'none';
        let myAvg = Math.round(game.players.reduce((a,b)=>a+b.stat,0)/game.players.length);
        let diff = myAvg - opp.a;
        let prob = 67; // default pro stejné AVG
        if(diff <= -8) prob = 1; else if(diff === -7) prob = 5; else if(diff === -1) prob = 50; else if(diff >= 2) prob = 99;
        
        let win = (game.matches === 0) ? true : (Math.random()*100 < prob);
        let reward = win ? 750 : 0;
        let bonus = Math.random() < 0.1 ? 1000 : 0;
        
        game.money += (reward + bonus);
        if(win) game.league.find(t=>t.isPlayer).p += 3;
        game.matches++;
        
        game.players.filter(p => p.sleepUntil < Date.now()).forEach(p => {
            p.energy = Math.max(0, p.energy - Math.floor(Math.random()*15 + 5));
        });

        alert(win ? `VÝHRA! +${reward} 🪙` : "PROHRA!");
        save(); changeScr('match');
    }

    function renderSleep() {
        const cont = document.getElementById('sleep-container');
        cont.innerHTML = "";
        game.players.forEach(p => {
            let s = p.sleepUntil > Date.now();
            let c = p.cooldownUntil > Date.now();
            let sRem = Math.ceil((p.sleepUntil - Date.now())/1000);
            let cRem = Math.ceil((p.cooldownUntil - Date.now())/1000);

            cont.innerHTML += `<div class="card">
                <b>${p.name}</b> (Lvl ${p.stat}) | E: ${p.energy}%<br>
                ${s ? `<button disabled>SPÍ (${sRem}s)</button>` : 
                 (c ? `<button disabled>REGENERACE (${Math.floor(cRem/60)}m)</button>` : 
                 `<button onclick="doSleep(${p.id})">SPÁNEČEK</button>`)}
            </div>`;
        });
    }

    function doSleep(id) {
        let p = game.players.find(x=>x.id==id);
        p.sleepUntil = Date.now() + 60000;
        p.cooldownUntil = Date.now() + 600000;
        p.energy = 100;
        save(); renderSleep();
    }

    function buyPack(type) {
        let cost = {bronze:5000, silver:10000, gold:15000}[type];
        if(game.money < cost) return alert("Málo peněz!");
        game.money -= cost;
        
        document.getElementById('pack-screen').style.display = 'flex';
        document.getElementById('btn-pack-done').style.display = 'none';
        let range = type=='bronze'?[1,9]:type=='silver'?[10,19]:[20,29];
        let lvl = Math.floor(Math.random()*(range[1]-range[0]+1))+range[0];
        window.tempP = {name: "Hráč "+(game.players.length+1), stat: lvl, energy:100, id:Date.now(), sleepUntil:0, cooldownUntil:0};
        window.tempD = Math.floor(Math.random()*6);

        setTimeout(()=> { document.getElementById('pack-letter').innerText = window.tempP.name[0]; }, 1000);
        setTimeout(()=> {
            document.getElementById('pack-letter').innerText = "";
            document.getElementById('pack-result').innerHTML = `<div class="reveal-card"><h1>${lvl}</h1><p>${window.tempP.name}</p><p>+${window.tempD}x 🥤</p></div>`;
            document.getElementById('btn-pack-done').style.display = 'block';
        }, 2000);
    }

    function closePack() {
        game.players.push(window.tempP);
        if(window.tempD > 0) {
            let s = game.inventory.find(i=>i.count<10);
            if(s) s.count = Math.min(10, s.count+window.tempD); else game.inventory.push({count: window.tempD});
        }
        document.getElementById('pack-screen').style.display = 'none';
        save(); updateUI();
    }

    function renderBag() {
        const g = document.getElementById('bag-grid'); g.innerHTML = "";
        game.inventory.forEach((item, i) => {
            g.innerHTML += `<div class="card" onclick="useDr(${i})" style="text-align:center;">🥤<br>x${item.count}</div>`;
        });
    }

    function useDr(idx) {
        let n = prompt("Komu dát drink?");
        let p = game.players.find(x=>x.name.toLowerCase() == n.toLowerCase());
        if(p) { p.energy=100; p.sleepUntil=0; game.inventory[idx].count--; if(game.inventory[idx].count==0) game.inventory.splice(idx,1); save(); renderBag(); }
    }

    function renderLeague() {
        const b = document.getElementById('league-table'); b.innerHTML = "";
        game.league.sort((a,b)=>b.p - a.p).forEach(t => {
            b.innerHTML += `<tr style="${t.isPlayer?'color:var(--accent)':''}"><td>${t.n}</td><td>${t.a}</td><td>${t.p}</td></tr>`;
        });
    }

    function save() { localStorage.setItem('fb_final_v2', JSON.stringify(game)); }

    window.onload = () => {
        let saved = localStorage.getItem('fb_final_v2');
        if(saved) {
            game = JSON.parse(saved);
            if(game.teamName) {
                document.getElementById('scr-reg').classList.remove('active');
                document.getElementById('bot-nav').style.display = 'flex';
                document.getElementById('top-ui').style.display = 'flex';
                changeScr('match');
            }
        }
        setInterval(() => { if(document.getElementById('scr-sleep').classList.contains('active')) renderSleep(); }, 1000);
    };
</script>
</body>
</html>
