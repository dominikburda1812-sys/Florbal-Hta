<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florbalový Manažer</title>
    <style>
        /* FLORBALOVÝ STYL A GRAFIKA */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a3c34; /* Tmavě zelená jako florbalový povrch */
            background-image: radial-gradient(#2c5e50 1px, transparent 1px);
            background-size: 20px 20px;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            font-size: 3em;
            margin-bottom: 10px;
        }

        .stats-bar {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            border: 2px solid #00ffcc;
            font-size: 1.2em;
        }

        .stats-bar span {
            margin: 0 15px;
            font-weight: bold;
            color: #ffd700; /* Zlatá pro peníze a pohárky */
        }

        .menu-buttons button {
            background: linear-gradient(45deg, #00997a, #00ccaa);
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            font-size: 1.2em;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .menu-buttons button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #00ffcc;
        }

        .section {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 800px;
            display: none; /* Skryto v základu */
            border-left: 5px solid #00ffcc;
        }

        .player-card {
            background: #234c40;
            border: 1px solid #00ffcc;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-card button {
            padding: 8px 15px;
            margin-left: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-sell { background: #ff4d4d; color: white; }
        .btn-work { background: #ffa500; color: black; }
        .btn-lineup { background: #3399ff; color: white; }

        /* VYSKAKOVACÍ OKNA (MODAL) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: linear-gradient(135deg, #111, #2a2a2a);
            padding: 40px;
            border-radius: 15px;
            border: 4px solid #00ffcc;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            text-align: center;
            max-width: 400px;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 { color: #00ffcc; margin-top: 0; }
        .modal-content button {
            background: #00ffcc;
            color: black;
            border: none;
            padding: 10px 20px;
            margin-top: 20px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>FLORBAL MANAŽER</h1>

    <div class="stats-bar">
        Peníze: <span id="money-display">0</span> Kč | 
        Pohárky: <span id="trophies-display">0</span> 🏆
    </div>

    <div class="menu-buttons">
        <button onclick="playMatch()">Hrát zápas</button>
        <button onclick="showSection('team-section')">Můj Tým</button>
        <button onclick="openTrophyRoad()">Trophy Road</button>
    </div>

    <div id="team-section" class="section">
        <h2>Správa týmu</h2>
        <p>Hráči v práci vydělávají každých 5 sekund (Level × 1 Kč). Pokud je hráč v základní sestavě a zároveň v práci, nemůžeš hrát zápas!</p>
        <div id="players-list"></div>
    </div>

    <div id="custom-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Titulek</h2>
            <p id="modal-text">Text okna</p>
            <button onclick="closeModal()">Rozumím</button>
        </div>
    </div>

    <script>
        // Herní data
        let money = 0;
        let trophies = 0;
        
        // Ukázkoví hráči
        let players = [
            { id: 1, name: "Jan Novák", level: 1, inLineup: true, isWorking: false },
            { id: 2, name: "Petr Svoboda", level: 2, inLineup: true, isWorking: false },
            { id: 3, name: "Tomáš Dvořák (Náhradník)", level: 3, inLineup: false, isWorking: false }
        ];

        function updateUI() {
            document.getElementById('money-display').innerText = money;
            document.getElementById('trophies-display').innerText = trophies;
            renderPlayers();
        }

        function showSection(sectionId) {
            document.getElementById('team-section').style.display = 'none';
            document.getElementById(sectionId).style.display = 'block';
            updateUI();
        }

        function renderPlayers() {
            const list = document.getElementById('players-list');
            list.innerHTML = '';
            
            players.forEach(p => {
                const sellPrice = p.level * 300;
                const workEarnings = p.level * 1;
                
                const card = document.createElement('div');
                card.className = 'player-card';
                card.innerHTML = `
                    <div>
                        <strong>${p.name}</strong> (Level ${p.level})<br>
                        <small>
                            Sestava: ${p.inLineup ? '✅ Základ' : '❌ Náhradník'} | 
                            Práce: ${p.isWorking ? '✅ Pracuje (+' + workEarnings + ' Kč/5s)' : '❌ Volno'}
                        </small>
                    </div>
                    <div>
                        <button class="btn-lineup" onclick="toggleLineup(${p.id})">Sestava</button>
                        <button class="btn-work" onclick="toggleWork(${p.id})">Práce</button>
                        <button class="btn-sell" onclick="sellPlayer(${p.id}, ${sellPrice})">Prodat za ${sellPrice} Kč</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        // Akce hráčů
        function toggleLineup(id) {
            const player = players.find(p => p.id === id);
            player.inLineup = !player.inLineup;
            updateUI();
        }

        function toggleWork(id) {
            const player = players.find(p => p.id === id);
            player.isWorking = !player.isWorking;
            updateUI();
        }

        function sellPlayer(id, price) {
            if(confirm(`Opravdu chceš prodat tohoto hráče za ${price} Kč?`)) {
                money += price;
                players = players.filter(p => p.id !== id);
                updateUI();
                openModal("Obchod úspěšný", `Hráč byl prodán. Získáváš ${price} Kč!`);
            }
        }

        // Zápas
        function playMatch() {
            // Kontrola: Je někdo ze základní sestavy v práci?
            const workingStarters = players.filter(p => p.inLineup && p.isWorking);
            
            if(workingStarters.length > 0) {
                openModal("Nemůžeš hrát!", "Někteří hráči ze základní sestavy jsou v práci! Zruš jim práci, nebo je dej na lavičku náhradníků.");
                return;
            }

            // Simulace výhry
            money += 150;
            trophies += 25;
            updateUI();
            openModal("VÝHRA! 🎉", "Skvělý florbalový výkon! Získáváš 150 Kč a 25 pohárků.");
        }

        // Trophy Road
        function openTrophyRoad() {
            openModal("Trophy Road 🏆", `Aktuálně máš ${trophies} pohárků. Hraj zápasy a odemykej nové odměny v dalších updatech!`);
        }

        // Systém práce (Každých 5 sekund přidá peníze)
        setInterval(() => {
            let earned = 0;
            players.forEach(p => {
                if(p.isWorking) {
                    earned += (p.level * 1); // Level 1 = 1 Kč, Level 2 = 2 Kč...
                }
            });
            
            if(earned > 0) {
                money += earned;
                updateUI();
            }
        }, 5000); // 5000 milisekund = 5 sekund

        // Modals (Vyskakovací okna)
        function openModal(title, text) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerText = text;
            document.getElementById('custom-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('custom-modal').style.display = 'none';
        }

        // Inicializace
        updateUI();
    </script>
</body>
</html>
