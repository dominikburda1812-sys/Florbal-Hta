<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager v8.0</title>
    <style>
        :root { --accent: #fbbf24; --bg: #05070a; --field: #064e3b; --blue: #3b82f6; --red: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; overflow-x: hidden; }
        #top-ui { display: none; background: #111; padding: 12px; justify-content: space-between; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 100; }
        .screen { display: none; padding: 15px; padding-bottom: 100px; box-sizing: border-box; min-height: 100vh; }
        .active { display: block; }
        .card { background: #161a1d; border: 1px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        button { background: var(--accent); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: 800; width: 100%; cursor: pointer; }
        button:disabled { background: #333; color: #666; }

        /* ANIMACE ZÁPASU 5v5 */
        .match-box { width: 100%; height: 200px; background: var(--field); border-radius: 12px; position: relative; overflow: hidden; border: 2px solid #059669; display: none; margin: 10px 0; }
        .goal { position: absolute; width: 8px; height: 50px; background: rgba(255,255,255,0.3); border: 2px solid white; top: 75px; }
        .player-dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; transition: all 0.6s ease-in-out; border: 1px solid #fff; }
        .ball { position: absolute; width: 8px; height: 8px; background: #fff; border-radius: 50%; box-shadow: 0 0 5px #fff; z-index: 10; transition: all 0.4s ease; }

        /* INVENTÁŘ */
        .bag-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .slot { aspect-ratio: 1; background: #111; border: 1px solid #444; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; }
        
        #bot-nav { display: none; position: fixed; bottom: 0; width: 100%; height: 70px; background: #111; justify-content: space-around; align-items: center; border-top: 1px solid #333; }
        .nav-item { font-size: 1.5rem; opacity: 0.4; cursor: pointer; }
        .nav-item.active { opacity: 1; color: var(--accent); }
    </style>
</head>
<body>

    <div id="top-ui">
        <div>🪙 <span id="ui-money" style="color:var(--accent)">0</span></div>
        <div>Hráči: <span id="ui-count" style="color:var(--accent)">0</span></div>
    </div>

    <div id="scr-reg" class="screen active">
        <h2 style="text-align:center">FLORBALOVÝ MANAŽER v8.0</h2>
        <div class="card"><input type="text" id="in-team" placeholder="Název klubu..."><button onclick="initGame()">ZALOŽIT KLUB</button></div>
    </div>

    <div id="scr-match" class="screen">
        <div id="match-area" class="match-box">
            <div class="goal" style="left:0"></div><div class="goal" style="right:0"></div>
            <div id="m-ball" class="ball"></div>
            <div id="players-layer"></div>
            <div style="position:absolute; width:100%; text-align:center; font-weight:bold; top:5px;"><span id="score-h">0</span> : <span id="score-a">0</span></div>
        </div>
        <button id="btn-play" onclick="playMatch()">HRÁT ZÁPAS</button>
        <div id="liga-tabulka" style="margin-top:15px"></div>
    </div>

    <div id="scr-profile" class="screen">
        <h3>INVENTÁŘ A SESTAVA</h3>
        <div class="bag-grid" id="bag-ui"></div>
        <div id="use-item-ui" style="display:none; margin-top:10px" class="card">
            <h4>Použít Energy Drink na:</h4>
            <div id="drink-targets"></div>
        </div>
    </div>

    <div id="scr-shop" class="screen">
        <h3>OBCHOD</h3>
        <div class="card" id="shop-drink-card">
            <div id="drink-status">Zjišťuji zásoby...</div>
        </div>
        <div class="card">
            <button onclick="buyPack('bronz')">BRONZOVÝ BALÍČEK (5000 🪙)</button>
        </div>
    </div>

    <div id="scr-sleep" class="screen"><h3>KABINA</h3><div id="hraci-list"></div></div>

    <div id="bot-nav">
        <div class="nav-item" onclick="prepni('sleep')">🛌</div>
        <div class="nav-item active" onclick="prepni('match')">🥅</div>
        <div class="nav-item" onclick="prepni('profile')">👤</div>
        <div class="nav-item" onclick="prepni('shop')">📦</div>
    </div>

<script>
    let db = JSON.parse(localStorage.getItem('fb_v8')) || {
        m: 10000, p: [], b: Array(20).fill(null), lineup: {LW:null,C:null,RW:null,LD:null,RD:null},
        matches: 0, league: [{n:"Tatran",lvl:5,pts:0},{n:"Vítkovice",lvl:8,pts:0}]
    };

    function save() { localStorage.setItem('fb_v8', JSON.stringify(db)); }

    function prepni(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('scr-' + id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if(id==='shop') checkDrinkStock();
        if(id==='profile') renderBag();
        if(id==='sleep') renderSleep();
        updateUI();
    }

    function updateUI() {
        document.getElementById('ui-money').innerText = db.m;
        document.getElementById('ui-count').innerText = db.p.length;
    }

    /* MATCH ENGINE 5v5 */
    function playMatch() {
        const area = document.getElementById('match-area');
        const layer = document.getElementById('players-layer');
        area.style.display = 'block';
        layer.innerHTML = "";
        
        let pDots = [];
        for(let i=0; i<10; i++) {
            let d = document.createElement('div');
            d.className = 'player-dot';
            d.style.backgroundColor = i < 5 ? 'var(--blue)' : 'var(--red)';
            layer.appendChild(d);
            pDots.push(d);
        }

        let ball = document.getElementById('m-ball');
        let timer = 0;
        let int = setInterval(() => {
            pDots.forEach(d => {
                d.style.left = Math.random()*90 + "%";
                d.style.top = Math.random()*80 + "%";
            });
            ball.style.left = pDots[Math.floor(Math.random()*10)].style.left;
            ball.style.top = pDots[Math.floor(Math.random()*10)].style.top;
            
            timer++;
            if(timer > 15) {
                clearInterval(int);
                area.style.display = 'none';
                alert("Zápas skončil!");
                // Zde by byla logika finishMatch z v7.0
            }
        }, 600);
    }

    /* SHOP & ENERGY DRINK */
    function checkDrinkStock() {
        let hasDrink = Math.random() > 0.5;
        let container = document.getElementById('shop-drink-card');
        if(hasDrink) {
            container.innerHTML = `<h4>ENERGY DRINK SKLADEM!</h4><p>Cena: 500 🪙</p><button onclick="buyDrink()">KOUPIT</button>`;
        } else {
            container.innerHTML = `<h4>Lékárna je vyprodaná</h4><p>Zkus to příště.</p>`;
        }
    }

    function buyDrink() {
        if(db.m < 500) return alert("Málo peněz!");
        let slot = db.b.indexOf(null);
        if(slot === -1) return alert("Batoh je plný!");
        db.m -= 500;
        db.b[slot] = { type: 'drink', icon: '🥤' };
        save();
        updateUI();
        checkDrinkStock();
    }

    function renderBag() {
        let ui = document.getElementById('bag-ui');
        ui.innerHTML = "";
        db.b.forEach((item, idx) => {
            let s = document.createElement('div');
            s.className = 'slot';
            s.innerHTML = item ? item.icon : "";
            s.onclick = () => { if(item && item.type === 'drink') showDrinkTargets(idx); };
            ui.appendChild(s);
        });
    }

    function showDrinkTargets(slotIdx) {
        let ui = document.getElementById('use-item-ui');
        let list = document.getElementById('drink-targets');
        ui.style.display = 'block';
        list.innerHTML = "";
        db.p.forEach(h => {
            let b = document.createElement('button');
            b.style.margin = "5px 0";
            b.innerText = `${h.n} (Energie: ${h.e}%)`;
            b.onclick = () => {
                h.e = 100;
                db.b[slotIdx] = null;
                ui.style.display = 'none';
                alert(`${h.n} je plný energie!`);
                save(); renderBag();
            };
            list.appendChild(b);
        });
    }

    // Inicializace, registrace a další funkce by následovaly jako v předchozím kódu...
    function initGame() {
        db.name = document.getElementById('in-team').value || "Můj Klub";
        ["LW","C","RW","LD","RD"].forEach((pos, i) => {
            db.p.push({id: Date.now()+i, n: "Hráč "+(i+1), lvl: 1, pos: pos, e: 100});
        });
        document.getElementById('scr-reg').classList.remove('active');
        document.getElementById('top-ui').style.display = 'flex';
        document.getElementById('bot-nav').style.display = 'flex';
        prepni('match');
        save();
    }
</script>
</body>
</html>
