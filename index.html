<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager v9.5 Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0f172a; --surface: rgba(15, 23, 42, 0.9); --surface-border: rgba(255, 255, 255, 0.15);
            --accent: #00ff88; --text: #f8fafc; --text-muted: #94a3b8;
            --blue: #3b82f6; --red: #ef4444; --gold: #fbbf24; --gold-glow: rgba(251, 191, 36, 0.4);
            /* Rarities */
            --r-basic: #94a3b8; --r-medium: #22c55e; --r-rare: #3b82f6; --r-epic: #a855f7;
        }
        
        body { 
            font-family: 'Montserrat', sans-serif; color: var(--text); margin: 0; 
            background: var(--bg);
            overflow-x: hidden; user-select: none; 
        }

        /* --- NOVÉ DESIGNY POZADÍ --- */
        
        #scr-sleep { 
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), url('hraci-bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        #tr-overlay { 
            position: fixed; inset: 0; 
            background: url('trophy-bg.png');
            background-size: cover;
            background-position: center;
            z-index: 5500; display: none; flex-direction: column; 
        }

        /* Vylepšený vertikální Trophy Road */
        .tr-header { 
            background: rgba(0,0,0,0.7); padding: 20px; text-align: center; 
            font-family: 'Orbitron', sans-serif; color: var(--gold); font-size: 1.5rem;
            border-bottom: 2px solid var(--gold);
        }
        .tr-track-container { 
            flex-grow: 1; overflow-y: auto; padding: 40px 0; 
            display: flex; flex-direction: column-reverse; align-items: center; gap: 60px;
            background: rgba(0,0,0,0.3);
        }
        .tr-node { 
            display: flex; flex-direction: column; align-items: center; gap: 10px; 
            width: 200px; text-align: center; position: relative; z-index: 2;
        }
        .tr-circle { 
            width: 70px; height: 70px; background: rgba(0,0,0,0.8); border: 4px solid #444; 
            border-radius: 20px; display: flex; justify-content: center; align-items: center; 
            font-size: 2rem; transition: 0.3s; cursor: pointer; transform: rotate(45deg);
        }
        .tr-circle span { transform: rotate(-45deg); }
        .tr-node.unlocked .tr-circle { border-color: var(--gold); background: rgba(251, 191, 36, 0.3); box-shadow: 0 0 20px var(--gold); animation: pulseGold 2s infinite; }
        .tr-node.claimed .tr-circle { border-color: var(--accent); opacity: 0.6; }

        /* Zbytek CSS (upraveno pro scannability) */
        .screen { display: none; padding: 20px; padding-bottom: 120px; min-height: 100vh; animation: fade 0.3s ease-out; }
        .active { display: block; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        
        .card { background: var(--surface); backdrop-filter: blur(10px); border: 1px solid var(--surface-border); border-radius: 16px; padding: 15px; margin-bottom: 15px; }
        h3 { color: var(--accent); text-transform: uppercase; font-family: 'Orbitron'; font-size: 1rem; margin-bottom: 15px; }
        
        button { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 900; width: 100%; cursor: pointer; text-transform: uppercase; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-red { background: var(--red); color: white; }

        #top-ui { display: flex; background: rgba(5, 8, 15, 0.95); padding: 12px 20px; justify-content: space-between; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--surface-border); }
        .stat-badge { background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 8px; font-weight: 800; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; }
        
        #bot-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #05080f; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--surface-border); }
        .nav-item { opacity: 0.5; text-align: center; font-size: 0.6rem; color: white; text-decoration: none; }
        .nav-item.active { opacity: 1; color: var(--accent); }
        .nav-icon { width: 24px; height: 24px; display: block; margin: 0 auto 4px; fill: currentColor; }

        /* Modal */
        #custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
        .modal-box { background: #1e293b; border: 2px solid var(--accent); border-radius: 20px; padding: 25px; text-align: center; width: 100%; max-width: 300px; }

        /* Match Area */
        #match-area { width: 100%; height: 200px; background: #064e3b; border-radius: 15px; position: relative; overflow: hidden; margin-bottom: 15px; display: none; border: 2px solid #fff; }
        .ball { position: absolute; width: 8px; height: 8px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff; }
        .player-dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; }

        .trophy-road-btn { background: linear-gradient(135deg, #f97316, #fbbf24); color: #000; padding: 12px; border-radius: 12px; font-family: 'Orbitron'; font-weight: 900; margin-bottom: 20px; text-align: center; cursor: pointer; }
    </style>
</head>
<body>

    <div id="custom-modal">
        <div class="modal-box">
            <h2 id="cm-title" style="font-family: 'Orbitron';">OZNÁMENÍ</h2>
            <p id="cm-text" style="font-weight: 700;"></p>
            <button onclick="closeModal()">OK</button>
        </div>
    </div>

    <div id="top-ui">
        <div style="display:flex; gap:10px;">
            <div class="stat-badge" style="color:var(--gold);"><span id="ui-money">0</span> 🪙</div>
            <div class="stat-badge" style="color:#f97316;"><span id="ui-trophies">0</span> 🏆</div>
        </div>
        <div class="stat-badge" style="color:var(--accent);">SÍLA <span id="ui-lvl">0</span></div>
    </div>

    <div id="tr-overlay">
        <div class="tr-header">TROPHY ROAD 🏆</div>
        <div class="tr-track-container" id="tr-list">
            </div>
        <button onclick="document.getElementById('tr-overlay').style.display='none'" style="border-radius: 0; background: #000; color: #fff;">ZAVŘÍT</button>
    </div>

    <div id="scr-match" class="screen active">
        <div class="trophy-road-btn" onclick="openTrophyRoad()">VSTOUPIT NA TROPHY ROAD</div>
        
        <h3>Zápasové centrum</h3>
        <div id="match-area">
            <div id="m-ball" class="ball"></div>
            <div id="players-layer"></div>
            <div style="position:absolute; width:100%; text-align:center; top:10px; font-family:'Orbitron'; font-size:1.2rem;" id="match-score">0 : 0</div>
        </div>

        <button id="btn-play" onclick="initMatch()">HRÁT ZÁPAS</button>
        <div id="match-cooldown-ui" style="display:none; text-align:center; margin-top:10px; color:var(--accent);">
            Regenerace: <span id="cd-timer">30</span>s
        </div>
    </div>

    <div id="scr-sleep" class="screen">
        <h3>Kabina (Správa Týmu)</h3>
        <div id="hraci-list"></div>
    </div>

    <div id="scr-profile" class="screen">
        <h3>Tvůj Profil</h3>
        <p>Zde bude správa sestavy...</p>
    </div>

    <div id="scr-shop" class="screen">
        <h3>Obchod</h3>
        <button onclick="buyPack()" style="margin-bottom: 10px;">KOUPIT BALÍČEK (5 000 🪙)</button>
    </div>

    <nav id="bot-nav">
        <div class="nav-item active" onclick="prepni('match')">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2L2 22H22L12 2Z"/></svg>
            ZÁPAS
        </div>
        <div class="nav-item" onclick="prepni('sleep')">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 18L2 18V16L21 16V18ZM21 14L2 14V12L21 12V14ZM21 10L2 10V8L21 8V10ZM21 6L2 6V4L21 4V6Z"/></svg>
            TÝM
        </div>
        <div class="nav-item" onclick="prepni('profile')">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            PROFIL
        </div>
        <div class="nav-item" onclick="prepni('shop')">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            SHOP
        </div>
    </nav>

<script>
    // --- DATA HRY ---
    let db = JSON.parse(localStorage.getItem('fb_v9_5')) || {
        m: 10000, trophies: 0, trClaimed: [], 
        p: [
            {id: 1, n: "Filip Kysela", lvl: 5, e: 100, sleepUntil: 0},
            {id: 2, n: "Lukáš Němec", lvl: 4, e: 100, sleepUntil: 0},
            {id: 3, n: "Matěj Dvořák", lvl: 6, e: 100, sleepUntil: 0}
        ],
        lastMatchEnd: 0
    };

    const trData = [
        { req: 10, desc: "START BALÍČEK", type: "pack" },
        { req: 30, desc: "1 000 🪙", type: "coin", rw: 1000 },
        { req: 50, desc: "5 000 🪙", type: "coin", rw: 5000 },
        { req: 100, desc: "ELITNÍ HRÁČ", type: "pack" },
        { req: 200, desc: "10 000 🪙", type: "coin", rw: 10000 }
    ];

    function save() { localStorage.setItem('fb_v9_5', JSON.stringify(db)); }

    function showModal(title, text) {
        document.getElementById('cm-title').innerText = title;
        document.getElementById('cm-text').innerText = text;
        document.getElementById('custom-modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('custom-modal').style.display = 'none'; }

    function prepni(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('scr-' + id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if(id === 'sleep') renderSleep();
        updateUI();
    }

    function updateUI() {
        document.getElementById('ui-money').innerText = db.m.toLocaleString();
        document.getElementById('ui-trophies').innerText = db.trophies;
        let avg = db.p.length > 0 ? Math.round(db.p.reduce((a, b) => a + b.lvl, 0) / db.p.length) : 0;
        document.getElementById('ui-lvl').innerText = avg;
    }

    // --- LOGIKA ZÁPASU (s výhrou a prohrou) ---
    function initMatch() {
        document.getElementById('match-area').style.display = 'block';
        document.getElementById('btn-play').style.display = 'none';
        
        // Simulace výsledku
        let win = Math.random() > 0.4;
        let scoreH = win ? 3 : 1;
        let scoreA = win ? 1 : 2;
        
        document.getElementById('match-score').innerText = `${scoreH} : ${scoreA}`;

        setTimeout(() => {
            document.getElementById('match-area').style.display = 'none';
            if(win) {
                db.m += 500;
                db.trophies += 25;
                showModal("VÍTĚZSTVÍ!", "Získal jsi 500 🪙 a 25 🏆.");
            } else {
                db.trophies = Math.max(0, db.trophies - 10); // Prohra ubírá 10 trofejí
                db.m += 50; // Malá cena útěchy
                showModal("PROHRA", "Ztratil jsi 10 🏆. Získáváš malou cenu útěchy 50 🪙.");
            }
            
            // Odečtení energie
            db.p.forEach(h => h.e = Math.max(0, h.e - 25));
            db.lastMatchEnd = Date.now();
            save();
            updateUI();
        }, 3000);
    }

    // --- TROPHY ROAD LOGIKA ---
    function openTrophyRoad() {
        let list = document.getElementById('tr-list');
        list.innerHTML = '';
        
        trData.forEach((node, i) => {
            let unlocked = db.trophies >= node.req;
            let claimed = db.trClaimed.includes(i);
            
            let div = document.createElement('div');
            div.className = `tr-node ${unlocked ? 'unlocked' : ''} ${claimed ? 'claimed' : ''}`;
            div.innerHTML = `
                <div class="tr-circle" onclick="claimReward(${i})">
                    <span>${claimed ? '✔️' : (unlocked ? '🎁' : '🔒')}</span>
                </div>
                <div style="font-weight:900; color:white; background:rgba(0,0,0,0.5); padding:2px 10px; border-radius:10px;">${node.req} 🏆</div>
                <div style="font-size:0.7rem; color:var(--gold);">${node.desc}</div>
            `;
            list.appendChild(div);
        });
        document.getElementById('tr-overlay').style.display = 'flex';
    }

    function claimReward(i) {
        if(db.trClaimed.includes(i)) return;
        if(db.trophies < trData[i].req) return;
        
        let node = trData[i];
        db.trClaimed.push(i);
        
        if(node.type === "coin") db.m += node.rw;
        if(node.type === "pack") showModal("BALÍČEK", "Získal jsi nového hráče!");
        
        save();
        updateUI();
        openTrophyRoad();
    }

    function renderSleep() {
        let div = document.getElementById('hraci-list');
        div.innerHTML = "";
        db.p.forEach(h => {
            let sleeping = h.sleepUntil > Date.now();
            div.innerHTML += `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <b>${h.n}</b><br>
                        <small>Energie: ${h.e}%</small>
                    </div>
                    <button onclick="startSleep(${h.id})" style="width:auto; padding:5px 15px;" class="btn-blue" ${sleeping || h.e === 100 ? 'disabled' : ''}>
                        ${sleeping ? 'SPÍ...' : 'SPÁT'}
                    </button>
                </div>
            `;
        });
    }

    function startSleep(id) {
        let h = db.p.find(x => x.id === id);
        h.e = 100;
        h.sleepUntil = Date.now() + 10000; // Spánek na 10 vteřin pro test
        save();
        renderSleep();
    }

    setInterval(() => {
        if(db.lastMatchEnd > 0) {
            let cd = Math.ceil((db.lastMatchEnd + 30000 - Date.now()) / 1000);
            if(cd > 0) {
                document.getElementById('btn-play').style.display = 'none';
                document.getElementById('match-cooldown-ui').style.display = 'block';
                document.getElementById('cd-timer').innerText = cd;
            } else {
                document.getElementById('btn-play').style.display = 'block';
                document.getElementById('match-cooldown-ui').style.display = 'none';
            }
        }
    }, 1000);

    window.onload = updateUI;

</script>
</body>
</html>
