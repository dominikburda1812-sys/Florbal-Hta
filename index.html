<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager v11 + Trénink</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* ... (stejné styly jako v originále, beze změny) ... */
        /* ═══════════════════════════════════════════════
           DESIGN TOKENS (beze změny)
        ═══════════════════════════════════════════════ */
        :root {
            --bg-deep:      #060a14;
            --bg-mid:       #0c1220;
            --bg-surface:   #111827;
            --bg-elevated:  #1a2236;
            --bg-glass:     rgba(17, 24, 39, 0.7);
            --border-subtle:  rgba(255,255,255,0.06);
            --border-soft:    rgba(255,255,255,0.10);
            --border-medium:  rgba(255,255,255,0.16);
            --accent:        #00e5a0;
            --accent-dim:    rgba(0, 229, 160, 0.12);
            --accent-glow:   rgba(0, 229, 160, 0.35);
            --accent-solid:  #00c98c;
            --blue:          #38bdf8;
            --blue-dim:      rgba(56, 189, 248, 0.12);
            --blue-glow:     rgba(56, 189, 248, 0.3);
            --red:           #f43f5e;
            --red-dim:       rgba(244, 63, 94, 0.12);
            --red-glow:      rgba(244, 63, 94, 0.3);
            --gold:          #f59e0b;
            --gold-dim:      rgba(245, 158, 11, 0.12);
            --gold-glow:     rgba(245, 158, 11, 0.4);
            --orange:        #fb923c;
            --text:          #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted:    #4b5563;
            --r-basic: #64748b;
            --r-medium: #22c55e;
            --r-rare: #60a5fa;
            --r-epic: #c084fc;
            --r-sm:   8px;
            --r-md:   12px;
            --r-lg:   16px;
            --r-xl:   20px;
            --r-2xl:  24px;
            --r-full: 9999px;
            --gap-xs: 6px;
            --gap-sm: 10px;
            --gap-md: 16px;
            --gap-lg: 24px;
            --gap-xl: 32px;
            --field-lines: rgba(255,255,255,0.22);
        }
        /* ... (všechny ostatní styly z původního souboru) ... */

        /* ═══════════════════════════════════════════════
           NOVÉ STYLY PRO TRÉNINK
        ═══════════════════════════════════════════════ */
        .xp-bar-wrap {
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .xp-bar-track {
            flex: 1;
            height: 4px;
            background: var(--bg-elevated);
            border-radius: var(--r-full);
            overflow: hidden;
        }
        .xp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--accent));
            border-radius: var(--r-full);
            transition: width 0.3s ease;
        }
        .xp-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .training-badge {
            position: absolute;
            top: -1px;
            right: -1px;
            background: linear-gradient(135deg, var(--blue), #0ea5e9);
            color: #021827;
            padding: 5px 11px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
            border-radius: 0 var(--r-xl) 0 var(--r-lg);
            animation: trainingPulse 1.8s ease-in-out infinite;
        }
        @keyframes trainingPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .drill-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 14px;
        }
        .drill-btn {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--r-md);
            padding: 8px 4px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .drill-btn.active {
            background: var(--blue-dim);
            border-color: var(--blue);
            color: var(--blue);
        }
        .drill-btn .cost {
            font-size: 9px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<!-- ... (modály a overlay, beze změny) ... -->
<div id="custom-modal">...</div>
<div id="tr-overlay">...</div>

<!-- SCREEN: MATCH (beze změny) -->
<div id="scr-match" class="screen">...</div>

<!-- SCREEN: KABINA (beze změny) -->
<div id="scr-sleep" class="screen">...</div>

<!-- SCREEN: TÝM (UPRAVENO - tlačítko Trénink nyní otevírá novou obrazovku) -->
<div id="scr-profile" class="screen">
    <div style="margin-bottom:20px;">
        <!-- Změna: tlačítko nyní přepíná na scr-training -->
        <button class="btn-ghost" onclick="prepni('training')">🏋️ TRÉNINK</button>
    </div>
    <div class="section-heading"><h3>Taktická sestava</h3></div>
    <div class="tactical-field">...</div>
    <div id="select-box"></div>
    <div style="margin-top:28px;">
        <div class="section-heading"><h3>Inventář</h3><span class="sh-sub">Kliknutím na předmět použiješ nebo prodáš</span></div>
        <div class="bag-grid" id="bag-ui"></div>
    </div>
    <div id="use-item-ui">...</div>
</div>

<!-- SCREEN: OBCHOD (beze změny) -->
<div id="scr-shop" class="screen">...</div>

<!-- ========== NOVÁ OBRAZOVKA: TRÉNINKOVÉ CENTRUM ========== -->
<div id="scr-training" class="screen">
    <div class="section-heading" style="margin-bottom:6px;"><h3>🏋️ Tréninkové centrum</h3></div>
    <p class="t-body" style="margin-bottom: 20px; padding-left: 13px;">
        Vyber hráče a typ drilu. Trénink spotřebuje energii a čas, ale přinese zkušenosti (XP). 100 XP = nový level.
    </p>
    <div id="training-list"></div>
</div>

<!-- PACK REVEAL OVERLAY (beze změny) -->
<div id="pack-overlay">...</div>

<!-- SETUP (beze změny) -->
<div id="setup-overlay">...</div>

<!-- BOTTOM NAV (beze změny) -->
<div id="bot-nav">...</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   PLAYER AVATAR SYSTEM (beze změny)
═══════════════════════════════════════════════════════════════════════ */
// ... (všechny funkce pro generování avatarů zůstávají stejné) ...

/* ═══════════════════════════════════════════════════════════════════════
   GAME LOGIC — UPRAVENO PRO TRÉNINK
═══════════════════════════════════════════════════════════════════════ */
    const SAVE_KEY = 'fb_v9_7_reset';
    let db = JSON.parse(localStorage.getItem(SAVE_KEY)) || {
        m: 10000, trophies: 0, trClaimed: [], p: [], lineup: {GK:null,LD:null,RD:null,LW:null,C:null,RW:null},
        b: Array(20).fill(null), sticks: [], shop: { bronz: true, silver: true, gold: true, drink: false, nextRefresh: 0 },
        league: [{n:"Tatran",lvl:6,pts:0},{n:"Boleslav",lvl:8,pts:0},{n:"Vítkovice",lvl:7,pts:0}],
        lastMatchEnd: 0, teamName: "", firstMatchDone: false
    };

    // NEW: Training constants
    const DRILLS = [
        { name: "Rychlý dril", energyCost: 20, duration: 5 * 60 * 1000, xpMin: 1, xpMax: 20, icon: "⚡" },
        { name: "Intenzivní", energyCost: 50, duration: 30 * 60 * 1000, xpMin: 20, xpMax: 50, icon: "🔥" },
        { name: "Profi dril", energyCost: 75, duration: 90 * 60 * 1000, xpMin: 50, xpMax: 75, icon: "🏋️" },
        { name: "Soustředění", energyCost: 100, duration: 150 * 60 * 1000, xpMin: 80, xpMax: 100, icon: "🧠" }
    ];
    const XP_PER_LEVEL = 100;

    // NEW: Migrace starých dat - přidá xp a trainingUntil, pokud chybí
    if (db.p) {
        db.p.forEach(p => {
            if (p.xp === undefined) p.xp = 0;
            if (p.trainingUntil === undefined) p.trainingUntil = 0;
        });
    }

    function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(db)); }

    // ... (funkce showModal, closeModal, getRarity, confirmTeamName zůstávají stejné) ...

    function prepni(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('scr-' + id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        const navMap = {sleep:0, match:1, profile:2, shop:3, training: -1}; // training není v bottom navigaci
        if (navMap[id] >= 0) {
            document.querySelectorAll('.nav-item')[navMap[id]].classList.add('active');
        }
        if (id === 'profile') { renderField(); renderBag(); }
        if (id === 'match') renderLeague();
        if (id === 'sleep') renderSleep();
        if (id === 'shop') updateShopUI();
        if (id === 'training') renderTraining();   // NEW: vykreslí tréninkovou obrazovku
        updateUI();
    }

    // NEW: Vykreslení tréninkové obrazovky
    function renderTraining() {
        let div = document.getElementById('training-list');
        if (!div) return;
        div.innerHTML = "";
        let now = Date.now();

        db.p.forEach(h => {
            let isTraining = h.trainingUntil > now;
            let isSleeping = h.sleepUntil > now;
            let isWorking = h.working;
            let inLineup = Object.values(db.lineup).includes(h.id);

            // Kontrola, zda může trénovat
            let canTrain = !isTraining && !isSleeping && !isWorking && !inLineup;

            let r = getRarity(h.lvl);
            let cfg = RARITY_CONFIG[r.n] || RARITY_CONFIG.BASIC;
            let stickBadge = h.stick ? `<span style="background:rgba(0,229,160,0.15);color:var(--accent);padding:3px 8px;border-radius:6px;font-size:11px;font-weight:800;font-family:'Barlow Condensed',sans-serif;border:1px solid rgba(0,229,160,0.25);">🏒 Lvl ${h.stick.lvl} +${stickBuffs[h.stick.lvl]}%</span>` : '';
            let trainingBadge = isTraining ? `<div class="training-badge">TRÉNINK 🏋️</div>` : '';
            let eColor = h.e < 30 ? 'var(--red)' : h.e < 60 ? 'var(--gold)' : 'var(--accent)';

            // XP bar
            let xpProgress = (h.xp % XP_PER_LEVEL) / XP_PER_LEVEL * 100;
            let currentLevelXp = h.xp % XP_PER_LEVEL;
            let xpToNext = XP_PER_LEVEL - currentLevelXp;

            // Avatar SVG
            let avatarSVG = getListAvatarSVG(h, 62);

            // Sestavení karty
            let card = document.createElement('div');
            card.className = 'player-card';
            card.style.borderColor = isTraining ? 'var(--blue)' : (isSleeping ? 'var(--blue-dim)' : (isWorking ? 'var(--gold)' : `${cfg.glowHex}44`));
            card.innerHTML = `
                <div class="pc-left-accent" style="background:${isTraining ? 'var(--blue)' : (isSleeping ? 'var(--blue)' : (isWorking ? 'var(--gold)' : cfg.glowHex))};"></div>
                ${trainingBadge}
                <div class="player-info">
                    <div class="player-avatar-wrap" style="border-color:${cfg.glowHex}; box-shadow: 0 0 12px ${cfg.glowHex}44;">
                        ${avatarSVG}
                    </div>
                    <div class="player-meta">
                        <div class="player-name">${h.n}</div>
                        <div class="player-tags">
                            <span class="rarity-badge" style="color:${cfg.glowHex};border-color:${cfg.glowHex};">${r.n}</span>
                            <span style="font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:var(--text-muted);">Lvl ${h.lvl}</span>
                            ${stickBadge}
                        </div>
                        <div class="energy-bar-wrap">
                            <div class="energy-bar-track"><div class="energy-bar-fill" style="width:${h.e}%;background:${eColor};"></div></div>
                            <span class="energy-label" style="color:${eColor};">${h.e}%</span>
                        </div>
                        <div class="xp-bar-wrap">
                            <div class="xp-bar-track"><div class="xp-bar-fill" style="width:${xpProgress}%;"></div></div>
                            <span class="xp-label">${currentLevelXp}/${XP_PER_LEVEL} XP</span>
                        </div>
                    </div>
                </div>
            `;

            // Tlačítka drillů
            let drillDiv = document.createElement('div');
            drillDiv.className = 'drill-buttons';

            DRILLS.forEach((drill, idx) => {
                let btn = document.createElement('button');
                btn.className = 'drill-btn';
                btn.innerHTML = `${drill.icon} ${drill.name}<span class="cost">-${drill.energyCost}% • ${drill.duration/60000}min</span>`;
                if (!canTrain || h.e < drill.energyCost) {
                    btn.disabled = true;
                    btn.style.opacity = '0.4';
                } else {
                    btn.onclick = () => startTraining(h.id, idx);
                }
                drillDiv.appendChild(btn);
            });

            card.appendChild(drillDiv);
            div.appendChild(card);
        });
    }

    // NEW: Spuštění tréninku
    function startTraining(playerId, drillIndex) {
        let h = db.p.find(p => p.id === playerId);
        if (!h) return;
        let now = Date.now();
        let drill = DRILLS[drillIndex];

        // Kontroly
        if (h.trainingUntil > now) return showModal("Pozor", "Hráč právě trénuje!", "var(--blue)", "🏋️");
        if (h.sleepUntil > now) return showModal("Pozor", "Hráč právě spí!", "var(--blue)", "💤");
        if (h.working) return showModal("Pozor", "Hráč právě pracuje! Ukonči mu směnu.", "var(--gold)", "💰");
        if (Object.values(db.lineup).includes(playerId)) return showModal("Pozor", "Hráč je v základní sestavě! Nejdřív ho vystřídej.", "var(--red)", "⚠️");
        if (h.e < drill.energyCost) return showModal("Pozor", "Nedostatek energie!", "var(--red)", "🔋");

        // Odečti energii a nastav trainingUntil
        h.e -= drill.energyCost;
        h.trainingUntil = now + drill.duration;

        save();
        renderTraining();
        showModal("Trénink zahájen", `${h.n} začal ${drill.name}. Hotovo za ${Math.ceil(drill.duration/60000)} min.`, "var(--blue)", drill.icon);
    }

    // NEW: Dokončení tréninku (volá se v hlavní smyčce)
    function checkTrainingCompletion() {
        let now = Date.now();
        let changed = false;
        db.p.forEach(h => {
            if (h.trainingUntil > 0 && h.trainingUntil <= now) {
                // Najdi drill podle délky? Neukládáme který, ale můžeme náhodně generovat XP podle spotřeby energie?
                // Lepší: budeme XP odvozovat od spotřebované energie (nebo si uložit dočasně? Zde nemáme info o drillu.
                // Musíme upravit: při startu tréninku si uložit do h.trainingDrill index nebo očekávané XP.
                // Pro jednoduchost teď XP = náhodné mezi 1 a 100 podle spotřeby energie? Není přesné.
                // Raději přidáme k hráči dočasnou vlastnost trainingXP, kterou nastavíme při startu.
                // Upravíme startTraining, aby ukládala očekávané XP.
                // Prozatím implementujeme bez ukládání drillu – ale to není správné.
                // Musíme kód upravit: při startu si zapamatujeme drill.
            }
        });
        // Tato funkce bude dokončena po úpravě startTraining.
    }

    // UPRAVENÁ startTraining, která ukládá drill index a očekávané XP
    function startTraining(playerId, drillIndex) {
        let h = db.p.find(p => p.id === playerId);
        if (!h) return;
        let now = Date.now();
        let drill = DRILLS[drillIndex];

        // Kontroly (stejné)
        if (h.trainingUntil > now) return showModal("Pozor", "Hráč právě trénuje!", "var(--blue)", "🏋️");
        if (h.sleepUntil > now) return showModal("Pozor", "Hráč právě spí!", "var(--blue)", "💤");
        if (h.working) return showModal("Pozor", "Hráč právě pracuje! Ukonči mu směnu.", "var(--gold)", "💰");
        if (Object.values(db.lineup).includes(playerId)) return showModal("Pozor", "Hráč je v základní sestavě! Nejdřív ho vystřídej.", "var(--red)", "⚠️");
        if (h.e < drill.energyCost) return showModal("Pozor", "Nedostatek energie!", "var(--red)", "🔋");

        // Odečti energii
        h.e -= drill.energyCost;

        // Ulož informace o tréninku
        h.trainingUntil = now + drill.duration;
        h.trainingDrill = drillIndex;        // nová vlastnost

        save();
        renderTraining();
        showModal("Trénink zahájen", `${h.n} začal ${drill.name}. Hotovo za ${Math.ceil(drill.duration/60000)} min.`, "var(--blue)", drill.icon);
    }

    // NOVÁ: Dokončení tréninku
    function checkTrainingCompletion() {
        let now = Date.now();
        let changed = false;
        db.p.forEach(h => {
            if (h.trainingUntil > 0 && h.trainingUntil <= now) {
                // Dokončený trénink
                let drillIndex = h.trainingDrill;
                if (drillIndex === undefined) drillIndex = 0; // pro případ starých dat
                let drill = DRILLS[drillIndex];
                // Náhodné XP v rozmezí drillu
                let xpGained = Math.floor(Math.random() * (drill.xpMax - drill.xpMin + 1)) + drill.xpMin;
                h.xp = (h.xp || 0) + xpGained;

                // Level up
                let newLevel = Math.floor(h.xp / XP_PER_LEVEL) + 1; // protože startovní level je 1
                if (newLevel > h.lvl) {
                    h.lvl = newLevel;
                    showModal("LEVEL UP!", `${h.n} dosáhl levelu ${newLevel}!`, "var(--accent)", "⭐");
                }

                // Vyčistí trénink
                h.trainingUntil = 0;
                delete h.trainingDrill;
                changed = true;
            }
        });
        if (changed) {
            save();
            // Pokud je aktivní tréninková obrazovka, překresli ji
            if (document.getElementById('scr-training').classList.contains('active')) {
                renderTraining();
            }
        }
    }

    // ... (všechny ostatní funkce zůstávají stejné: generatePlayer, openSpecialPack, atd.) ...

    // UPRAVENÁ generatePlayer, aby přidala xp a trainingUntil
    function generatePlayer(minLvl, maxLvl, specificPos) {
        let lvl = Math.floor(Math.random() * (maxLvl - minLvl + 1)) + minLvl;
        let id = Date.now();
        let name = names[Math.floor(Math.random() * names.length)] + " " + sNames[Math.floor(Math.random() * sNames.length)];
        let pos = specificPos || ["GK", "LD", "RD", "LW", "C", "RW"][Math.floor(Math.random() * 6)];
        // XP je náhodné, ale odpovídá levelu (0-99)
        let xp = Math.floor(Math.random() * XP_PER_LEVEL);
        return { id, n: name, lvl, pos, e: 100, xp, lastSleep: 0, sleepUntil: 0, trainingUntil: 0, stick: null, working: false, workTicks: 0 };
    }

    // Hlavní interval (upravený - přidáno checkTrainingCompletion)
    setInterval(() => {
        let now = Date.now();

        // Kontrola tréninků
        checkTrainingCompletion();

        // Ostatní kontroly (shop, work, cooldown) zůstávají
        if (now > db.shop.nextRefresh) checkShop();
        let sRem = Math.max(0, Math.ceil((db.shop.nextRefresh - now) / 1000));
        let min = Math.floor(sRem / 60), sec = sRem % 60;
        document.getElementById('shop-timer').innerText = `DOPLNĚNÍ: 0${min}:${sec < 10 ? '0' : ''}${sec}`;

        if (document.getElementById('scr-sleep').classList.contains('active')) renderSleep();
        if (document.getElementById('scr-training').classList.contains('active')) renderTraining(); // překresli, pokud je aktivní

        let workMoneyGained = 0;
        db.p.forEach(h => {
            if (h.working) {
                h.workTicks++;
                if (h.workTicks >= 5) {
                    workMoneyGained += h.lvl;
                    h.workTicks = 0;
                }
            }
        });
        if (workMoneyGained > 0) {
            db.m += workMoneyGained;
            updateUI();
            save();
        }

        if (db.lastMatchEnd > 0) {
            let matchAreaVisible = document.getElementById('match-area').style.display === 'block';
            let cdLeft = Math.ceil((db.lastMatchEnd + 30000 - now) / 1000);
            if (cdLeft > 0 && !matchAreaVisible) {
                document.getElementById('btn-play').style.display = 'none';
                document.getElementById('match-cooldown-ui').style.display = 'block';
                document.getElementById('cd-timer').innerText = cdLeft;
            } else if (cdLeft <= 0 && !matchAreaVisible) {
                document.getElementById('btn-play').style.display = 'flex';
                document.getElementById('match-cooldown-ui').style.display = 'none';
            }
        }
    }, 1000);

    window.onload = () => {
        if (!db.teamName) {
            document.getElementById('setup-overlay').style.display = 'flex';
        } else {
            document.getElementById('top-ui').style.display = 'flex';
            document.getElementById('bot-nav').style.display = 'flex';
            prepni('match');
            checkShop();
        }
    };
</script>
</body>
</html>
