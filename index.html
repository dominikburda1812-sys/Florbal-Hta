<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager | Ultimate Fix</title>
    <style>
        :root {
            --primary-gold: #fbbf24; --secondary-gold: #f59e0b; --text-main: #f8fafc;
            --glass: rgba(0, 0, 0, 0.7); --border: rgba(255, 255, 255, 0.1);
            --bg-reg: radial-gradient(circle at top, #1e293b, #000);
            --bg-sleep: radial-gradient(circle at top, #1e1b4b, #020617);
            --bg-match: radial-gradient(circle at top, #064e3b, #020617);
            --bg-shop: radial-gradient(circle at top, #451a03, #020617);
            --bg-profile: radial-gradient(circle at top, #0f172a, #000);
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-reg); background-attachment: fixed; color: var(--text-main); margin: 0; text-align: center; overflow: hidden; transition: background 0.5s ease; }
        .grid-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 30px 30px; z-index: -1; }
        
        .ui-bar { background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-around; font-weight: bold; font-size: 0.9em; }
        .screen { display: none; padding: 15px; height: 82vh; overflow-y: auto; padding-bottom: 100px; box-sizing: border-box; }
        .screen.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 18px; padding: 15px; margin: 10px auto; width: 92%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        button { background: linear-gradient(135deg, var(--secondary-gold), var(--primary-gold)); border: none; padding: 12px; border-radius: 10px; font-weight: 800; color: #000; text-transform: uppercase; width: 100%; cursor: pointer; }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

        .energy-container { background: rgba(255,255,255,0.1); height: 8px; border-radius: 5px; margin: 8px 0; overflow: hidden; }
        .energy-fill { background: var(--primary-gold); height: 100%; transition: width 0.4s; }

        /* Batoh mřížka */
        .inv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 10px; }
        .inv-slot { aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; position: relative; }
        .stack { position: absolute; bottom: 2px; right: 4px; font-size: 10px; color: var(--primary-gold); font-weight: bold; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 70px; background: rgba(0,0,0,0.95); display: flex; border-top: 1px solid var(--border); z-index: 100; }
        .nav-item { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #4b5563; }
        .nav-item.selected { color: var(--primary-gold); font-size: 28px; }

        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th { color: var(--primary-gold); border-bottom: 1px solid var(--border); padding: 8px; }
        td { padding: 10px 5px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        #sim-canvas { background: #000; border: 2px solid var(--primary-gold); border-radius: 12px; display: block; margin: 0 auto; }
        #half-time-overlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--primary-gold); color: #000; padding: 10px 20px; font-weight: bold; border-radius: 5px; z-index: 1100; pointer-events: none; }
    </style>
</head>
<body id="main-body">
<div class="grid-overlay"></div>

<div id="top-ui" style="display:none" class="ui-bar">
    <span>💰 <span id="money">0</span></span>
    <span>📊 AVG: <span id="team-avg">0</span></span>
    <span>👥 <span id="player-count">0</span>/20</span>
</div>

<div id="scr-reg" class="screen active">
    <h1>FLORBAL MANAŽER</h1>
    <div class="card">
        <input type="text" id="mgr-name" style="width:85%; padding:12px; border-radius:10px; margin-bottom:10px;" placeholder="JMÉNO MANAŽERA">
        <div id="player-inputs">
            <input type="text" class="p-name" style="width:80%; padding:8px; margin-bottom:4px;" placeholder="Hráč 1">
            <input type="text" class="p-name" style="width:80%; padding:8px; margin-bottom:4px;" placeholder="Hráč 2">
            <input type="text" class="p-name" style="width:80%; padding:8px; margin-bottom:4px;" placeholder="Hráč 3">
            <input type="text" class="p-name" style="width:80%; padding:8px; margin-bottom:4px;" placeholder="Hráč 4">
            <input type="text" class="p-name" style="width:80%; padding:8px; margin-bottom:4px;" placeholder="Hráč 5">
            <input type="text" class="p-name" style="width:80%; padding:8px; margin-bottom:4px;" placeholder="Hráč 6">
        </div>
        <button onclick="createTeam()">ZALOŽIT KLUB</button>
    </div>
</div>

<div id="scr-sleep" class="screen">
    <h2>KABINA 🛌</h2>
    <p id="use-msg" style="display:none; color: var(--primary-gold); font-weight:bold;">KLIKNI NA HRÁČE PRO DOPLNĚNÍ ENERGIE!</p>
    <div id="sleep-list"></div>
</div>

<div id="scr-match" class="screen">
    <h2>LIGA 🏆</h2>
    <div class="card" style="width:95%;">
        <table><thead><tr><th>#</th><th>TÝM</th><th>LVL</th><th>PTS</th></tr></thead><tbody id="league-body"></tbody></table>
    </div>
    <div class="card">
        <button id="match-btn" onclick="runMatch()">HRÁT ZÁPAS (30s)</button>
        <p id="match-timer-text" style="font-size:0.8em; color:#94a3b8; margin-top:10px;"></p>
    </div>
</div>

<div id="scr-shop" class="screen">
    <h2>OBCHOD 🛒</h2>
    <p id="shop-timer" style="font-size:0.8em; color:var(--primary-gold);"></p>
    <div id="shop-list"></div>
</div>

<div id="scr-profile" class="screen">
    <h2 id="prof-name">PROFIL</h2>
    <div class="card">
        <h3>🎒 BATOH (Max 20x stack)</h3>
        <div id="backpack" class="inv-grid"></div>
    </div>
    <button style="background:#ef4444; color:white; margin-top:10px;" onclick="resetGame()">RESET HRY</button>
</div>

<div id="sim-container" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:1000; padding-top:20px;">
    <h2 id="sim-time-text">0s</h2>
    <div style="position:relative; display:inline-block;">
        <canvas id="sim-canvas" width="320" height="200"></canvas>
        <div id="half-time-overlay">POLOČAS</div>
    </div>
    <div id="commentary-box" class="card" style="margin-top:20px; min-height:40px; color:var(--primary-gold); font-style:italic;">...</div>
</div>

<div id="nav" class="nav-bar" style="display:none">
    <div class="nav-item" id="n-sleep" onclick="nav('sleep')">🛌</div>
    <div class="nav-item selected" id="n-match" onclick="nav('match')">🥅</div>
    <div class="nav-item" id="n-shop" onclick="nav('shop')">🛒</div>
    <div class="nav-item" id="n-profile" onclick="nav('profile')">👤</div>
</div>

<script>
    let db = {
        name: "", money: 10000, lastMatch: 0, matchCount: 0, 
        players: [], inventory: [], shopReset: 120, shopItems: [],
        league: [
            { name: "FK Kuličky", strength: 2, pts: 0 }, { name: "SK Beton", strength: 6, pts: 0 },
            { name: "HC Prach", strength: 12, pts: 0 }, { name: "Lvi z Lhoty", strength: 18, pts: 0 },
            { name: "Můj Tým", strength: 0, pts: 0, isPlayer: true }
        ]
    };

    const funnyLines = ["Gólman chytil míček maskou!", "Hráč trefil tyčku!", "Diváci skandují: MY CHCEME GÓL!", "Manažer nervózně přechází.", "Rozhodčí odpískal faul loktem!", "Neskutečná otočka!", "Míček létá vzduchem!"];
    let simInterval = null, matchTime = 0, isPaused = false, playerDots = [], halfTimeDone = false, usingItem = false;

    function save() { localStorage.setItem('fb_mgr_ultimate_v4', JSON.stringify(db)); }

    function nav(id) {
        usingItem = false; document.getElementById('use-msg').style.display = 'none';
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('selected'));
        document.getElementById('scr-'+id).classList.add('active');
        document.getElementById('n-'+id).classList.add('selected');
        document.getElementById('main-body').style.background = `var(--bg-${id})`;
        updateUI();
        if(id==='sleep') renderSleep(); if(id==='match') renderLeague(); if(id==='shop') renderShop(); if(id==='profile') renderBackpack();
    }

    function createTeam() {
        db.name = document.getElementById('mgr-name').value || "Manažer";
        document.querySelectorAll('.p-name').forEach((input, i) => {
            db.players.push({ name: input.value || ("Hráč "+(i+1)), stat: 1, energy: 100, lastSleep: 0, id: Date.now()+i });
        });
        db.league.find(t => t.isPlayer).name = db.name + " Club";
        generateShop();
        document.getElementById('scr-reg').classList.remove('active');
        document.getElementById('top-ui').style.display = 'flex';
        document.getElementById('nav').style.display = 'flex';
        save(); startTimers(); nav('match');
    }

    function getTeamAvg() { return Math.round(db.players.reduce((a, b) => a + b.stat, 0) / db.players.length) || 1; }
    function updateUI() { document.getElementById('money').innerText = db.money.toLocaleString(); document.getElementById('team-avg').innerText = getTeamAvg(); document.getElementById('player-count').innerText = db.players.length; }

    function runMatch() {
        let now = Date.now();
        const ready = db.players.filter(p => p.energy >= 30 && (now - p.lastSleep > 60000));
        if(ready.length < 6) return alert("Hráči spí nebo jsou vyčerpaní!");
        if(now - db.lastMatch < 60000) return alert("Úklid haly...");

        db.lastMatch = now; halfTimeDone = false; matchTime = 0;
        document.getElementById('nav').style.display = 'none';
        document.getElementById('sim-container').style.display = 'block';

        playerDots = [];
        for(let i=0; i<10; i++) playerDots.push({ x: Math.random()*300+10, y: Math.random()*180+10, dx: (Math.random()-0.5)*12, dy: (Math.random()-0.5)*12, color: i<5 ? "#fbbf24" : "#444" });

        simInterval = setInterval(() => {
            if(isPaused) return;
            const ctx = document.getElementById('sim-canvas').getContext('2d');
            ctx.fillStyle = "#000"; ctx.fillRect(0,0,320,200);
            playerDots.forEach(p => {
                p.x += p.dx; p.y += p.dy;
                if(p.x<5 || p.x>315) p.dx *= -1; if(p.y<5 || p.y>195) p.dy *= -1;
                ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, 7); ctx.fill();
            });
            matchTime += 0.033;
            let sec = Math.floor(matchTime);
            document.getElementById('sim-time-text').innerText = sec + "s / 30s";
            
            if(sec % 5 === 0 && (matchTime % 1 < 0.04)) document.getElementById('commentary-box').innerText = funnyLines[Math.floor(Math.random()*funnyLines.length)];

            if(sec === 15 && !halfTimeDone) {
                halfTimeDone = true; isPaused = true;
                document.getElementById('half-time-overlay').style.display = 'block';
                setTimeout(() => { isPaused = false; document.getElementById('half-time-overlay').style.display = 'none'; }, 800);
            }

            if(sec >= 30) {
                clearInterval(simInterval);
                finishMatch(ready);
            }
        }, 33);
    }

    function finishMatch(ready) {
        document.getElementById('sim-container').style.display = 'none';
        document.getElementById('nav').style.display = 'flex';
        let win = Math.random() < (getTeamAvg() / 20);
        if(win) { db.money += 500; db.league.find(t=>t.isPlayer).pts += 3; alert("VÝHRA! +500 🪙"); }
        else alert("PROHRA.");
        ready.slice(0,6).forEach(p => { 
            let pDb = db.players.find(x => x.id === p.id); 
            pDb.energy = Math.max(0, pDb.energy - (Math.floor(Math.random()*10)+1)); 
        });
        db.league.forEach(t => { if(!t.isPlayer) t.pts += (Math.random()>0.6?3:0); });
        save(); nav('match');
    }

    function renderSleep() {
        const c = document.getElementById('sleep-list'); c.innerHTML = "";
        db.players.forEach(p => {
            let elap = Date.now() - p.lastSleep;
            let dis = elap < 600000;
            let status = elap < 60000 ? `💤 SPÍ: ${Math.ceil((60000-elap)/1000)}s` : (elap < 600000 ? `⏳ COOLDOWN: ${Math.floor((600000-elap)/60000)}m` : "PŘIPRAVEN");
            c.innerHTML += `<div class="card" onclick="useDrinkOn(${p.id})">
                <b>${p.name}</b> (Lvl ${p.stat}) | ${p.energy}%
                <div class="energy-container"><div class="energy-fill" style="width:${p.energy}%"></div></div>
                <small>${status}</small>
                <button onclick="indivSleep(${p.id}, event)" ${dis?'disabled':''}>POSLAT SPÁT (1m)</button>
            </div>`;
        });
    }

    function indivSleep(id, e) { e.stopPropagation(); let p = db.players.find(x=>x.id===id); p.lastSleep = Date.now(); p.energy = 100; save(); renderSleep(); }

    function renderBackpack() {
        const g = document.getElementById('backpack'); g.innerHTML = "";
        for(let i=0; i<20; i++) {
            let it = db.inventory[i];
            g.innerHTML += `<div class="inv-slot" onclick="startUseItem(${i})">
                ${it ? '🥤' : ''} ${it ? `<span class="stack">x${it.count}</span>` : ''}
            </div>`;
        }
    }

    function startUseItem(idx) { if(db.inventory[idx]) { usingItem = true; nav('sleep'); document.getElementById('use-msg').style.display='block'; } }
    
    function useDrinkOn(id) {
        if(!usingItem) return;
        let p = db.players.find(x=>x.id===id);
        let drinkIdx = db.inventory.findIndex(i => i.name === 'Energeťák');
        if(drinkIdx !== -1) {
            p.energy = 100; db.inventory[drinkIdx].count--;
            if(db.inventory[drinkIdx].count <= 0) db.inventory.splice(drinkIdx, 1);
            usingItem = false; alert("Hráč " + p.name + " je jako rybička!");
            save(); nav('sleep');
        }
    }

    function generateShop() {
        db.shopItems = [];
        for(let i=0; i<2; i++) {
            let s = Math.floor(Math.random()*15)+1;
            db.shopItems.push({ type:'player', name:'Posila Lvl '+s, stat:s, price: 2000+(s*500) });
        }
        db.shopItems.push({ type:'item', name:'Energeťák', price:1000 });
        renderShop();
    }

    function renderShop() {
        const l = document.getElementById('shop-list'); l.innerHTML = "";
        db.shopItems.forEach((it, i) => {
            l.innerHTML += `<div class="card"><h3>${it.name}</h3><p>${it.price} 🪙</p><button onclick="buyShop(${i})">KOUPIT</button></div>`;
        });
    }

    function buyShop(i) {
        let it = db.shopItems[i];
        if(db.money < it.price) return alert("Málo peněz!");
        if(it.type === 'player') {
            if(db.players.length >= 20) return alert("Klub je plný!");
            db.players.push({ name: prompt("Jméno:", it.name) || it.name, stat: it.stat, energy: 100, lastSleep: 0, id: Date.now() });
        } else {
            let inv = db.inventory.find(x => x.name === it.name && x.count < 20);
            if(inv) inv.count++; else db.inventory.push({ name: it.name, count: 1 });
        }
        db.money -= it.price; db.shopItems.splice(i, 1); save(); updateUI(); renderShop();
    }

    function renderLeague() {
        const b = document.getElementById('league-body'); b.innerHTML = "";
        let pt = db.league.find(t=>t.isPlayer); pt.strength = getTeamAvg();
        db.league.sort((x,y)=>y.pts-x.pts).forEach((t, i) => {
            b.innerHTML += `<tr class="${t.isPlayer?'my-team-row':''}"><td>${i+1}</td><td>${t.name}</td><td>${t.strength}</td><td>${t.pts}</td></tr>`;
        });
    }

    function startTimers() {
        setInterval(() => {
            db.shopReset--;
            if(db.shopReset <= 0) { db.shopReset = 120; generateShop(); }
            document.getElementById('shop-timer').innerText = "Nové zboží za: " + db.shopReset + "s";
            if(document.getElementById('scr-sleep').classList.contains('active')) renderSleep();
            let wait = Math.ceil((60000-(Date.now()-db.lastMatch))/1000);
            document.getElementById('match-timer-text').innerText = wait > 0 ? "Úklid haly: " + wait + "s" : "Můžeš hrát!";
        }, 1000);
    }

    function resetGame() { if(confirm("Smazat vše?")) { localStorage.clear(); location.reload(); } }

    window.onload = () => {
        let s = localStorage.getItem('fb_mgr_ultimate_v4');
        if(s) { 
            db = JSON.parse(s); 
            document.getElementById('scr-reg').classList.remove('active'); 
            document.getElementById('top-ui').style.display='flex'; 
            document.getElementById('nav').style.display='flex'; 
            startTimers(); nav('match'); 
        }
    };
</script>
</body>
</html>
