<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager PRO v7.8</title>
    <style>
        :root { 
            --accent: #fbbf24; --bg: #05070a; --field: #064e3b; 
            --card: #161a1d; --text: #e2e8f0; --danger: #ef4444; --warning: #f59e0b; --success: #22c55e;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
        
        #top-ui { display: none; background: #111; padding: 12px; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 100; }
        .stat-val { color: var(--accent); font-weight: bold; }

        .screen { display: none; padding: 15px; padding-bottom: 100px; box-sizing: border-box; min-height: 100vh; }
        .active { display: block; }

        .card { background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 800; width: 100%; cursor: pointer; transition: 0.2s; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }

        /* ENERGY BAR */
        .energy-bar { height: 8px; background: #222; border-radius: 4px; margin-top: 6px; overflow: hidden; border: 1px solid #333; }
        .energy-fill { height: 100%; transition: width 0.5s ease, background-color 0.5s; }

        /* FIELD */
        .field { width: 100%; height: 220px; background: var(--field); border: 2px solid #059669; border-radius: 15px; position: relative; margin: 10px 0; }
        .pos-btn { position: absolute; width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,0.6); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; }
        #p-LW { top: 20%; left: 10%; } #p-C { top: 10%; left: 43%; } #p-RW { top: 20%; right: 10%; }
        #p-LD { bottom: 15%; left: 20%; } #p-RD { bottom: 15%; right: 20%; }

        /* MATCH */
        .match-box { width: 100%; height: 180px; background: var(--field); border-radius: 12px; position: relative; overflow: hidden; border: 2px solid #059669; display: none; }
        .goal { position: absolute; width: 10px; height: 40px; background: #fff; top: 70px; }
        .ball { position: absolute; width: 8px; height: 8px; background: #fff; border-radius: 50%; }

        .bag-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; }
        .slot { aspect-ratio: 1; background: #111; border: 1px solid #333; border-radius: 5px; display: flex; align-items: center; justify-content: center; position: relative; }

        #bot-nav { display: none; position: fixed; bottom: 0; width: 100%; height: 70px; background: #111; justify-content: space-around; align-items: center; border-top: 1px solid #333; z-index: 1000; }
        .nav-item { font-size: 1.5rem; opacity: 0.4; transition: 0.3s; cursor: pointer; }
        .nav-item.active { opacity: 1; color: var(--accent); }
    </style>
</head>
<body>

    <div id="top-ui">
        <div style="display:flex; gap:15px;">
            <div>🪙 <span id="ui-money" class="stat-val">0</span></div>
            <div>LVL: <span id="ui-lvl" class="stat-val">0</span></div>
        </div>
        <div>Hráči: <span id="ui-count" class="stat-val">0</span></div>
    </div>

    <div id="scr-reg" class="screen active">
        <h2 style="text-align:center">FLORBALOVÝ MANAŽER</h2>
        <div class="card">
            <input type="text" id="in-team" placeholder="Název tvého klubu..." style="width:100%; padding:15px; background:#000; border:1px solid #444; color:#fff; border-radius:8px; box-sizing:border-box; margin-bottom:15px;">
            <button onclick="initGame()">ZALOŽIT KLUB</button>
        </div>
    </div>

    <div id="scr-match" class="screen">
        <button onclick="prepni('profile')" style="margin-bottom:10px; background:#333; color:#fff;">🛡️ UPRAVIT SESTAVU</button>
        <div id="match-area" class="match-box">
            <div class="goal" style="left:0"></div>
            <div class="goal" style="right:0"></div>
            <div id="m-ball" class="ball"></div>
            <div style="position:absolute; top:5px; width:100%; text-align:center; font-weight:bold;">
                <span id="score-h">0</span> : <span id="score-a">0</span>
            </div>
        </div>
        <button id="btn-play" onclick="playMatch()">ODEHRÁT ZÁPAS</button>
        <div class="card" style="margin-top:15px;">
            <h4>LIGOVÁ TABULKA</h4>
            <div id="liga-tabulka"></div>
        </div>
    </div>

    <div id="scr-sleep" class="screen">
        <h3>🛌 KABINA & ODPOČINEK</h3>
        <div id="hraci-list"></div>
    </div>

    <div id="scr-profile" class="screen">
        <div class="field">
            <div id="p-LW" class="pos-btn" onclick="openSelect('LW')">LW</div>
            <div id="p-C" class="pos-btn" onclick="openSelect('C')">C</div>
            <div id="p-RW" class="pos-btn" onclick="openSelect('RW')">RW</div>
            <div id="p-LD" class="pos-btn" onclick="openSelect('LD')">LD</div>
            <div id="p-RD" class="pos-btn" onclick="openSelect('RD')">RD</div>
        </div>
        <div id="select-box"></div>
        <h4>BATOH (4×5)</h4>
        <div class="bag-grid" id="bag-ui"></div>
    </div>

    <div id="scr-shop" class="screen">
        <h3>DRAFT BALÍČKY</h3>
        <div class="card">
            <button onclick="buyPack('bronz')">BRONZ (1-9 LVL) - 5 000 🪙</button>
            <button onclick="buyPack('silver')" style="margin-top:10px;">STŘÍBRO (10-19 LVL) - 10 000 🪙</button>
            <button onclick="buyPack('gold')" style="margin-top:10px;">GOLD (20-29 LVL) - 15 000 🪙</button>
        </div>
    </div>

    <div id="pack-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:2000; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
        <div id="pack-anim-text" style="font-size:5rem; color:var(--accent); font-weight:900;">?</div>
        <div id="pack-info" style="margin:20px 0; font-size:1.5rem;"></div>
        <button id="pack-close" style="display:none; width:200px" onclick="closePack()">PŘEVZÍT HRÁČE</button>
    </div>

    <div id="bot-nav">
        <div class="nav-item" onclick="prepni('sleep')">🛌</div>
        <div class="nav-item active" onclick="prepni('match')">🥅</div>
        <div class="nav-item" onclick="prepni('profile')">👤</div>
        <div class="nav-item" onclick="prepni('shop')">📦</div>
    </div>

<script>
    let db = {
        m: 10000, p: [], b: Array(20).fill(null),
        lineup: {LW:null, C:null, RW:null, LD:null, RD:null},
        name: "", matches: 0,
        league: [{n:"Tatran", lvl:5, pts:0}, {n:"Vítkovice", lvl:8, pts:0}]
    };

    const names = ["Petr","Filip","Marek","Honza","Adam","Lukáš"];
    const sNames = ["Rychlý","Tvrdý","Ostrý","Modrý","Nový","Malý"];

    function save() { localStorage.setItem('fb_v7_final', JSON.stringify(db)); }

    function prepni(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('scr-' + id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        const navMap = {sleep:0, match:1, profile:2, shop:3};
        document.querySelectorAll('.nav-item')[navMap[id]].classList.add('active');
        
        if(id==='profile') { renderField(); renderBag(); }
        if(id==='sleep') renderSleep();
        if(id==='match') renderLeague();
        updateUI();
    }

    function initGame() {
        let n = document.getElementById('in-team').value;
        if(!n) return alert("Zadej název!");
        db.name = n;
        ["LW","C","RW","LD","RD"].forEach((pos, i) => {
            let h = {id: Date.now()+i, n: names[i%names.length]+" "+sNames[i%sNames.length], lvl: 1, pos: pos, e: 100, lastSleep: 0, sleepUntil: 0};
            db.p.push(h);
            db.lineup[pos] = h.id;
        });
        db.league.push({n: n, lvl: 1, pts: 0, isP: true});
        document.getElementById('scr-reg').classList.remove('active');
        document.getElementById('top-ui').style.display = 'flex';
        document.getElementById('bot-nav').style.display = 'flex';
        prepni('match');
        save();
    }

    function updateUI() {
        document.getElementById('ui-money').innerText = db.m.toLocaleString();
        document.getElementById('ui-count').innerText = db.p.length;
        let total = 0, count = 0;
        for(let pos in db.lineup) {
            let h = db.p.find(x => x.id === db.lineup[pos]);
            if(h) { total += h.lvl; count++; }
        }
        let avg = count === 5 ? Math.round(total/5) : 0;
        document.getElementById('ui-lvl').innerText = avg;
        let pT = db.league.find(x => x.isP); if(pT) pT.lvl = avg;
        document.getElementById('btn-play').disabled = (count < 5);
    }

    function renderSleep() {
        let div = document.getElementById('hraci-list');
        div.innerHTML = "";
        let now = Date.now();
        db.p.forEach(h => {
            let isSleeping = h.sleepUntil > now;
            let cooldown = h.lastSleep + 600000 > now; // 10 min
            let color = h.e < 30 ? 'var(--danger)' : (h.e < 70 ? 'var(--warning)' : 'var(--success)');
            
            div.innerHTML += `
            <div class="card">
                <div style="display:flex; justify-content:space-between">
                    <b>${h.n}</b> <span>${h.pos} | LVL ${h.lvl}</span>
                </div>
                <div class="energy-bar"><div class="energy-fill" style="width:${h.e}%; background:${color}"></div></div>
                <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
                    <small>Energie: ${h.e}% ${isSleeping ? '💤 (SPÍ...)' : ''}</small>
                    <button onclick="startSleep(${h.id})" style="width:auto; padding:8px 12px; font-size:0.7rem;" 
                        ${isSleeping || cooldown ? 'disabled' : ''}>
                        ${isSleeping ? 'SPÍ...' : (cooldown ? 'REGEN...' : 'SPÁNEČEK')}
                    </button>
                </div>
            </div>`;
        });
    }

    function startSleep(id) {
        let h = db.p.find(x => x.id === id);
        h.e = 100;
        h.lastSleep = Date.now();
        h.sleepUntil = Date.now() + 60000; // 1 minuta spánku
        save(); renderSleep();
    }

    function playMatch() {
        // Kontrola jestli někdo v sestavě nespí
        for(let pos in db.lineup) {
            let h = db.p.find(x => x.id === db.lineup[pos]);
            if(h && h.sleepUntil > Date.now()) return alert(h.n + " zrovna spí! Počkej až se probudí.");
        }

        document.getElementById('match-area').style.display = 'block';
        document.getElementById('btn-play').style.display = 'none';
        let sh = 0, sa = 0, timer = 0;
        const ball = document.getElementById('m-ball');
        
        let matchInt = setInterval(() => {
            timer++;
            ball.style.left = Math.random()*90 + "%";
            ball.style.top = Math.random()*80 + "%";
            if(Math.random()<0.1) Math.random()>0.5 ? sh++ : sa++;
            document.getElementById('score-h').innerText = sh;
            document.getElementById('score-a').innerText = sa;
            if(timer > 15) { clearInterval(matchInt); finishMatch(sh, sa); }
        }, 500);
    }

    function finishMatch(sh, sa) {
        let pT = db.league.find(x => x.isP);
        let win = false;
        if(db.matches === 0) win = true;
        else {
            let oppLvl = pT.lvl < 10 ? Math.floor(Math.random()*8)+1 : Math.floor(Math.random()*15)+5;
            let diff = pT.lvl - oppLvl;
            let probTable = {"-8":1, "-7":5, "-6":10, "-5":15, "-4":20, "-3":25, "-2":30, "-1":50, "0":67, "1":75};
            let prob = probTable[diff] || (diff >= 2 ? 99 : 1);
            win = (Math.random()*100 < prob);
        }

        if(win) { db.m += 1000; pT.pts += 3; alert("VÝHRA! +1000 🪙"); } else { alert("PROHRA."); }
        db.matches++;

        // Energie jen těm v LINEUP
        for(let pos in db.lineup) {
            let h = db.p.find(x => x.id === db.lineup[pos]);
            if(h) h.e = Math.max(0, h.e - (Math.floor(Math.random()*10)+1));
        }

        document.getElementById('match-area').style.display = 'none';
        document.getElementById('btn-play').style.display = 'block';
        save(); renderLeague(); updateUI();
    }

    // Ostatní systémové funkce (Shop, Bag, Field) z v7.0 zůstávají stejné...
    function renderField() {
        for(let pos in db.lineup) {
            let h = db.p.find(x => x.id === db.lineup[pos]);
            let el = document.getElementById('p-' + pos);
            el.innerHTML = h ? h.lvl : pos;
            el.style.backgroundColor = h ? "var(--accent)" : "rgba(0,0,0,0.6)";
            el.style.color = h ? "#000" : "#fff";
        }
    }
    function openSelect(pos) {
        let div = document.getElementById('select-box');
        div.innerHTML = `<div class="card"><h4>Vyber ${pos}:</h4>`;
        db.p.filter(x => x.pos === pos).forEach(h => {
            div.innerHTML += `<button onclick="setPos('${pos}', ${h.id})" style="margin:2px 0; background:#333; color:#fff;">${h.n} (LVL ${h.lvl})</button>`;
        });
        div.innerHTML += `</div>`;
    }
    function setPos(pos, id) { db.lineup[pos] = id; renderField(); updateUI(); save(); }
    function renderLeague() {
        let div = document.getElementById('liga-tabulka');
        let html = "<table>";
        db.league.sort((a,b) => b.pts - a.pts).forEach(t => {
            html += `<tr style="${t.isP?'color:var(--accent)':''}"><td>${t.n}</td><td>LVL ${t.lvl}</td><td>${t.pts} b.</td></tr>`;
        });
        div.innerHTML = html + "</table>";
    }
    function renderBag() {
        let ui = document.getElementById('bag-ui'); ui.innerHTML = "";
        db.b.forEach(slot => { ui.innerHTML += `<div class="slot">${slot?'🥤':''}</div>`; });
    }
    function buyPack(type) {
        let cost = type==='bronz'?5000:type==='silver'?10000:15000;
        if(db.m < cost) return alert("Nemáš peníze!");
        db.m -= cost;
        document.getElementById('pack-overlay').style.display = 'flex';
        let txt = document.getElementById('pack-anim-text');
        let range = type==='bronz'?[1,9]:type==='silver'?[10,19]:[20,29];
        let hN = names[Math.floor(Math.random()*names.length)] + " " + sNames[Math.floor(Math.random()*sNames.length)];
        window.tempH = {id: Date.now(), n: hN, lvl: Math.floor(Math.random()*(range[1]-range[0]+1))+range[0], pos: ["LW","C","RW","LD","RD"][Math.floor(Math.random()*5)], e: 100, lastSleep: 0, sleepUntil: 0};
        setTimeout(() => txt.innerText = hN[0], 800);
        setTimeout(() => {
            txt.innerText = window.tempH.lvl;
            document.getElementById('pack-info').innerHTML = `<b>${window.tempH.n}</b><br>${window.tempH.pos}`;
            document.getElementById('pack-close').style.display = 'block';
        }, 2000);
    }
    function closePack() {
        db.p.push(window.tempH); document.getElementById('pack-overlay').style.display = 'none';
        document.getElementById('pack-close').style.display = 'none'; save(); updateUI();
    }

    // Refresh časovače v kabině každou vteřinu
    setInterval(() => { if(document.getElementById('scr-sleep').classList.contains('active')) renderSleep(); }, 1000);

    window.onload = () => {
        let s = localStorage.getItem('fb_v7_final');
        if(s) {
            db = JSON.parse(s);
            document.getElementById('scr-reg').classList.remove('active');
            document.getElementById('top-ui').style.display = 'flex';
            document.getElementById('bot-nav').style.display = 'flex';
            prepni('match');
        }
    }
</script>
</body>
</html>
