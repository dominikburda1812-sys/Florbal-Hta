<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floorball Manager | Version 6.3</title>
    <style>
        :root { 
            --accent: #fbbf24; --bg: #05070a; --glass: rgba(15, 20, 30, 0.95);
            --bronz: #cd7f32; --silver: #c0c0c0; --gold: #ffd700;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; overflow: hidden; }
        
        .top-nav { background: var(--glass); display: flex; justify-content: space-around; padding: 15px 5px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .stat-val { color: var(--accent); display: block; font-size: 1.1rem; font-weight: bold; }
        
        .screen { display: none; height: 100vh; padding: 20px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .header { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; border-left: 4px solid var(--accent); padding-left: 15px; display: flex; justify-content: space-between; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 15px; margin-bottom: 10px; }

        /* TACTICAL FIELD */
        .tactical-field { 
            width: 100%; height: 350px; background: #064e3b; border: 2px solid #059669; border-radius: 15px; 
            position: relative; margin-top: 10px; background-image: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 20px 20px;
        }
        .pos-slot { 
            position: absolute; width: 60px; height: 60px; border: 2px dashed rgba(255,255,255,0.3); 
            border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; color: #fff;
        }
        .pos-occupied { border-style: solid; border-color: var(--accent); background: rgba(251, 191, 36, 0.2); }
        
        /* Positions */
        #pos-LW { top: 20%; left: 15%; }
        #pos-C  { top: 10%; left: 42%; }
        #pos-RW { top: 20%; right: 15%; }
        #pos-LD { bottom: 20%; left: 20%; }
        #pos-RD { bottom: 20%; right: 20%; }

        .p-name-tag { font-size: 0.6rem; font-weight: bold; text-align: center; margin-top: 2px; }

        /* Inventory List for Selection */
        .selection-list { max-height: 200px; overflow-y: auto; margin-top: 15px; }
        .select-item { padding: 10px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }

        /* Styles from 6.2 */
        .match-box { width: 100%; height: 200px; background: #064e3b; border-radius: 16px; position: relative; margin-bottom: 15px; display: none; overflow: hidden; border: 3px solid #059669; }
        .scoreboard { position: absolute; top: 0; width: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; padding: 8px 0; font-weight: 900; z-index: 10; font-size: 1.4rem; }
        canvas { width: 100%; height: 100%; }

        .pack-card { padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 10px; border: 2px solid rgba(255,255,255,0.1); }
        .pack-gold { background: linear-gradient(145deg, #443700, #1a1500); border-color: var(--gold); }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: var(--glass); display: flex; justify-content: space-around; align-items: center; z-index: 100; border-top: 1px solid rgba(255,255,255,0.1); }
        .nav-item { font-size: 1.6rem; opacity: 0.4; transition: 0.2s; cursor: pointer; }
        .nav-item.active { opacity: 1; color: var(--accent); }
        button { background: linear-gradient(135deg, #fbbf24, #d97706); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; width: 100%; margin: 5px 0; }
    </style>
</head>
<body>

    <div id="top-ui" class="top-nav" style="display:none">
        <div align="center">BANKA <span class="stat-val" id="m-money">0</span></div>
        <div align="center">SÍLA TÝMU <span class="stat-val" id="m-avg">0</span></div>
        <div align="center">MĚNA <span class="stat-val">🪙</span></div>
    </div>

    <div id="scr-reg" class="screen active">
        <div class="header">Registrace</div>
        <div class="card">
            <input type="text" id="reg-team" placeholder="Název týmu..." style="width:100%; padding:15px; background:#111; border:1px solid #333; color:#fff; border-radius:8px; margin-bottom:15px; box-sizing:border-box;">
            <button onclick="initGame()">Vytvořit klub</button>
        </div>
    </div>

    <div id="scr-match" class="screen">
        <div class="header">Zápas</div>
        <div id="match-anim" class="match-box">
            <div class="scoreboard"><span id="score-h">0</span> - <span id="score-a">0</span></div>
            <canvas id="match-canvas"></canvas>
        </div>
        <button onclick="showScr('lineup')">📋 UPRAVIT SESTAVU</button>
        <button id="btn-match-start" onclick="startMatchSimulation()">HRÁT ZÁPAS</button>
        <div class="card" style="margin-top:10px;"><table style="width:100%"><tbody id="league-table"></tbody></table></div>
    </div>

    <div id="scr-lineup" class="screen">
        <div class="header">Sestava na hřišti <button class="btn-small" style="width:auto" onclick="showScr('match')">ZPĚT</button></div>
        <div class="tactical-field" id="field">
            <div class="pos-slot" id="pos-LW" onclick="openSelection('LW')">LW<div class="p-name-tag">Prázdno</div></div>
            <div class="pos-slot" id="pos-C"  onclick="openSelection('C')">C<div class="p-name-tag">Prázdno</div></div>
            <div class="pos-slot" id="pos-RW" onclick="openSelection('RW')">RW<div class="p-name-tag">Prázdno</div></div>
            <div class="pos-slot" id="pos-LD" onclick="openSelection('LD')">LD<div class="p-name-tag">Prázdno</div></div>
            <div class="pos-slot" id="pos-RD" onclick="openSelection('RD')">RD<div class="p-name-tag">Prázdno</div></div>
        </div>
        <div id="selection-area" class="selection-list"></div>
    </div>

    <div id="scr-sleep" class="screen">
        <div class="header">Kabina</div>
        <div id="sleep-list"></div>
    </div>

    <div id="scr-shop" class="screen">
        <div class="header">Draft</div>
        <div class="pack-card pack-gold" onclick="buyPack('gold')">ZLATÝ BALÍČEK (15k 🪙)</div>
    </div>

    <div id="bot-nav" class="bottom-nav" style="display:none">
        <div class="nav-item" onclick="showScr('sleep')">🛌</div>
        <div class="nav-item active" onclick="showScr('match')">🥅</div>
        <div class="nav-item" onclick="showScr('shop')">📦</div>
    </div>

<script>
    let state = {
        money: 10000, players: [], lineup: {LW:null, C:null, RW:null, LD:null, RD:null},
        nextMatchTime: 0, teamName: "",
        league: [{n:"Tatran", a:10, p:0, isPlayer:false}, {n:"Boleslav", a:15, p:0, isPlayer:false}]
    };

    const posTypes = ["LW", "C", "RW", "LD", "RD"];
    function genName() { 
        const n = ["Adam","Filip","Jan","Petr"]; 
        const s = ["Novák","Rychlý","Tvrdý","Malý"];
        return n[Math.floor(Math.random()*n.length)] + " " + s[Math.floor(Math.random()*s.length)];
    }

    function initGame() {
        state.teamName = document.getElementById('reg-team').value || "Můj Klub";
        // Startovní hráči s pozicemi
        posTypes.forEach((pos, i) => {
            state.players.push({name: genName(), stat: 5, energy: 100, id: Date.now()+i, pos: pos, sleepUntil: 0});
            state.lineup[pos] = state.players[i].id;
        });
        state.league.push({n: state.teamName, a: 5, p: 0, isPlayer: true});
        document.getElementById('scr-reg').style.display='none';
        document.getElementById('bot-nav').style.display='flex';
        document.getElementById('top-ui').style.display='flex';
        save(); showScr('match');
    }

    function showScr(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('scr-' + id).classList.add('active');
        if(id === 'lineup') renderField();
        if(id === 'match') renderLeague();
        if(id === 'sleep') renderSleep();
        updateUI();
    }

    function renderField() {
        posTypes.forEach(pos => {
            const slot = document.getElementById('pos-' + pos);
            const pId = state.lineup[pos];
            const p = state.players.find(x => x.id === pId);
            if(p) {
                slot.classList.add('pos-occupied');
                slot.querySelector('.p-name-tag').innerText = p.name + " (" + p.stat + ")";
            } else {
                slot.classList.remove('pos-occupied');
                slot.querySelector('.p-name-tag').innerText = "Prázdno";
            }
        });
    }

    function openSelection(pos) {
        const area = document.getElementById('selection-area');
        area.innerHTML = `<h3>Vyber pro: ${pos}</h3>`;
        const eligible = state.players.filter(p => p.pos === pos);
        
        eligible.forEach(p => {
            area.innerHTML += `
                <div class="select-item">
                    ${p.name} (Sila: ${p.stat}) 
                    <button class="btn-small" style="width:auto" onclick="assign('${pos}', ${p.id})">VYBRAT</button>
                </div>`;
        });
    }

    function assign(pos, pId) {
        state.lineup[pos] = pId;
        renderField();
        save();
        updateUI();
    }

    function updateUI() {
        document.getElementById('m-money').innerText = state.money.toLocaleString();
        let power = 0;
        Object.values(state.lineup).forEach(id => {
            let p = state.players.find(x => x.id === id);
            if(p) power += p.stat;
        });
        document.getElementById('m-avg').innerText = power;
        let pT = state.league.find(t=>t.isPlayer); if(pT) pT.a = power;

        let cd = Math.max(0, Math.ceil((state.nextMatchTime - Date.now())/1000));
        let btn = document.getElementById('btn-match-start');
        btn.disabled = cd > 0 || Object.values(state.lineup).includes(null);
        if(cd > 0) btn.innerText = "ČEKEJ ("+cd+"s)"; else btn.innerText = "HRÁT ZÁPAS";
    }

    // SIMULACE (z v6.2)
    function startMatchSimulation() {
        state.nextMatchTime = Date.now() + 60000;
        document.getElementById('match-anim').style.display = 'block';
        const canvas = document.getElementById('match-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
        let t=30, h=0, a=0;
        let loop = setInterval(() => {
            t--; if(Math.random()<0.1) { (Math.random()>0.5)?h++:a++; }
            document.getElementById('score-h').innerText = h; document.getElementById('score-a').innerText = a;
            if(t<=0){ clearInterval(loop); document.getElementById('match-anim').style.display='none'; 
                if(h>a) { state.money += 800; state.league.find(l=>l.isPlayer).p += 3; }
                save(); showScr('match');
            }
        }, 1000);
        function d(){ if(document.getElementById('match-anim').style.display==='block'){
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle="#fbbf24"; ctx.beginPath(); ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, 5, 0, 7); ctx.fill();
            requestAnimationFrame(d);
        }} d();
    }

    function buyPack(type) {
        if(state.money < 15000) return alert("Málo peněz!");
        state.money -= 15000;
        let pos = posTypes[Math.floor(Math.random()*posTypes.length)];
        let p = {name: genName(), stat: Math.floor(Math.random()*20)+5, energy:100, id:Date.now(), pos: pos, sleepUntil:0};
        state.players.push(p);
        alert(`Získán ${p.name}! Pozice: ${pos}`);
        save(); updateUI();
    }

    function renderSleep() {
        const list = document.getElementById('sleep-list'); list.innerHTML = "";
        state.players.forEach(p => {
            list.innerHTML += `<div class="card"><b>${p.name}</b> [${p.pos}] - Sila: ${p.stat}</div>`;
        });
    }

    function renderLeague() {
        const b = document.getElementById('league-table'); b.innerHTML = "";
        state.league.sort((a,b)=>b.p-a.p).forEach(t => {
            b.innerHTML += `<tr><td>${t.n}</td><td>LVL ${t.a}</td><td>${t.p} b.</td></tr>`;
        });
    }

    function save() { localStorage.setItem('fb_v6_3', JSON.stringify(state)); }
    window.onload = () => {
        let s = localStorage.getItem('fb_v6_3');
        if(s) { state = JSON.parse(s); document.getElementById('scr-reg').style.display='none'; document.getElementById('bot-nav').style.display='flex'; document.getElementById('top-ui').style.display='flex'; showScr('match'); }
        setInterval(updateUI, 1000);
    };
</script>
</body>
</html>
